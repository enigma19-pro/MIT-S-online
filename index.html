                                        {floatingEffect && floatingEffect.player === 2 && (
                                            <div className={`absolute top-1/2 left-1/2 animate-float-damage font-mono-custom font-extrabold text-2xl px-4 py-2 rounded-xl shadow-2xl z-20 ${
                                                floatingEffect.type === 'damage' ? 'bg-rose-600 text-white border border-rose-400 glow-red' :
                                                floatingEffect.type === 'dodge' ? 'bg-cyan-500 text-slate-950 border border-cyan-200 glow-cyan' :
                                                'bg-slate-700 text-slate-200'
                                            }`}>
                                                {floatingEffect.text}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* ACTION CONTROL & DICE DISPLAY */}
                                {gameState === 'BATTLE' && (
                                    <div className="glass-panel rounded-3xl p-5 border border-slate-800 flex flex-col items-center justify-center space-y-4 text-center">
                                        <div className="text-xs font-mono-custom text-slate-400 flex items-center gap-2">
                                            <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                                            TURNO ACTUAL: <strong className="text-cyan-300 uppercase">JUGADOR {currentTurnPlayer} ({currentTurnPlayer === 1 ? activeP1Mit.name : activeP2Mit.name})</strong>
                                        </div>

                                        <div className="py-2">
                                            <div className={`w-20 h-20 rounded-2xl border-4 flex items-center justify-center font-mono-custom text-4xl font-black transition-all shadow-2xl ${
                                                isRolling ? 'animate-bounce border-cyan-400 bg-cyan-950/60 text-cyan-300 glow-cyan' : 'border-slate-700 bg-slate-900 text-slate-100'
                                            }`}>
                                                {currentRollValue}
                                            </div>
                                        </div>

                                        <div className="w-full max-w-sm">
                                            {(
                                                gameMode !== 'ONLINE' ||
                                                (combatPhase === 'ATTACK_ROLL'
                                                    ? currentTurnPlayer === (isRoomHost ? 1 : 2)
                                                    : currentTurnPlayer !== (isRoomHost ? 1 : 2))
                                            ) && (
                                                <>
                                            {combatPhase === 'ATTACK_ROLL' && (
                                                <button
                                                    disabled={isRolling || isTurnProcessing || (gameMode === 'AI' && currentTurnPlayer === 2)}
                                                    onClick={handleAttackRoll}
                                                    className={`w-full py-4 rounded-2xl font-black text-base uppercase tracking-wider transition-all font-mono-custom ${
                                                        isRolling || isTurnProcessing || (gameMode === 'AI' && currentTurnPlayer === 2)
                                                        ? 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'
                                                        : 'bg-gradient-to-r from-amber-500 to-red-600 text-slate-950 shadow-lg shadow-amber-500/20 hover:brightness-110 active:scale-95 cursor-pointer'
                                                    }`}
                                                >
                                                    {isRolling ? 'Lanzando Dado...' : (gameMode === 'AI' && currentTurnPlayer === 2) ? 'IA Pensando...' : `🎲 Lanzar Dado de Ataque`}
                                                </button>
                                            )}

                                            {combatPhase === 'DEFENSE_ROLL' && (
                                                <button
                                                    disabled={isRolling || isTurnProcessing || (gameMode === 'AI' && currentTurnPlayer === 1)}
                                                    onClick={() => handleDefenseRoll()}
                                                    className={`w-full py-4 rounded-2xl font-black text-base uppercase tracking-wider transition-all font-mono-custom ${
                                                        isRolling || isTurnProcessing || (gameMode === 'AI' && currentTurnPlayer === 1)
                                                        ? 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'
                                                        : 'bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 shadow-lg shadow-cyan-500/20 hover:brightness-110 active:scale-95 cursor-pointer'
                                                    }`}
                                                >
                                                    {isRolling ? 'Lanzando Dado...' : (gameMode === 'AI' && currentTurnPlayer === 1) ? 'IA Esquivando...' : `🛡️ Lanzar Dado de Esquive`}
                                                </button>
                                            )}
                                                </>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* COMBAT LOG */}
                                <div className="glass-panel rounded-2xl p-4 border border-slate-800">
                                    <h4 className="text-xs font-bold font-mono-custom text-slate-400 uppercase tracking-widest mb-2">BITÁCORA DE COMBATE</h4>
                                    <div ref={logContainerRef} className="h-32 overflow-y-auto space-y-1 text-xs font-mono-custom pr-2">
                                        {combatLog.map((log, index) => (
                                            <div 
                                                key={index} 
                                                className={`p-1.5 rounded ${
                                                    log.type === 'attack_hit' ? 'bg-amber-950/30 text-amber-300 border-l-2 border-amber-500' :
                                                    log.type === 'attack_miss' ? 'bg-slate-900 text-slate-400 border-l-2 border-slate-600' :
                                                    log.type === 'defense_success' ? 'bg-cyan-950/30 text-cyan-300 border-l-2 border-cyan-500' :
                                                    log.type === 'defense_fail' ? 'bg-rose-950/30 text-rose-300 border-l-2 border-rose-500' :
                                                    log.type === 'victory' ? 'bg-yellow-500/20 text-yellow-300 font-bold border-l-4 border-yellow-500' :
                                                    'bg-slate-900/60 text-slate-300'
                                                }`}
                                            >
                                                {log.text}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                    </>
                                )}
                            </div>
                        )}
                    </main>

                    {/* FOOTER */}
                    <footer className="text-center py-4 text-xs font-mono-custom text-slate-500 border-t border-slate-900 mt-6">
                        MIT’S Engine — Manual Oficial v1.0
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
