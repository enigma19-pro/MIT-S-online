                        setCurrentRollValue(passiveAttack.roll);
                        const atkData = { success: true, damage: passiveAttack.damage, roll: passiveAttack.roll, unstoppable: passiveAttack.unstoppable, attackerPassiveState: passiveAttack.state, counterChain: aiMit.passiveState?.counterSequence?.phase === 'SECOND' };
                        if (aiMit.passiveState?.counterSequence?.phase === 'FIRST') {
                            const forcedResult = window.MITSGameRules.resolvePassiveDefense({ attacker: { ...aiMit, passiveState: passiveAttack.state }, defender: activeP1Mit, attackDamage: passiveAttack.damage, forceHit: true, allowCounterTrigger: false });
                            const counterLog = [...combatLog, { type: 'attack_hit', text: `⚔️ Contraataque 1/2 de ${aiMit.name}: no puedes defenderte.` }];
                            setCombatLog(counterLog);
                            setCombatPhase('RESOLVING');
                            setIsTurnProcessing(false);
                            publishFloatingEffect({ player: 2, text: 'CONTRAATAQUE 1/2', type: 'hit' });
                            applyDamageToDefender(1, forcedResult.damage, counterLog, null, forcedResult, 2);
                            return;
                        }
                        setAttackResult(atkData);
                        setCombatPhase('DEFENSE_ROLL');
                        setIsTurnProcessing(false);
                        setCombatLog(prev => [...prev, {
                            type: 'attack_hit',
                            text: `🎯 Jugador 2 (IA) sacó [${passiveAttack.roll}] → ¡Ataque Exitoso! Lanza tu dado de esquive.`
                        }]);
                        publishFloatingEffect({
                            player: 2,
                            text: '¡ACERTÓ!',
                            type: 'hit'
                        });
                        // El bloqueo se libera al terminar la resolución de este turno.
                    } else {
                        playSound('fail');
                        setAttackResult({ success: false, damage: 0, roll: passiveAttack.roll });
                        setCombatPhase('RESOLVING');
                        setCombatLog(prev => [...prev, {
                            type: 'attack_miss',
                            text: `❌ Jugador 2 (IA) sacó [${roll}] → Ataque Fallado. Tu turno.`
                        }]);
                        publishFloatingEffect({
                            player: 1,
                            text: '¡FALLÓ!',
                            type: 'miss'
                        });
                        // Un fallo consume el turno: no se vuelve a lanzar el dado.
                        scheduleGameTimeout(() => endTurn(2), 1000);
                    }
                });
            };

            const gameOver = async (winnerPlayerNum, logOverride = null) => {
                setWinnerPlayer(winnerPlayerNum);
                setGameState('GAMEOVER');
                setIsTurnProcessing(false);
                const baseLog = Array.isArray(logOverride) ? logOverride : combatLog;
                const victoryLog = [...baseLog, {
                    type: 'victory',
                    text: `🏆 ¡FIN DE LA PARTIDA! Jugador ${winnerPlayerNum} ha ganado.`
                }];
                setCombatLog(victoryLog);
                if (gameMode === 'ONLINE') {
                    await syncOnline({ status: 'gameover', winner: winnerPlayerNum, combatLog: victoryLog });
                }
            };

            const returnToOnlineLobby = async () => {
                playSound('click');

                // Cierra por completo la sesión local anterior antes de mostrar el lobby.
                // Así ningún timeout/animación de ese combate puede alterar el estado nuevo.
                gameSessionRef.current += 1;
                cancelGameTimers();
                isRollingRef.current = false;
                setIsRolling(false);
                setIsTurnProcessing(false);
                aiTurnInProgressRef.current = false;
                isSubmittingMitRef.current = false;

                if (onlineListenerRef.current && window.MITSFirebase) {
                    window.MITSFirebase.off(onlineListenerRef.current.ref, 'value', onlineListenerRef.current.handler);
                    if (onlineListenerRef.current.presenceRef && onlineListenerRef.current.presenceHandler) {
                        window.MITSFirebase.off(onlineListenerRef.current.presenceRef, 'value', onlineListenerRef.current.presenceHandler);
                    }
                    onlineListenerRef.current = null;
                }
                if (presenceGraceTimerRef.current !== null) {
                    clearTimeout(presenceGraceTimerRef.current);
                    presenceGraceTimerRef.current = null;
                }
                // Volver al lobby es solo un cambio de pantalla local:
                // dejamos activo onDisconnect para detectar una desconexión real
                // si la conexión se pierde más adelante. El rival conserva GAMEOVER
                // mientras esta conexión siga viva.
                
                setGameState('ONLINE_LOBBY');
                setGameMode('ONLINE');
                setRoomCode('');
                setRoomInput('');
                setOnlineStatus('');
                setDisconnectedPlayer(null);
                setWinnerPlayer(null);
                setBerserkerRebuild(null);
                setIsRoomHost(false);
                setBuilderPlayer(1);
                setP1Mits([]);
                setP2Mits([]);
                setActiveP1Index(0);
                setActiveP2Index(0);
                setCurrentTurnPlayer(1);
                currentTurnPlayerRef.current = 1;
                setCombatPhase('ATTACK_ROLL');
                setCurrentRollValue(1);
                lastRollValueRef.current = 1;
                setAttackResult(null);
                setFloatingEffect(null);
                setCombatLog([]);
                setCurrentDNums([]);
                setCurrentANums([]);
                setSelectedClass(MIT_CLASSES[2]);
            };

            const resetGame = async () => {
                playSound('click');
                const previousRoomCode = roomCode;
                const leavingOnlineGame = gameMode === 'ONLINE' && previousRoomCode && window.MITSFirebase;
                const firebase = window.MITSFirebase;

                // Invalida callbacks antiguos y detiene cualquier tirada/temporizador pendiente.
                gameSessionRef.current += 1;
                cancelGameTimers();
                isSubmittingMitRef.current = false;

                // Desuscribe primero al jugador que reinicia: player_left es para el rival.
                if (leavingOnlineGame && onlineListenerRef.current) {
                    firebase.off(onlineListenerRef.current.ref, 'value', onlineListenerRef.current.handler);
                    if (onlineListenerRef.current.presenceRef && onlineListenerRef.current.presenceHandler) {
                        firebase.off(onlineListenerRef.current.presenceRef, 'value', onlineListenerRef.current.presenceHandler);
                    }
                    onlineListenerRef.current = null;
                }
                if (presenceGraceTimerRef.current !== null) {
                    clearTimeout(presenceGraceTimerRef.current);
                    presenceGraceTimerRef.current = null;
                }
                stopOnlinePresenceListener();

                // El reinicio local no debe depender de la latencia de Firebase.
                setGameState('MENU');
                setRoomCode('');
                setRoomInput('');
                setOnlineStatus('');
                setIsRoomHost(false);
                setDisconnectedPlayer(null);
                setWinnerPlayer(null);
                setBerserkerRebuild(null);
                setGameMode('AI');
                setP1Mits([]);
                setP2Mits([]);
                setBuilderPlayer(1);
                setSelectedClass(MIT_CLASSES[2]);
                setCurrentDNums([]);
                setCurrentANums([]);
                setActiveP1Index(0);
                setActiveP2Index(0);
                setCurrentTurnPlayer(1);
                currentTurnPlayerRef.current = 1;
                setCombatPhase('ATTACK_ROLL');
                setCurrentRollValue(1);
                lastRollValueRef.current = 1;
                setAttackResult(null);
                setFloatingEffect(null);
                setIsRolling(false);
                isRollingRef.current = false;
                setCombatLog([]);
                setIsTurnProcessing(false);
                aiTurnInProgressRef.current = false;

                // haya vuelto al menú o iniciado otra sala mientras llega la respuesta.
                if (leavingOnlineGame) {
                    try {
                        const user = onlineUser || await firebase.ready;
                        const roomRef = firebase.ref(firebase.db, `rooms/${previousRoomCode}`);
                        const snapshot = await firebase.get(roomRef);
                        if (snapshot.exists()) {
                            const room = snapshot.val();

                            // También notificamos la salida después de GAMEOVER para que
                            // el rival deje la pantalla de Victoria. En ese caso se conserva
                            // el ganador original; nunca se le regala la partida al rival.
                            if (room.status !== 'player_left') {
                                const playerNum = room.hostUid === user.uid ? 1 : 2;
                                const departureUpdate = {
                                    status: 'player_left',
                                    disconnectedPlayer: playerNum
                                };
                                if (room.status !== 'gameover') {
                                    departureUpdate.winner = playerNum === 1 ? 2 : 1;
                                }
                                await firebase.update(roomRef, departureUpdate);
                            }

                            await cancelOnlineDisconnect(previousRoomCode);
                        }

                        console.error('No se pudo notificar la salida al rival:', error);
                    }

                                            </div>
                                        </div>

                                        {floatingEffect && floatingEffect.player === 1 && (
                                            <div key={floatingEffect.id || `${floatingEffect.text}-${floatingEffect.player}`} className={`absolute top-1/2 left-1/2 animate-float-damage font-mono-custom font-extrabold text-2xl px-4 py-2 rounded-xl shadow-2xl z-20 ${
                                                floatingEffect.type === 'damage' ? 'bg-rose-600 text-white border border-rose-400 glow-red' :
                                                floatingEffect.type === 'dodge' ? 'bg-cyan-500 text-slate-950 border border-cyan-200 glow-cyan' :
                                                floatingEffect.type === 'hit' ? 'bg-amber-400 text-slate-950 border border-amber-200 effect-hit' :
                                                'bg-slate-700 text-slate-200'
                                            }`}>
                                                {floatingEffect.text}
                                            </div>
                                        )}
                                    </div>

                                    {/* PLAYER 2 CARD */}
                                    <div className={`glass-panel rounded-3xl p-5 border-2 transition-all relative overflow-hidden ${
                                        currentTurnPlayer === 2 && gameState === 'BATTLE' ? 'border-purple-400 shadow-xl shadow-purple-500/10' : 'border-slate-800 opacity-85'
                                    }`}>
                                        <div className="flex justify-between items-start mb-3">
                                            <div>
                                                <span className="text-xs font-bold font-mono-custom text-purple-400 uppercase tracking-widest block">
                                                    {gameMode === 'AI' ? 'JUGADOR 2 (IA)' : 'JUGADOR 2'}
                                                </span>
                                                <h3 className="text-xl font-black text-slate-100 font-mono-custom">{activeP2Mit.name}</h3>
                                            </div>
                                            <span className="px-2.5 py-1 rounded-lg text-xs font-bold font-mono-custom bg-slate-800 text-slate-300 border border-slate-700">
                                                MIT #{activeP2Index + 1}/2
                                            </span>
                                        </div>

                                        <div className="space-y-1 mb-4">
                                            <div className="flex justify-between text-xs font-mono-custom">
                                                <span className="text-slate-400">VIDA</span>
                                                <span className="font-bold text-rose-400">{activeP2Mit.currentHp} / {activeP2Mit.maxHp} HP</span>
                                            </div>
                                            <div className="h-3 w-full bg-slate-900 rounded-full overflow-hidden p-0.5 border border-slate-800">
                                                <div 
                                                    className="h-full bg-gradient-to-r from-rose-500 to-rose-400 rounded-full transition-all duration-500"
                                                    style={{ width: `${(activeP2Mit.currentHp / activeP2Mit.maxHp) * 100}%` }}
                                                />
                                            </div>
                                        </div>

                                        <div className="flex flex-wrap gap-1.5 mb-3">{passiveIndicators(activeP2Mit).map(item => <span key={item} className="px-2 py-1 rounded-lg bg-violet-950/50 border border-violet-500/30 text-violet-200 text-[10px] font-bold">{item}</span>)}</div>
                                        <div className="grid grid-cols-2 gap-2 text-xs font-mono-custom">
                                            <div className="p-2.5 rounded-xl bg-amber-950/20 border border-amber-500/30">
                                                <span className="text-amber-400 block font-bold mb-1">🎯 ATAQUE (D:{activeP2Mit.classData?.d})</span>
                                                <div className="flex gap-1 flex-wrap">
                                                    {activeP2Mit.attackNums?.map(n => (
                                                        <span key={n} className="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-bold border border-amber-500/40">{n}</span>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="p-2.5 rounded-xl bg-cyan-950/20 border border-cyan-500/30">
                                                <span className="text-cyan-400 block font-bold mb-1">🛡️ ESQUIVE (A:{activeP2Mit.classData?.a})</span>
                                                <div className="flex gap-1 flex-wrap">
                                                    {activeP2Mit.evadeNums?.map(n => (
                                                        <span key={n} className="px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-bold border border-cyan-500/40">{n}</span>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>

                                        {floatingEffect && floatingEffect.player === 2 && (
                                            <div key={floatingEffect.id || `${floatingEffect.text}-${floatingEffect.player}`} className={`absolute top-1/2 left-1/2 animate-float-damage font-mono-custom font-extrabold text-2xl px-4 py-2 rounded-xl shadow-2xl z-20 ${
                                                floatingEffect.type === 'damage' ? 'bg-rose-600 text-white border border-rose-400 glow-red' :
                                                floatingEffect.type === 'dodge' ? 'bg-cyan-500 text-slate-950 border border-cyan-200 glow-cyan' :
                                                floatingEffect.type === 'hit' ? 'bg-amber-400 text-slate-950 border border-amber-200 effect-hit' :
                                                'bg-slate-700 text-slate-200'
                                            }`}>
                                                {floatingEffect.text}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* ACTION CONTROL & DICE DISPLAY */}
                                {gameState === 'BATTLE' && (
                                    <div className="glass-panel rounded-3xl p-5 border border-slate-800 flex flex-col items-center justify-center space-y-4 text-center">
                                        <div className="text-xs font-mono-custom text-slate-400 flex items-center gap-2">
                                            <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                                            TURNO ACTUAL: <strong className="text-cyan-300 uppercase">JUGADOR {currentTurnPlayer} ({currentTurnPlayer === 1 ? activeP1Mit.name : activeP2Mit.name})</strong>
                                        </div>

                                        <div className="py-2">
                                            <div className={`w-20 h-20 rounded-2xl border-4 flex items-center justify-center font-mono-custom text-4xl font-black transition-all shadow-2xl ${
                                                isRolling ? 'animate-bounce border-cyan-400 bg-cyan-950/60 text-cyan-300 glow-cyan' : 'border-slate-700 bg-slate-900 text-slate-100'
                                            }`}>
                                                {currentRollValue}
                                            </div>
                                        </div>

                                        <div className="w-full max-w-sm">
                                            {(
                                                gameMode !== 'ONLINE' ||
                                                (combatPhase === 'ATTACK_ROLL'
                                                    ? currentTurnPlayer === (isRoomHost ? 1 : 2)
                                                    : currentTurnPlayer !== (isRoomHost ? 1 : 2))
                                            ) && (
                                                <>
                                            {combatPhase === 'ATTACK_ROLL' && (
                                                <button
                                                    disabled={isRolling || isTurnProcessing || (gameMode === 'AI' && currentTurnPlayer === 2)}
                                                    onClick={handleAttackRoll}
                                                    className={`w-full py-4 rounded-2xl font-black text-base uppercase tracking-wider transition-all font-mono-custom ${
                                                        isRolling || isTurnProcessing || (gameMode === 'AI' && currentTurnPlayer === 2)
                                                        ? 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'
                                                        : 'bg-gradient-to-r from-amber-500 to-red-600 text-slate-950 shadow-lg shadow-amber-500/20 hover:brightness-110 active:scale-95 cursor-pointer'
                                                    }`}
                                                >
                                                    {isRolling ? 'Lanzando Dado...' : (gameMode === 'AI' && currentTurnPlayer === 2) ? 'IA Pensando...' : `🎲 Lanzar Dado de Ataque`}
                                                </button>
                                            )}

                                            {combatPhase === 'ATTACK_ROLL' && availableMit && !currentAttacker.passiveState?.counterSequence && !(gameMode === 'AI' && currentTurnPlayer === 2) && (
                                                <button
                                                    disabled={isRolling || isTurnProcessing}
                                                    onClick={handleSwitchMit}
                                                    className="w-full mt-3 py-3 rounded-xl font-bold text-sm uppercase tracking-wider transition-all font-mono-custom bg-gradient-to-r from-violet-500 to-indigo-600 text-white shadow-lg shadow-violet-500/20 hover:brightness-110 active:scale-95 disabled:bg-slate-800 disabled:text-slate-500 disabled:border disabled:border-slate-700 disabled:shadow-none disabled:cursor-not-allowed"
                                                >
                                                    🔄 Cambiar a {availableMit.name} · Ceder turno
                                                </button>
                                            )}

                                            {combatPhase === 'DEFENSE_ROLL' && (
                                                <button
                                                    disabled={isRolling || isTurnProcessing || (gameMode === 'AI' && currentTurnPlayer === 1)}
                                                    onClick={() => handleDefenseRoll()}
                                                    className={`w-full py-4 rounded-2xl font-black text-base uppercase tracking-wider transition-all font-mono-custom ${
                                                        isRolling || isTurnProcessing || (gameMode === 'AI' && currentTurnPlayer === 1)
                                                        ? 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'
                                                        : 'bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 shadow-lg shadow-cyan-500/20 hover:brightness-110 active:scale-95 cursor-pointer'
                                                    }`}
                                                >
                                                    {isRolling ? 'Lanzando Dado...' : (gameMode === 'AI' && currentTurnPlayer === 1) ? 'IA Esquivando...' : `🛡️ Lanzar Dado de Esquive`}
                                                </button>
                                            )}
                                                </>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* COMBAT LOG */}
                                <div className="glass-panel rounded-2xl p-4 border border-slate-800">
                                    <h4 className="text-xs font-bold font-mono-custom text-slate-400 uppercase tracking-widest mb-2">BITÁCORA DE COMBATE</h4>
                                    <div ref={logContainerRef} className="h-32 overflow-y-auto space-y-1 text-xs font-mono-custom pr-2">
                                        {combatLog.map((log, index) => (
                                            <div 
                                                key={index} 
                                                className={`p-1.5 rounded ${
                                                    log.type === 'attack_hit' ? 'bg-amber-950/30 text-amber-300 border-l-2 border-amber-500' :
                                                    log.type === 'attack_miss' ? 'bg-slate-900 text-slate-400 border-l-2 border-slate-600' :
                                                    log.type === 'defense_success' ? 'bg-cyan-950/30 text-cyan-300 border-l-2 border-cyan-500' :
                                                    log.type === 'defense_fail' ? 'bg-rose-950/30 text-rose-300 border-l-2 border-rose-500' :
                                                    log.type === 'victory' ? 'bg-yellow-500/20 text-yellow-300 font-bold border-l-4 border-yellow-500' :
                                                    'bg-slate-900/60 text-slate-300'
                                                }`}
                                            >
                                                {log.text}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                    </>
                                )}
                            </div>
                        )}
                    </main>

                    {/* FOOTER */}
                    <footer className="text-center py-4 text-xs font-mono-custom text-slate-500 border-t border-slate-900 mt-6">
                        MIT’S Engine — Manual Oficial v1.0 · PR(34)
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
