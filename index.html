                    if (gameMode === 'ONLINE') syncOnline(currentTurnPlayer === 1 ? { p1Mits: updatedAttackerMits } : { p2Mits: updatedAttackerMits });
                    if (isHit) {
                        playSound('hit');
                        setCurrentRollValue(passiveAttack.roll);
                        const atkData = { success: true, damage: passiveAttack.damage, roll: passiveAttack.roll, unstoppable: passiveAttack.unstoppable, attackerPassiveState: passiveAttack.state, counterChain: currentAttacker.passiveState?.counterSequence?.phase === 'SECOND' };
                        if (currentAttacker.passiveState?.counterSequence?.phase === 'FIRST') {
                            const defenderNum = currentTurnPlayer === 1 ? 2 : 1;
                            const forcedResult = window.MITSGameRules.resolvePassiveDefense({ attacker: { ...currentAttacker, passiveState: passiveAttack.state }, defender: currentDefender, attackDamage: passiveAttack.damage, forceHit: true, allowCounterTrigger: false });
                            const counterLog = [...combatLog, { type: 'attack_hit', text: `⚔️ Contraataque 1/2 de ${currentAttacker.name}: el rival no puede defenderse.` }];
                            setCombatLog(counterLog);
                            setCombatPhase('RESOLVING');
                            setIsTurnProcessing(false);
                            publishFloatingEffect({ player: currentTurnPlayer, text: 'CONTRAATAQUE 1/2', type: 'hit' });
                            applyDamageToDefender(defenderNum, forcedResult.damage, counterLog, null, forcedResult, currentTurnPlayer);
                            return;
                        }
                        const newLog = [...combatLog, {
                            type: 'attack_hit',
                            text: `🎯 ${getPlayerDisplayName(currentTurnPlayer)} (${currentAttacker.name}) sacó [${passiveAttack.roll}] → ¡Ataque exitoso! El rival debe defender.`
                        }];
                        setAttackResult(atkData);
                        setCombatPhase('DEFENSE_ROLL');
                        setIsTurnProcessing(false);
                        setCombatLog(newLog);
                        if (gameMode === 'ONLINE') syncOnline({ currentRollValue: passiveAttack.roll, attackResult: atkData, combatPhase: 'DEFENSE_ROLL', combatLog: newLog });
                        publishFloatingEffect({
                            player: currentTurnPlayer,
                            text: '¡ACERTÓ!',
                            type: 'hit'
                        });

                        if (gameMode === 'AI' && currentTurnPlayer === 1) {
                            scheduleGameTimeout(() => triggerAiDefense(atkData), 800);
                        }
                    } else {
                        // Attack Failed -> Switch Turn Directly
                        playSound('fail');
                        const newLog = [...combatLog, {
                            type: 'attack_miss',
                            text: `❌ ${getPlayerDisplayName(currentTurnPlayer)} (${currentAttacker.name}) sacó [${passiveAttack.roll}] → Ataque fallido. Pasa el turno al rival.`
                        }];
                        setAttackResult({ success: false, damage: 0, roll: passiveAttack.roll });
                        setCombatPhase('RESOLVING');
                        setCombatLog(newLog);
                        if (gameMode === 'ONLINE') syncOnline({ currentRollValue: roll, attackResult: { success: false, damage: 0, roll }, combatPhase: 'RESOLVING', combatLog: newLog });
                        publishFloatingEffect({
                            player: currentTurnPlayer === 1 ? 2 : 1,
                            text: '¡FALLÓ!',
                            type: 'miss'
                        });
                        
                        scheduleGameTimeout(() => endTurn(currentTurnPlayer, newLog), 1000);
                    }
                });
            };

            // Defense Roll
            const handleDefenseRoll = (overrideAttackData = null) => {
                if (isRollingRef.current || isRolling || isTurnProcessing || (combatPhase !== 'DEFENSE_ROLL' && !overrideAttackData)) return;
                if (currentTurnPlayerRef.current !== currentTurnPlayer) return;
                if (gameMode === 'ONLINE' && !overrideAttackData && currentTurnPlayer === (isRoomHost ? 1 : 2)) return;

                const atkData = overrideAttackData || attackResult;
                const incomingDamage = Number(atkData?.damage);
                if (
                    !atkData ||
                    atkData.success !== true ||
                    !Number.isFinite(incomingDamage) ||
                    incomingDamage <= 0
                ) {
                    setIsTurnProcessing(false);
                    setAttackResult(null);
                    setCombatPhase('ATTACK_ROLL');
                    if (gameMode === 'ONLINE') {
                        syncOnline({ attackResult: null, combatPhase: 'ATTACK_ROLL' });
                        setOnlineStatus('Se descartó un resultado de ataque inválido. Se reanudó el turno.');
                    }
                    return;
                }

                setIsTurnProcessing(true);
                const defenderPlayerNum = currentTurnPlayer === 1 ? 2 : 1;
                const roll = Math.floor(Math.random() * 6) + 1;

                executeRollAnimation(roll, () => {
                    // Resolver el esquive con valores normalizados y una única fórmula.
                    // Solo un número que esté explícitamente en evadeNums puede reducir daño.
                    const defenseResult = window.MITSGameRules.resolvePassiveDefense({
                        attacker: { ...currentAttacker, passiveState: atkData?.attackerPassiveState || currentAttacker.passiveState },
                        defender: currentDefender,
                        attackDamage: atkData?.damage,
                        defenseRoll: roll,
                        unstoppable: atkData?.unstoppable === true,
                        allowCounterTrigger: atkData?.counterChain !== true
                    });
                    const { isEvadeNumber, damage: finalDamageTaken } = defenseResult;

                    let defenseLogEntry;
                    if (isEvadeNumber || defenseResult.shadowNullified) {
                        playSound('dodge');

                        defenseLogEntry = {
                            type: 'defense_success',
                            text: `🛡️ ${getPlayerDisplayName(defenderPlayerNum)} (${currentDefender.name}) sacó [${roll}] en esquive → Daño recibido: ${finalDamageTaken}`
                        };
                        setCombatLog(prev => [...prev, defenseLogEntry]);
                        publishFloatingEffect({
                            player: defenderPlayerNum,
                            text: finalDamageTaken === 0 ? '¡ESQUIVADO!' : `-${finalDamageTaken} HP`,
                            type: finalDamageTaken === 0 ? 'dodge' : 'damage'
                        });
                    } else {
                        playSound('hit');
                        defenseLogEntry = {
                            type: 'defense_fail',
                            text: `💥 ${getPlayerDisplayName(defenderPlayerNum)} (${currentDefender.name}) sacó [${roll}] en esquive → Esquive fallido. Daño recibido: ${finalDamageTaken}`
                        };
                        setCombatLog(prev => [...prev, defenseLogEntry]);
                        publishFloatingEffect({
                            player: defenderPlayerNum,
                            text: `-${finalDamageTaken} HP`,
                            type: 'damage'
                        });
                    }

                    applyDamageToDefender(defenderPlayerNum, finalDamageTaken, [...combatLog, defenseLogEntry], roll, defenseResult, currentTurnPlayer);
                });
            };

            const triggerAiDefense = (atkData) => {
                handleDefenseRoll(atkData);
            };

            const applyDamageToDefender = (defenderPlayerNum, damage, logOverride = null, defenseRoll = null, passiveDefenseResult = null, attackerPlayerNum = defenderPlayerNum === 1 ? 2 : 1) => {
                const latestP1Mits = p1MitsRef.current;
                const latestP2Mits = p2MitsRef.current;
                const currentActiveP1Index = activeP1IndexRef.current;
                const currentActiveP2Index = activeP2IndexRef.current;
                const latestActiveP1Mit = latestP1Mits[currentActiveP1Index] || activeP1Mit;
                const latestActiveP2Mit = latestP2Mits[currentActiveP2Index] || activeP2Mit;
                let updatedP1 = latestP1Mits;
                let updatedP2 = latestP2Mits;
                let defeated = false;

                const parsedDamage = Number(damage);
                const safeDamage = Number.isSafeInteger(parsedDamage)
                    ? Math.min(Number.MAX_SAFE_INTEGER, Math.max(0, parsedDamage))
                    : 0;

                if (defenderPlayerNum === 1) {
                    const hpResult = window.MITSGameRules.resolveHpAfterDamage({
                        currentHp: latestActiveP1Mit.currentHp,
                        maxHp: latestActiveP1Mit.maxHp,
                        damage: safeDamage
                    });
                    const newHp = hpResult.currentHp;
                    const hpLost = hpResult.hpLost;
                    updatedP1 = [...latestP1Mits];
                    const defenderWithState = { ...latestActiveP1Mit, passiveState: passiveDefenseResult?.state || latestActiveP1Mit.passiveState };
                    const attackerMit = attackerPlayerNum === 1 ? latestActiveP1Mit : latestActiveP2Mit;
                    const consequences = window.MITSGameRules.applyPassiveDamageConsequences({ attacker: { ...attackerMit, passiveState: passiveDefenseResult?.attackerState || attackerMit.passiveState }, defender: defenderWithState, hpLost, fullyDodged: passiveDefenseResult?.fullyDodged, shadowNullified: passiveDefenseResult?.shadowNullified });
                    consequences.events.forEach(event => publishFloatingEffect({ player: event.startsWith('Enfurecimiento') ? attackerPlayerNum : defenderPlayerNum, text: event, type: 'hit' }));
                    const counterState = newHp > 0 && passiveDefenseResult?.triggersCounter
                        ? { ...consequences.defenderState, counterSequence: { phase: 'FIRST', opponentPlayer: attackerPlayerNum } }
                        : consequences.defenderState;
                    updatedP1[currentActiveP1Index] = { ...defenderWithState, currentHp: newHp, passiveState: counterState };
                    if (attackerPlayerNum === 2) { updatedP2 = [...latestP2Mits]; updatedP2[currentActiveP2Index] = { ...latestActiveP2Mit, passiveState: consequences.attackerState }; }
                    setP1Mits(updatedP1);
                    defeated = newHp === 0;
                } else {
                    const hpResult = window.MITSGameRules.resolveHpAfterDamage({
                        currentHp: latestActiveP2Mit.currentHp,
                        maxHp: latestActiveP2Mit.maxHp,
                        damage: safeDamage
                    });
                    const newHp = hpResult.currentHp;
                    const hpLost = hpResult.hpLost;
                    updatedP2 = [...latestP2Mits];
                    const defenderWithState = { ...latestActiveP2Mit, passiveState: passiveDefenseResult?.state || latestActiveP2Mit.passiveState };
                    const attackerMit = attackerPlayerNum === 1 ? latestActiveP1Mit : latestActiveP2Mit;
                    const consequences = window.MITSGameRules.applyPassiveDamageConsequences({ attacker: { ...attackerMit, passiveState: passiveDefenseResult?.attackerState || attackerMit.passiveState }, defender: defenderWithState, hpLost, fullyDodged: passiveDefenseResult?.fullyDodged, shadowNullified: passiveDefenseResult?.shadowNullified });
                    consequences.events.forEach(event => publishFloatingEffect({ player: event.startsWith('Enfurecimiento') ? attackerPlayerNum : defenderPlayerNum, text: event, type: 'hit' }));
                    const counterState = newHp > 0 && passiveDefenseResult?.triggersCounter
                        ? { ...consequences.defenderState, counterSequence: { phase: 'FIRST', opponentPlayer: attackerPlayerNum } }
                        : consequences.defenderState;
                    updatedP2[currentActiveP2Index] = { ...defenderWithState, currentHp: newHp, passiveState: counterState };
                    if (attackerPlayerNum === 1) { updatedP1 = [...latestP1Mits]; updatedP1[currentActiveP1Index] = { ...latestActiveP1Mit, passiveState: consequences.attackerState }; }
                    setP2Mits(updatedP2);
                    defeated = newHp === 0;
                }

                passiveDefenseResult?.events?.forEach(event => publishFloatingEffect({ player: defenderPlayerNum, text: event, type: 'hit' }));
                if (passiveDefenseResult?.triggersCounter && !defeated) {
                    logOverride = [...(Array.isArray(logOverride) ? logOverride : combatLog), {
                        type: 'system',
                        text: '⚔️ ¡CONTRAATAQUE! Duelista atacará dos veces: el primer golpe no se puede defender y el rival pierde su siguiente ataque.'
                    }];
                    setCombatLog(logOverride);
                    publishFloatingEffect({ player: defenderPlayerNum, text: '¡CONTRAATAQUE!', type: 'hit' });
                }

                setP1Mits(updatedP1);
                setP2Mits(updatedP2);

                if (gameMode === 'ONLINE') {
                    const nextLog = logOverride || combatLog;
                    syncOnline({
                        p1Mits: updatedP1, p2Mits: updatedP2,
                        combatLog: nextLog, attackResult: null, combatPhase: 'RESOLVING',
                        ...(Number.isInteger(defenseRoll) ? { currentRollValue: defenseRoll } : {})
                    });
                }

                if (defeated) {
                    handleMitDefeated(defenderPlayerNum, defenderPlayerNum === 1 ? updatedP1 : updatedP2, logOverride, { p1Mits: updatedP1, p2Mits: updatedP2 });
                    return;
                }

                scheduleGameTimeout(() => endTurn(attackerPlayerNum, logOverride, {
                        p1Mits: updatedP1,
                        p2Mits: updatedP2
                    }), 1000);
            };

            const handleMitDefeated = (playerNum, updatedMits, logOverride = null, allMits = null) => {
                const finalP1Mits = allMits?.p1Mits || (playerNum === 1 ? updatedMits : p1Mits);
                const finalP2Mits = allMits?.p2Mits || (playerNum === 2 ? updatedMits : p2Mits);
                setP1Mits(finalP1Mits);
                setP2Mits(finalP2Mits);
                // Conservamos en una sola secuencia el registro de defensa y el KO.
                const baseLog = Array.isArray(logOverride) ? logOverride : combatLog;
                const koLog = [...baseLog, {
                    type: 'ko',
                    text: `☠️ ¡El MIT de ${getPlayerDisplayName(playerNum)} fue derrotado!`
                }];
                setCombatLog(koLog);

                const refIndex = playerNum === 1 ? activeP1IndexRef.current : activeP2IndexRef.current;
                const stateIndex = playerNum === 1 ? activeP1Index : activeP2Index;
                const refIsDefeated = Number.isInteger(refIndex) && refIndex >= 0 && refIndex < updatedMits.length
                    && Number(updatedMits[refIndex]?.currentHp) <= 0;
                const stateIsDefeated = Number.isInteger(stateIndex) && stateIndex >= 0 && stateIndex < updatedMits.length
                    && Number(updatedMits[stateIndex]?.currentHp) <= 0;
                const fallbackIndex = updatedMits.findIndex(mit =>
                    mit?.classData?.id === 'Resistente1' && Number(mit.currentHp) <= 0
                );
                const defeatedActiveIndex = refIsDefeated
                    ? refIndex
                    : stateIsDefeated
                        ? stateIndex
                        : fallbackIndex >= 0 ? fallbackIndex : 0;
                const defeatedMit = updatedMits[defeatedActiveIndex];
                const defeatedState = {
                    ...(defeatedMit?.passiveState || {}),
                    berserkerPhase: Number(defeatedMit?.passiveState?.berserkerPhase) === 2 ? 2 : 1
                };
                if (defeatedMit?.classData?.id === 'Resistente1' && defeatedState.berserkerPhase !== 2) {
                    const rebuild = { playerNum, index: defeatedActiveIndex };
                    const rebuildLog = [...koLog, {
                        type: 'system',
                        text: '🔥 ¡ÚLTIMO INSTINTO! Berserker entra en su segunda fase con 3 HP. Debe reasignar el dado: 1 cara D y 5 caras A.'
                    }];
                    if (gameMode === 'AI' && playerNum === 2) {
                        const faces = [1, 2, 3, 4, 5, 6];
                        const chosen = faces[Math.floor(Math.random() * faces.length)];
                        const berserkerBase = {
                            ...defeatedMit,
                            classData: {
                                ...(defeatedMit?.classData || {}),
                                id: 'Resistente1',
                                hp: 20,
                                d: 3,
                                a: 1
                            },
                            passiveState: {
                                ...window.MITSGameRules.createPassiveState('Resistente1'),
                                ...(defeatedMit?.passiveState || {}),
                                passiveClassId: 'Resistente1',
                                berserkerPhase: 1
                            }
                        };
                        const phaseTwo = window.MITSGameRules.activateBerserkerSecondPhase(
                            berserkerBase,
                            [chosen],
                            faces.filter(n => n !== chosen)
                        );
                        if (!phaseTwo) {
                            console.error('No se pudo reconstruir la segunda fase del Berserker de la IA.', defeatedMit);
                            setOnlineStatus('La IA no pudo reconstruir su Berserker.');
                            isSubmittingMitRef.current = false;
                            return;
                        }
                        const aiUpdated = [...updatedMits];
                        aiUpdated[defeatedActiveIndex] = phaseTwo;
                        const humanUpdated = clearOpponentTemporaryEffects(finalP1Mits);
                        setP1Mits(humanUpdated);
                        setP2Mits(aiUpdated);
                        const aiLog = [...rebuildLog, { type: 'system', text: `🤖 La IA asignó ${chosen} a D y el resto a A.` }];
                        setCombatLog(aiLog);
                        scheduleGameTimeout(() => endTurn(1, aiLog, { p1Mits: humanUpdated, p2Mits: aiUpdated }), 900);
                    } else {
                        if (playerNum === 1) setP1Mits(updatedMits); else setP2Mits(updatedMits);
                        setBerserkerRebuild(rebuild);
                        berserkerBuildKeyRef.current = `${playerNum}:${defeatedActiveIndex}`;
                        setBuilderPlayer(playerNum);
                        setSelectedClass({ ...MIT_CLASSES.find(c => c.id === 'Resistente1'), name: 'Berserker · Fase 2', hp: 3, d: 1, a: 5 });
                        setCurrentDNums([]);
                        setCurrentANums([]);
                        setGameState('BATTLE');
                        setCombatLog(rebuildLog);
                        if (gameMode === 'ONLINE') {
                            syncOnline({
                                status: 'berserker_build',
                                berserkerRebuild: rebuild,
                                p1Mits: finalP1Mits,
                                p2Mits: finalP2Mits,
                                combatLog: rebuildLog,
                                attackResult: null,
                                combatPhase: 'RESOLVING'
                            });
                        }
                    }
                    return;
                }

                if (gameMode === 'ONLINE') {
                    // Publica el KO sin adelantar todavía el turno: el MIT sustituto
                    // debe entrar antes de habilitar la siguiente tirada.
                    syncOnline({
                        p1Mits: finalP1Mits,
                        p2Mits: finalP2Mits,
                        combatLog: koLog,
                        attackResult: null,
                        combatPhase: 'RESOLVING'
                    });
                }

                const reserveIndex = window.MITSGameRules.findAvailableMitIndex(
                    updatedMits,
                    defeatedActiveIndex
                );
                const defeatResolution = window.MITSGameRules.resolveMitDefeat({
                    defeatedPlayer: playerNum,
                    hasReserve: reserveIndex !== null
                });

                if (!defeatResolution || defeatResolution.isGameOver) {
                    if (defeatResolution) gameOver(defeatResolution.winner, koLog);
                    return;
                }

                const reserveMit = updatedMits[reserveIndex];
                const entryLog = [...koLog, {
                    type: 'system',
                    text: `🔄 Entra el MIT de reserva de ${getPlayerDisplayName(playerNum)}: ${reserveMit?.name || 'MIT de reserva'}`
                }];

                scheduleGameTimeout(() => {
                    if (playerNum === 1) {
                        activeP1IndexRef.current = reserveIndex;
                        setActiveP1Index(reserveIndex);
                    } else {
                        activeP2IndexRef.current = reserveIndex;
                        setActiveP2Index(reserveIndex);
                    }
                    setCombatLog(entryLog);

                    // La regla de turno tras un KO se resuelve en el módulo puro.
                    // endTurn recibe al jugador anterior para que el turno pase al derrotado.
                    const playerWhoJustActed = defeatResolution.nextPlayer === 1 ? 2 : 1;
                    const onlineOverrides = playerNum === 1
                        ? { activeP1Index: reserveIndex, p1Mits: finalP1Mits, p2Mits: finalP2Mits }
                        : { activeP2Index: reserveIndex, p1Mits: finalP1Mits, p2Mits: finalP2Mits };
                    endTurn(playerWhoJustActed, entryLog, onlineOverrides);
                }, 1000);
            };

            const endTurn = (playerWhoJustActed, logOverride = null, onlineOverrides = {}) => {
                // No inferimos el turno desde el estado de un render anterior.
                // Quien llama esta función indica explícitamente quién acaba de jugar.
                if (playerWhoJustActed !== 1 && playerWhoJustActed !== 2) return;

                aiTurnInProgressRef.current = false;
                setAttackResult(null);
                setFloatingEffect(null);
                setCombatPhase('ATTACK_ROLL');

                let nextPlayer = playerWhoJustActed === 1 ? 2 : 1;
                let nextP1Mits = [...(onlineOverrides.p1Mits || p1MitsRef.current)];
                let nextP2Mits = [...(onlineOverrides.p2Mits || p2MitsRef.current)];
                const p1Index = Number.isInteger(onlineOverrides.activeP1Index) ? onlineOverrides.activeP1Index : activeP1Index;
                const p2Index = Number.isInteger(onlineOverrides.activeP2Index) ? onlineOverrides.activeP2Index : activeP2Index;

                const advanceList = (playerNum, list) => list.map(mit => {
                    if (!mit) return mit;
                    const advanced = window.MITSGameRules.advancePassiveTurn(mit, {
                        opponentTurnEnded: playerWhoJustActed !== playerNum,
                        ownTurnEnded: playerWhoJustActed === playerNum
                    });
                    advanced.events.forEach(event => publishFloatingEffect({ player: playerNum, text: event, type: 'hit' }));
                    return { ...mit, passiveState: advanced.state };
                });
                nextP1Mits = advanceList(1, nextP1Mits);
                nextP2Mits = advanceList(2, nextP2Mits);

                const actorList = playerWhoJustActed === 1 ? nextP1Mits : nextP2Mits;
                const actorIndex = playerWhoJustActed === 1 ? p1Index : p2Index;
                const actorMit = actorList[actorIndex];
                const sequence = actorMit?.passiveState?.counterSequence;
                let nextLog = Array.isArray(logOverride) ? [...logOverride] : [...combatLog];
                if (sequence?.phase === 'FIRST') {
                    const updatedActor = { ...actorMit, passiveState: { ...actorMit.passiveState, counterSequence: { ...sequence, phase: 'SECOND' } } };
                    actorList[actorIndex] = updatedActor;
                    nextPlayer = playerWhoJustActed;
                    nextLog.push({ type: 'system', text: '⚔️ El rival pierde su ataque. ¡Duelista realiza su segundo contraataque!' });
                } else if (sequence?.phase === 'SECOND') {
                    const updatedActor = { ...actorMit, passiveState: { ...actorMit.passiveState, counterSequence: null, counterCooldownTurns: 1 } };
                    actorList[actorIndex] = updatedActor;
                    nextLog.push({ type: 'system', text: '🛡️ Contraataque completado. El rival recupera su turno.' });
                }
                setP1Mits(nextP1Mits);
                setP2Mits(nextP2Mits);
                if (Array.isArray(logOverride) || sequence) setCombatLog(nextLog);
                currentTurnPlayerRef.current = nextPlayer;
                setCurrentTurnPlayer(nextPlayer);
                setIsTurnProcessing(false);

                if (gameMode === 'ONLINE') {
                    syncOnline({
                        ...onlineOverrides,
                        p1Mits: nextP1Mits,
                        p2Mits: nextP2Mits,
                        activeP1Index: p1Index,
                        activeP2Index: p2Index,
                        attackResult: null,
                        floatingEffect: null,
                        combatPhase: 'ATTACK_ROLL',
                        currentTurnPlayer: nextPlayer,
                        currentRollValue: lastRollValueRef.current,
                        combatLog: nextLog
                    });
                }

                // Solo puede existir una activación de IA pendiente.
                if (aiTurnTimerRef.current !== null) {
                    clearTimeout(aiTurnTimerRef.current);
                    aiTurnTimerRef.current = null;
                }

                if (gameMode === 'AI' && nextPlayer === 2) {
                    aiTurnTimerRef.current = scheduleGameTimeout(() => {
                        aiTurnTimerRef.current = null;
                        // Si el turno cambió durante la espera, se cancela la activación.
                        if (currentTurnPlayerRef.current === 2) triggerAiTurn();
                    }, 800);
                }
            };

            const handleSwitchMit = () => {
                if (gameState !== 'BATTLE' || combatPhase !== 'ATTACK_ROLL' ||
                    isRollingRef.current || isRolling || isTurnProcessing ||
                    currentTurnPlayerRef.current !== currentTurnPlayer ||
                    availableMitIndex === null || currentAttacker.passiveState?.counterSequence) {
                    return;
                }
                if (gameMode === 'ONLINE' &&
                    currentTurnPlayer !== (isRoomHost ? 1 : 2)) {
                    return;
                }
                // The AI is not a human-controlled side and does not use the manual switch UI.
                if (gameMode === 'AI' && currentTurnPlayer === 2) return;

                const playerNum = currentTurnPlayer;
                const switchLog = [...combatLog, {
                    type: 'system',
                    text: `🔄 ${getPlayerDisplayName(playerNum)} cambia ${currentAttacker.name} por ${availableMit.name}. Cede el turno al rival.`
                }];

                if (playerNum === 1) {
                    activeP1IndexRef.current = availableMitIndex;
                    setActiveP1Index(availableMitIndex);
                } else {
                    activeP2IndexRef.current = availableMitIndex;
                    setActiveP2Index(availableMitIndex);
                }
                setCombatLog(switchLog);
                playSound('click');

                const onlineOverrides = playerNum === 1
                    ? { activeP1Index: availableMitIndex, p1Mits, p2Mits }
                    : { activeP2Index: availableMitIndex, p1Mits, p2Mits };

                // Switching is a full turn action: the opponent acts next.
                endTurn(playerNum, switchLog, onlineOverrides);
            };

            const triggerAiTurn = () => {
                // La IA solo puede actuar una vez y únicamente durante su turno.
                if (gameState !== 'BATTLE' || gameMode !== 'AI' || currentTurnPlayerRef.current !== 2 || aiTurnInProgressRef.current) return;
                const latestP2Mits = p2MitsRef.current;
                const latestActiveP2Index = activeP2IndexRef.current;
                const aiMit = latestP2Mits[latestActiveP2Index];
                if (!aiMit || !Array.isArray(aiMit.attackNums)) return;

                aiTurnInProgressRef.current = true;
                setIsTurnProcessing(true);
                const roll = Math.floor(Math.random() * 6) + 1;
                
                executeRollAnimation(roll, () => {
                    const turnStart = window.MITSGameRules.beginPassiveAttackTurn(aiMit);
                    const attackerAtTurnStart = { ...aiMit, passiveState: turnStart.state };
                    const passiveAttack = window.MITSGameRules.resolvePassiveAttack({ attacker: attackerAtTurnStart, roll });
                    const isHit = passiveAttack.hit;
                    const updatedAiMits = [...latestP2Mits];
                    updatedAiMits[latestActiveP2Index] = { ...attackerAtTurnStart, passiveState: passiveAttack.state };
                    turnStart.events.forEach(event => publishFloatingEffect({ player: 2, text: event, type: 'hit' }));
                    passiveAttack.events.forEach(event => publishFloatingEffect({ player: 2, text: event, type: 'hit' }));
                    setP2Mits(updatedAiMits);
                    if (isHit) {
                        playSound('hit');
                        setCurrentRollValue(passiveAttack.roll);
                        const atkData = { success: true, damage: passiveAttack.damage, roll: passiveAttack.roll, unstoppable: passiveAttack.unstoppable, attackerPassiveState: passiveAttack.state, counterChain: aiMit.passiveState?.counterSequence?.phase === 'SECOND' };
                        if (aiMit.passiveState?.counterSequence?.phase === 'FIRST') {
                            const latestP1Mits = p1MitsRef.current;
                            const latestActiveP1Mit = latestP1Mits[activeP1IndexRef.current] || {};
                            const forcedResult = window.MITSGameRules.resolvePassiveDefense({ attacker: { ...aiMit, passiveState: passiveAttack.state }, defender: latestActiveP1Mit, attackDamage: passiveAttack.damage, forceHit: true, allowCounterTrigger: false });
                            const counterLog = [...combatLog, { type: 'attack_hit', text: `⚔️ Contraataque 1/2 de ${aiMit.name}: no puedes defenderte.` }];
                            setCombatLog(counterLog);
                            setCombatPhase('RESOLVING');
                            setIsTurnProcessing(false);
                            publishFloatingEffect({ player: 2, text: 'CONTRAATAQUE 1/2', type: 'hit' });
                            applyDamageToDefender(1, forcedResult.damage, counterLog, null, forcedResult, 2);
                            return;
                        }
                        setAttackResult(atkData);
                        setCombatPhase('DEFENSE_ROLL');
                        setIsTurnProcessing(false);
                        setCombatLog(prev => [...prev, {
                            type: 'attack_hit',
                            text: `🎯 Jugador 2 (IA) sacó [${passiveAttack.roll}] → ¡Ataque Exitoso! Lanza tu dado de esquive.`
                        }]);
                        publishFloatingEffect({
                            player: 2,
                            text: '¡ACERTÓ!',
                            type: 'hit'
                        });
                        // El bloqueo se libera al terminar la resolución de este turno.
                    } else {
                        playSound('fail');
                        setAttackResult({ success: false, damage: 0, roll: passiveAttack.roll });
                        setCombatPhase('RESOLVING');
                        setCombatLog(prev => [...prev, {
                            type: 'attack_miss',
                            text: `❌ Jugador 2 (IA) sacó [${roll}] → Ataque Fallado. Tu turno.`
                        }]);
                        publishFloatingEffect({
                            player: 1,
                            text: '¡FALLÓ!',
                            type: 'miss'
                        });
                        // Un fallo consume el turno: no se vuelve a lanzar el dado.
                        scheduleGameTimeout(() => endTurn(2), 1000);
                    }
                });
            };

            const gameOver = async (winnerPlayerNum, logOverride = null) => {
                gameSessionRef.current += 1;
                cancelGameTimers();
                isRollingRef.current = false;
                setIsRolling(false);
                setIsTurnProcessing(false);
                aiTurnInProgressRef.current = false;
                setWinnerPlayer(winnerPlayerNum);
                setGameState('GAMEOVER');
                setIsTurnProcessing(false);
                const baseLog = Array.isArray(logOverride) ? logOverride : combatLog;
                const victoryLog = [...baseLog, {
                    type: 'victory',
                    text: `🏆 ¡FIN DE LA PARTIDA! ${getPlayerDisplayName(winnerPlayerNum)} ha ganado.`
                }];
                setCombatLog(victoryLog);
                if (gameMode === 'ONLINE' && roomCode && window.MITSFirebase) {
                    try {
                        const roomRef = onlineRoomRef(roomCode);
                        // El cierre también es una transición atómica: si un jugador
                        // ya abandonó, un write retrasado no puede resucitar GAMEOVER.
                        await window.MITSFirebase.runTransaction(roomRef, current => {
                            if (!current || !['battle', 'berserker_build'].includes(current.status)) return;
                            return {
                                ...current,
                                status: 'gameover',
                                winner: winnerPlayerNum,
                                combatLog: victoryLog
                            };
                        });
                    } catch (error) {
                        console.error('No se pudo registrar el resultado online:', error);
                        setOnlineStatus('No se pudo sincronizar el resultado de la partida.');
                    }
                }
            };

            const returnToOnlineLobby = async () => {
                playSound('click');
                const finishedRoomCode = roomCode;

                // Desactiva la sesión local y sus listeners antes de publicar la salida.
                gameSessionRef.current += 1;
                cancelGameTimers();
                isRollingRef.current = false;
                setIsRolling(false);
                setIsTurnProcessing(false);
                aiTurnInProgressRef.current = false;
                isSubmittingMitRef.current = false;

                if (onlineListenerRef.current && window.MITSFirebase) {
                    window.MITSFirebase.off(onlineListenerRef.current.ref, 'value', onlineListenerRef.current.handler);
                    if (onlineListenerRef.current.presenceRef && onlineListenerRef.current.presenceHandler) {
                        window.MITSFirebase.off(onlineListenerRef.current.presenceRef, 'value', onlineListenerRef.current.presenceHandler);
                    }
                    onlineListenerRef.current = null;
                }
                if (presenceGraceTimerRef.current !== null) {
                    clearTimeout(presenceGraceTimerRef.current);
                    presenceGraceTimerRef.current = null;
                }
                clearWaitingRoomExpiryTimer();

                // Limpia la presencia mientras la pertenencia todavía es válida.
                await stopOnlinePresenceListener(true);

                // La transacción evita que dos salidas simultáneas sobrescriban
                // el estado final o que una lectura antigua resucite la partida.
                if (finishedRoomCode && window.MITSFirebase) {
                    try {
                        const user = onlineUser || await window.MITSFirebase.ready;
                        const roomRef = window.MITSFirebase.ref(window.MITSFirebase.db, `rooms/${finishedRoomCode}`);
                        const tx = await window.MITSFirebase.runTransaction(roomRef, current => {
                            if (!current) return;
                            const patch = MITSOnlineRoomLifecycle.explicitExitPatch(current, user.uid);
                            if (patch?.status === 'player_left') return { ...current, ...patch };

                            // El botón aparece al entrar localmente en GAMEOVER.
                            // Si la transacción de resultado aún va en camino, esta
                            // salida gana la carrera y conserva el ganador calculado.
                            if (['battle', 'berserker_build'].includes(current.status)) {
                                const playerNum = MITSOnlineRoomLifecycle.getPlayerNumber(current, user.uid);
                                if (!playerNum || MITSOnlineRoomLifecycle.hasPlayerPresence(current, playerNum)) return;
                                return {
                                    ...current,
                                    status: 'player_left',
                                    disconnectedPlayer: playerNum,
                                    closeReason: 'gameover_exit',
                                    closedBy: user.uid,
                                    winner: winnerPlayer === 1 || winnerPlayer === 2
                                        ? winnerPlayer
                                        : (playerNum === 1 ? 2 : 1)
                                };
                            }
                            return;
                        });
                        const finalRoom = tx.snapshot?.val?.();
                        if (tx.committed && finalRoom?.isPublic === true) {
                            await retirePublicRoomListing(finishedRoomCode);
                        }
                    } catch (error) {
                        console.warn('No se pudo cerrar la sala terminada:', error);
                    }
                }

                setGameState('ONLINE_LOBBY');
                setGameMode('ONLINE');
                setRoomCode('');
                setRoomInput('');
                setOnlineStatus('');
                setDisconnectedPlayer(null);
                setWinnerPlayer(null);
                setBerserkerRebuild(null);
                berserkerBuildKeyRef.current = null;
                setIsRoomHost(false);
                setBuilderPlayer(1);
                setP1Mits([]);
                setP2Mits([]);
                activeP1IndexRef.current = 0;
                activeP2IndexRef.current = 0;
                setActiveP1Index(0);
                setActiveP2Index(0);
                setCurrentTurnPlayer(1);
                currentTurnPlayerRef.current = 1;
                setCombatPhase('ATTACK_ROLL');
                setCurrentRollValue(1);
                lastRollValueRef.current = 1;
                setAttackResult(null);
                setFloatingEffect(null);
                setCombatLog([]);
                setCurrentDNums([]);
                setCurrentANums([]);
                setSelectedClass(MIT_CLASSES[2]);
            };

            const resetGame = async () => {
                playSound('click');
                const previousRoomCode = roomCode;
                const leavingOnlineGame = gameMode === 'ONLINE' && previousRoomCode && window.MITSFirebase;
                const firebase = window.MITSFirebase;

                // Invalida callbacks antiguos y detiene cualquier tirada/temporizador pendiente.
                gameSessionRef.current += 1;
                cancelGameTimers();
                isSubmittingMitRef.current = false;

                // Se desuscribe antes de modificar la pertenencia: el invitado que
                // libera su asiento no debe procesar su propia salida como expulsión.
                if (leavingOnlineGame && onlineListenerRef.current) {
                    firebase.off(onlineListenerRef.current.ref, 'value', onlineListenerRef.current.handler);
                    if (onlineListenerRef.current.presenceRef && onlineListenerRef.current.presenceHandler) {
                        firebase.off(onlineListenerRef.current.presenceRef, 'value', onlineListenerRef.current.presenceHandler);
                    }
                    onlineListenerRef.current = null;
                }
                if (presenceGraceTimerRef.current !== null) {
                    clearTimeout(presenceGraceTimerRef.current);
                    presenceGraceTimerRef.current = null;
                }
                clearWaitingRoomExpiryTimer();

                // Limpia la presencia mientras la pertenencia todavía es válida.
                // En especial, evita dejar IDs viejos al liberar el asiento invitado.
                if (leavingOnlineGame) await stopOnlinePresenceListener(true);

                // El anfitrión cierra la espera; el invitado solo libera su asiento.
                // En una partida activa, salir termina la sala para ambos.
                if (leavingOnlineGame) {
                    try {
                        const user = onlineUser || await firebase.ready;
                        const roomRef = firebase.ref(firebase.db, `rooms/${previousRoomCode}`);
                        const tx = await firebase.runTransaction(roomRef, current => {
                            const patch = MITSOnlineRoomLifecycle.explicitExitPatch(current, user.uid);
                            if (!patch) return;
                            return { ...current, ...patch };
                        });
                        const finalRoom = tx.snapshot?.val?.();
                        if (tx.committed && finalRoom?.isPublic === true && finalRoom.status !== 'waiting') {
                            await retirePublicRoomListing(previousRoomCode);
                        }
                    } catch (error) {
                        console.warn('No se pudo notificar la salida de la sala:', error);
                    }
                }

                // El reinicio local no debe depender de la latencia de Firebase.
                setGameState('MENU');
                setRoomCode('');
                setRoomInput('');
                setOnlineStatus('');
                setIsRoomHost(false);
                setDisconnectedPlayer(null);
                setWinnerPlayer(null);
                setBerserkerRebuild(null);
                berserkerBuildKeyRef.current = null;
                setGameMode('AI');
                setP1Mits([]);
                setP2Mits([]);
                setBuilderPlayer(1);
                setSelectedClass(MIT_CLASSES[2]);
                setCurrentDNums([]);
                setCurrentANums([]);
                activeP1IndexRef.current = 0;
                activeP2IndexRef.current = 0;
                setActiveP1Index(0);
                setActiveP2Index(0);
                setCurrentTurnPlayer(1);
                currentTurnPlayerRef.current = 1;
                setCombatPhase('ATTACK_ROLL');
                setCurrentRollValue(1);
                lastRollValueRef.current = 1;
                setAttackResult(null);
                setFloatingEffect(null);
                setIsRolling(false);
                isRollingRef.current = false;
                setCombatLog([]);
                setIsTurnProcessing(false);
                aiTurnInProgressRef.current = false;

            };

            return (
                <div className="app-shell min-h-screen flex flex-col justify-between p-3 md:p-6 w-full">
                    {!playerName && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-950/95 backdrop-blur-md p-5">
                            <form onSubmit={event => {
                                event.preventDefault();
                                const cleanName = nameDraft.trim().replace(/\s+/g, ' ').slice(0, 24);
                                if (cleanName) setPlayerName(cleanName);
                            }} className="w-full max-w-md glass-panel rounded-3xl border border-cyan-400/30 p-7 md:p-9 text-center space-y-5 shadow-2xl">
                                <div className="text-5xl">🎲</div>
                                <h2 className="text-2xl md:text-3xl font-black text-white font-mono-custom">BIENVENIDO A MIT’S</h2>
                                <p className="text-slate-300">Introduce un nombre para identificarte en las salas y en la pantalla de victoria.</p>
                                <input autoFocus autoComplete="nickname" value={nameDraft} onChange={event => setNameDraft(event.target.value.slice(0, 24))} maxLength={24} placeholder="Tu nombre" aria-label="Introduce un nombre" className="w-full bg-slate-950 border border-slate-700 focus:border-cyan-400 rounded-xl px-4 py-4 text-white text-center text-lg font-bold outline-none" />
                                <button type="submit" disabled={!nameDraft.trim()} className="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 font-black uppercase tracking-wider disabled:opacity-40">Entrar al juego</button>
                            </form>
                        </div>
                    )}
                    {/* TOP HEADER */}
                    <header className="app-header glass-panel rounded-2xl p-4 mb-4 flex flex-wrap justify-between items-center border-b border-cyan-500/20">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-xl text-slate-950 shadow-lg shadow-cyan-500/30">
                                🎲
                            </div>
                            <div>
                                <h1 className="font-extrabold text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-200 to-indigo-400 font-mono-custom">
                                    MIT’S
                                </h1>
                                <p className="text-xs text-slate-400">Adaptive Core Combat System v1.0</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-3 mt-2 sm:mt-0">
                            <button 
                                onClick={() => setSoundEnabled(previous => !previous)}
                                className="p-2.5 rounded-xl glass-panel-interactive text-slate-300 hover:text-cyan-400 text-sm flex items-center gap-2"
                            >
                                <span>{soundEnabled ? '🔊 Sonido: ON' : '🔇 Sonido: OFF'}</span>
                            </button>
                            {gameState !== 'MENU' && !berserkerRebuild && !(gameMode === 'ONLINE' && gameState === 'GAMEOVER') && (
                                <button 
                                    onClick={resetGame}
                                    className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-semibold transition"
                                >
                                    Reiniciar
                                </button>
                            )}

                        </div>
                    </header>

                    {/* MAIN GAME CONTAINER */}
                    <main className="app-main flex-1 flex flex-col justify-center" data-screen={gameState}>
                        {/* BERSERKER TRANSFORMATION OVERLAY */}
                        {berserkerRebuild && (
                            <div className="berserker-overlay fixed inset-0 z-[80] bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4 lg:p-10">
                                {gameMode === 'ONLINE' && berserkerRebuild.playerNum !== (isRoomHost ? 1 : 2) ? (
                                    <div className="w-full h-full flex items-center justify-center pointer-events-none">
                                        <div className="text-red-500 text-5xl md:text-7xl font-black uppercase tracking-widest font-mono-custom drop-shadow-[0_0_25px_rgba(239,68,68,0.9)] text-center">
                                            una vez más..
                                        </div>
                                    </div>
                                ) : (
                                    <div className="berserker-panel glass-panel w-full max-w-4xl rounded-3xl border border-orange-400/40 shadow-2xl shadow-orange-500/20 p-6 md:p-9 lg:p-12">
                                        <div className="text-center space-y-2 mb-6">
                                            <div className="text-5xl">🔥</div>
                                            <div className="text-xs font-black uppercase tracking-[0.3em] text-orange-300">ÚLTIMO INSTINTO</div>
                                            <h2 className="text-3xl md:text-4xl font-black text-white font-mono-custom">¡BERSERKER, FASE 2!</h2>
                                            <p className="text-sm text-slate-300">
                                                El Berserker volvió con <strong className="text-orange-300">3 HP</strong>.
                                                Debes reasignar su dado: <strong className="text-amber-300">1 D</strong> y <strong className="text-cyan-300">5 A</strong>.
                                            </p>
                                            <p className="text-xs text-cyan-300 font-mono-custom">
                                                Si acierta cualquier cara A, anula todo el daño del ataque. <strong>Ultra Impulso atraviesa este esquive.</strong>
                                            </p>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3 mb-5">
                                            <div className="rounded-2xl bg-amber-950/30 border border-amber-500/30 p-4 text-center">
                                                <div className="text-xs uppercase tracking-widest text-amber-300 font-bold">D · Ataque</div>
                                                <div className="text-2xl font-black font-mono-custom text-amber-200 mt-1">
                                                    {currentDNums.length ? currentDNums.join(', ') : '—'}
                                                </div>
                                                <div className="text-[11px] text-slate-400 mt-1">1 de 1</div>
                                            </div>
                                            <div className="rounded-2xl bg-cyan-950/30 border border-cyan-500/30 p-4 text-center">
                                                <div className="text-xs uppercase tracking-widest text-cyan-300 font-bold">A · Esquive</div>
                                                <div className="text-2xl font-black font-mono-custom text-cyan-200 mt-1">
                                                    {currentANums.length ? currentANums.join(', ') : '—'}
                                                </div>
                                                <div className="text-[11px] text-slate-400 mt-1">5 de 5</div>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-3 md:grid-cols-6 gap-2 mb-6">
                                            {[1,2,3,4,5,6].map(num => {
                                                const isD = currentDNums.includes(num);
                                                const isA = currentANums.includes(num);
                                                return (
                                                    <button
                                                        key={num}
                                                        onClick={() => handleToggleNumber(num)}
                                                        className={`h-14 rounded-xl font-black font-mono-custom text-xl border transition-all ${
                                                            isD
                                                                ? 'bg-amber-500/20 border-amber-400 text-amber-200 shadow-lg shadow-amber-500/10'
                                                                : isA
                                                                ? 'bg-cyan-500/20 border-cyan-400 text-cyan-200 shadow-lg shadow-cyan-500/10'
                                                                : 'bg-slate-900 border-slate-700 text-slate-300 hover:border-slate-500'
                                                        }`}
                                                    >
                                                        {num}
                                                        <span className="block text-[9px] uppercase tracking-widest mt-0.5 opacity-70">
                                                            {isD ? 'D' : isA ? 'A' : '—'}
                                                        </span>
                                                    </button>
                                                );
                                            })}
                                        </div>

                                        <button
                                            onClick={handleConfirmMit}
                                            disabled={!isBuildValid || isSubmittingMitRef.current}
                                            className="w-full py-4 rounded-2xl bg-gradient-to-r from-orange-400 to-amber-500 text-slate-950 font-black uppercase tracking-wider shadow-lg shadow-orange-500/20 disabled:bg-slate-800 disabled:text-slate-500 disabled:shadow-none"
                                        >
                                            🔥 Confirmar Fase 2
                                        </button>

                                        <div className="mt-4 text-center text-xs text-slate-500 font-mono-custom">
                                            La batalla permanece congelada hasta confirmar la segunda fase.
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        
                        {showMovementTest && (
                            <div className="movement-test-screen fixed inset-0 z-[80] bg-slate-950 p-2 md:p-4">
                                <div className="movement-test-shell mx-auto h-full flex flex-col gap-2.5 md:gap-3">
                                    <header className="shrink-0 flex items-center justify-between gap-3 rounded-2xl border border-emerald-400/20 bg-slate-900/90 px-3 py-2.5 md:px-5 md:py-3 shadow-xl">
                                        <div className="min-w-0">
                                            <div className="flex items-center gap-2 text-[9px] md:text-[10px] font-mono-custom font-bold uppercase tracking-[.24em] text-emerald-300">
                                                <span className="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_10px_#34d399]" />
                                                Simulación de movimiento · Zona 01
                                            </div>
                                            <h2 className="text-base md:text-2xl font-black font-mono-custom text-slate-100 leading-tight">Frontera Esmeralda</h2>
                                        </div>
                                        <div className="flex items-center gap-2 shrink-0">
                                            <div className="hidden sm:block text-right mr-2">
                                                <div className="text-[9px] text-slate-500 font-mono-custom uppercase tracking-widest">Estado</div>
                                                <div className={testIsMoving ? 'text-xs font-bold font-mono-custom text-cyan-300' : 'text-xs font-bold font-mono-custom text-slate-400'}>{testIsMoving ? (testIsSprinting ? 'ACELERANDO' : 'EN MOVIMIENTO') : 'EN REPOSO'}</div>
                                            </div>
                                            <button onClick={() => { resetTestJoystick(); testKeysRef.current = {}; testSprintRef.current = false; setShowMovementTest(false); }} className="px-3 md:px-4 py-2 rounded-xl bg-slate-800 hover:bg-rose-500/20 border border-slate-700 hover:border-rose-400/50 text-slate-200 font-bold text-xs md:text-sm transition">Salir ✕</button>
                                        </div>
                                    </header>

                                    <section ref={testTerrainRef} className="movement-test-terrain relative flex-1 min-h-0 overflow-hidden rounded-2xl md:rounded-3xl border border-emerald-400/25 shadow-[0_20px_70px_rgba(0,0,0,.45)]" aria-label="Terreno de entrenamiento">
                                        <div className="test-terrain-grid" />
                                        <div className="test-trail test-trail-one" />
                                        <div className="test-trail test-trail-two" />
                                        <div className="test-grass-patch left-[8%] top-[36%] rotate-12" />
                                        <div className="test-grass-patch right-[10%] top-[9%] -rotate-12" />
                                        <div className="test-grass-patch left-[42%] bottom-[7%] rotate-6" />
                                        <div className="absolute left-[50%] top-[50%] -translate-x-1/2 -translate-y-1/2 w-[min(46vw,420px)] aspect-square rounded-full border border-emerald-100/10 shadow-[0_0_50px_rgba(16,185,129,.05)] pointer-events-none z-[2]" />
                                        <div className="absolute left-[50%] top-[50%] -translate-x-1/2 -translate-y-1/2 w-[min(30vw,270px)] aspect-square rounded-full border border-dashed border-emerald-100/10 pointer-events-none z-[2]" />

                                        {MOVEMENT_TEST_OBSTACLES.map(obstacle => (
                                            <div key={obstacle.id} className="test-obstacle" style={{ left: obstacle.x + '%', top: obstacle.y + '%', width: obstacle.size + 'px', height: obstacle.size + 'px' }} aria-hidden="true">
                                                {obstacle.kind === 'tree' && <><div className="test-tree-shadow" /><div className="test-tree-trunk" /><div className="test-tree-crown" /></>}
                                                {obstacle.kind === 'rock' && <div className="test-rock-body" />}
                                                {obstacle.kind === 'ruin' && <><div className="test-ruin-shadow" /><div className="test-ruin-block" /><div className="test-ruin-block" /><div className="test-ruin-block" /><div className="test-ruin-top" /></>}
                                                {obstacle.kind === 'bush' && <div className="test-bush" />}
                                            </div>
                                        ))}

                                        <div className={'test-player ' + (testIsMoving ? 'is-moving ' : '') + (testIsSprinting ? 'is-sprinting' : '')} style={{ left: testPlayerPos.x + '%', top: testPlayerPos.y + '%', transform: 'translate(-50%, -50%)' }} aria-label="Personaje controlable">
                                            <div className="test-player-shadow" />
                                            <div className="test-player-aura" />
                                            <div className="test-player-facing" style={{ transform: 'rotate(' + testPlayerFacing + 'deg)' }}>
                                                <div className="test-player-sprite">
                                                    <div className="test-player-jetpack" />
                                                    <div className="test-player-leg left"><span className="test-player-boot" /></div>
                                                    <div className="test-player-leg right"><span className="test-player-boot" /></div>
                                                    <div className="test-player-arm left" />
                                                    <div className="test-player-arm right" />
                                                    <div className="test-player-torso" />
                                                    <div className="test-player-helmet"><div className="test-player-visor" /></div>
                                                </div>
                                            </div>
                                            <div className="test-player-label">NOVA · EXPLORADOR</div>
                                        </div>

                                        <div className="absolute z-20 top-3 left-3 md:top-5 md:left-5 rounded-xl border border-white/10 bg-slate-950/65 backdrop-blur-sm px-3 py-2 pointer-events-none">
                                            <div className="text-[9px] md:text-[10px] font-mono-custom font-bold tracking-[.2em] text-emerald-300 uppercase">Sector de exploración</div>
                                            <div className="text-[10px] md:text-xs text-slate-300 font-mono-custom mt-1">Bosque · Ruinas · Rocas</div>
                                        </div>
                                        <div className="absolute z-20 top-3 right-3 md:top-5 md:right-5 text-right rounded-xl border border-white/10 bg-slate-950/65 backdrop-blur-sm px-3 py-2 pointer-events-none">
                                            <div className="text-[9px] md:text-[10px] font-mono-custom text-slate-500 uppercase tracking-widest">Coordenadas</div>
                                            <div className="text-xs md:text-sm font-bold font-mono-custom text-cyan-200 tabular-nums">{testPlayerPos.x.toFixed(1)} : {testPlayerPos.y.toFixed(1)}</div>
                                        </div>

                                        <div ref={testJoystickRef} className="test-joystick" onContextMenu={e => e.preventDefault()}
                                            onPointerDown={e => {
                                                if (testJoystickPointerRef.current !== null) return;
                                                e.preventDefault();

                                                try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
                                                updateTestJoystick(e.clientX, e.clientY);

                                                isRolling ? 'animate-bounce border-cyan-400 bg-cyan-950/60 text-cyan-300 glow-cyan' : 'border-slate-700 bg-slate-900 text-slate-100'
                                            }`}>
                                                {currentRollValue}
                                            </div>
                                        </div>

                                        <div className="battle-action-buttons w-full max-w-sm">
                                            {(
                                                gameMode !== 'ONLINE' ||
                                                (combatPhase === 'ATTACK_ROLL'
                                                    ? currentTurnPlayer === (isRoomHost ? 1 : 2)
                                                    : currentTurnPlayer !== (isRoomHost ? 1 : 2))
                                            ) && (
                                                <>
                                            {combatPhase === 'ATTACK_ROLL' && (
                                                <button
                                                    disabled={isRolling || isTurnProcessing || (gameMode === 'AI' && currentTurnPlayer === 2)}
                                                    onClick={handleAttackRoll}
                                                    className={`w-full py-4 rounded-2xl font-black text-base uppercase tracking-wider transition-all font-mono-custom ${
                                                        isRolling || isTurnProcessing || (gameMode === 'AI' && currentTurnPlayer === 2)
                                                        ? 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'
                                                        : 'bg-gradient-to-r from-amber-500 to-red-600 text-slate-950 shadow-lg shadow-amber-500/20 hover:brightness-110 active:scale-95 cursor-pointer'
                                                    }`}
                                                >
                                                    {isRolling ? 'Lanzando Dado...' : (gameMode === 'AI' && currentTurnPlayer === 2) ? 'IA Pensando...' : `🎲 Lanzar Dado de Ataque`}
                                                </button>
                                            )}

                                            {combatPhase === 'ATTACK_ROLL' && availableMit && !currentAttacker.passiveState?.counterSequence && !(gameMode === 'AI' && currentTurnPlayer === 2) && (
                                                <button
                                                    disabled={isRolling || isTurnProcessing}
                                                    onClick={handleSwitchMit}
                                                    className="w-full mt-3 py-3 rounded-xl font-bold text-sm uppercase tracking-wider transition-all font-mono-custom bg-gradient-to-r from-violet-500 to-indigo-600 text-white shadow-lg shadow-violet-500/20 hover:brightness-110 active:scale-95 disabled:bg-slate-800 disabled:text-slate-500 disabled:border disabled:border-slate-700 disabled:shadow-none disabled:cursor-not-allowed"
                                                >
                                                    🔄 Cambiar a {availableMit.name} · Ceder turno
                                                </button>
                                            )}

                                            {combatPhase === 'DEFENSE_ROLL' && (
                                                <button
                                                    disabled={isRolling || isTurnProcessing || !attackResult?.success || (gameMode === 'AI' && currentTurnPlayer === 1)}
                                                    onClick={() => handleDefenseRoll()}
                                                    className={`w-full py-4 rounded-2xl font-black text-base uppercase tracking-wider transition-all font-mono-custom ${
                                                        isRolling || isTurnProcessing || (gameMode === 'AI' && currentTurnPlayer === 1)
                                                        ? 'bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed'
                                                        : 'bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 shadow-lg shadow-cyan-500/20 hover:brightness-110 active:scale-95 cursor-pointer'
                                                    }`}
                                                >
                                                    {isRolling ? 'Lanzando Dado...' : (gameMode === 'AI' && currentTurnPlayer === 1) ? 'IA Esquivando...' : `🛡️ Lanzar Dado de Esquive`}
                                                </button>
                                            )}
                                                </>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* COMBAT LOG */}
                                {gameState === 'BATTLE' && !disconnectedPlayer && (
                                <div className="battle-log glass-panel rounded-2xl p-4 border border-slate-800">
                                    <h4 className="text-xs font-bold font-mono-custom text-slate-400 uppercase tracking-widest mb-2">BITÁCORA DE COMBATE</h4>
                                    <div ref={logContainerRef} className="battle-log-list h-32 overflow-y-auto space-y-1 text-xs font-mono-custom pr-2">
                                        {combatLog.map((log, index) => (
                                            <div 
                                                key={index} 
                                                className={`p-1.5 rounded ${
                                                    log.type === 'attack_hit' ? 'bg-amber-950/30 text-amber-300 border-l-2 border-amber-500' :
                                                    log.type === 'attack_miss' ? 'bg-slate-900 text-slate-400 border-l-2 border-slate-600' :
                                                    log.type === 'defense_success' ? 'bg-cyan-950/30 text-cyan-300 border-l-2 border-cyan-500' :
                                                    log.type === 'defense_fail' ? 'bg-rose-950/30 text-rose-300 border-l-2 border-rose-500' :
                                                    log.type === 'victory' ? 'bg-yellow-500/20 text-yellow-300 font-bold border-l-4 border-yellow-500' :
                                                    'bg-slate-900/60 text-slate-300'
                                                }`}
                                            >
                                                {log.text}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                )}
                                    </>
                                )}
                            </div>
                        )}
                    </main>

                    {/* FOOTER */}
                    <footer className="app-footer text-center py-4 text-xs font-mono-custom text-slate-500 border-t border-slate-900 mt-6">
                        MIT’S Engine — Manual Oficial v1.0
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            <AppErrorBoundary>
                <App />
            </AppErrorBoundary>
        );
    </script>
</body>
</html>
