    <script type="text/babel">
        const { useState, useEffect, useRef, useLayoutEffect } = React;

        // Sound Synthesis Utility (Web Audio API)
        let sharedAudioContext = null;
        const playSynthSound = (type, soundEnabled = true) => {
            if (!soundEnabled) return;
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                const ctx = sharedAudioContext || (sharedAudioContext = new AudioContextClass());
                if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;

                if (type === 'roll') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(60, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'dodge') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'fail') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.setValueAtTime(120, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            } catch (e) {
                // Ignore audio context errors before user gesture
            }
        };

        // --- CLASSES DEFINITIONS ---
        // Los MIT son núcleos artificiales de combate. La clase define su arquitectura de adaptación; el cuerpo es solo la plataforma que el núcleo controla.
        const MIT_CLASSES = [
            { id: 'Agil1', name: 'Evasivo', hp: 10, d: 2, a: 4, desc: 'Núcleo de reacción extrema. Ultra Impulso convierte defensas casi perfectas en energía ofensiva.' },
            { id: 'Agil2', name: 'Móvil', hp: 15, d: 2, a: 3, desc: 'Núcleo de movilidad adaptativa. Sombra permite al MIT alterar temporalmente su respuesta al combate.' },
            { id: 'Normal1', name: 'Técnico', hp: 15, d: 2, a: 2, desc: 'Núcleo analítico. Útil acumula recursos al interpretar cada nuevo ciclo de combate.' },
            { id: 'Normal2', name: 'Versátil', hp: 20, d: 2, a: 1, desc: 'Núcleo de aprendizaje. Adaptabilidad transforma el daño recibido en patrones defensivos.' },
            { id: 'Resistente1', name: 'Berserker', hp: 20, d: 3, a: 1, desc: 'Núcleo de supervivencia extrema. Último Instinto reconstruye funciones esenciales tras un colapso.' },

        ];

        const MIT_PASSIVE_DETAILS = {
            Agil1: 'Ultra Impulso · Sobrecarga de respuesta: cuando una defensa normal reduce el daño final a 0 o 1, el núcleo almacena 1 carga. Con 3 cargas, el siguiente ataque impacta automáticamente, selecciona una de tus caras D y obtiene +1 daño. Ignora esquives y defensas especiales.',
            Agil2: 'Sombra · Desfase cinético: al esquivar por completo un ataque con una cara A, el núcleo entra en un estado temporal de invulnerabilidad y potencia sus ataques. Sombra tiene una duración limitada y un periodo de enfriamiento; consulta sus indicadores durante el combate.',
            Normal1: 'Útil · Análisis incremental: al inicio de cada turno propio, el núcleo acumula +1 de ataque y +1 de defensa, hasta +3 en cada reserva. Un ataque fallido no consume el bono ofensivo; una defensa solo consume el bono cuando reduce daño real.',
            Normal2: 'Adaptabilidad · Aprendizaje reactivo: cada vez que pierde al menos 1 HP, el núcleo registra 1 carga de adaptación. Al reunir 2, su siguiente defensa aplicable reduce 2 puntos de daño y consume ambas cargas.',
            Resistente1: 'Último Instinto · Protocolo de emergencia: al colapsar por primera vez, el núcleo reconstruye su plataforma con 3 HP y una configuración de 1 cara D y 5 caras A. En esta segunda fase, cualquier cara A que active la defensa anula todo el daño. Ultra Impulso puede atravesar esta protección.',
            Resistente2: 'Revestimiento · Blindaje adaptativo: cada impacto que quite HP permite al núcleo reforzar su blindaje. Tras el primer impacto, cada nuevo impacto aumenta la reducción hasta un máximo de 3. Si transcurren 3 turnos de ataque rivales sin recibir daño, el blindaje pierde su progreso acumulado.',
            Dano1: 'Enfurecimiento · Optimización ofensiva: los ataques acertados comienzan con 1 de daño. Cada ataque que quite al menos 1 HP aumenta permanentemente en +1 el daño de los siguientes ataques de ese núcleo durante su vida actual.',
            Dano2: 'Contraataque · Lectura de patrones: cuando una defensa válida reduce un impacto recibido a 0 o 1 de daño, el núcleo puede activar una secuencia de dos ataques: el primero no puede ser defendido y el segundo sí. Después el rival recupera la iniciativa; la habilidad tiene enfriamiento.'
        };

        const MAX_COMBAT_LOG_ENTRIES = 250;
        const trimCombatLog = entries => Array.isArray(entries)
            ? entries.slice(-MAX_COMBAT_LOG_ENTRIES)
            : [];

        // Generate AI MIT
        const generateAiMit = (mitIndex) => {
            const randomClass = MIT_CLASSES[Math.floor(Math.random() * MIT_CLASSES.length)];
            const availableNumbers = [1, 2, 3, 4, 5, 6];
            
            for (let i = availableNumbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [availableNumbers[i], availableNumbers[j]] = [availableNumbers[j], availableNumbers[i]];
            }

            const attackNums = availableNumbers.slice(0, randomClass.d).sort((a,b) => a-b);
            const evadeNums = availableNumbers.slice(randomClass.d, randomClass.d + randomClass.a).sort((a,b) => a-b);

            return {
                id: `ai_mit_${mitIndex}_${Date.now()}`,
                classData: randomClass,
                name: `MIT-AI ${randomClass.name}`,
                maxHp: randomClass.hp,
                currentHp: randomClass.hp,
                attackNums,
                evadeNums,
                passiveState: window.MITSGameRules.createPassiveState(randomClass.id)
            };
        };

        // --- MAIN APP COMPONENT ---
        class AppErrorBoundary extends React.Component {
            state = { hasError: false, errorMessage: '' };

            static getDerivedStateFromError(error) {
                return {
                    hasError: true,
                    errorMessage: error instanceof Error ? error.message : String(error || 'Error desconocido')
                };
            }

            componentDidCatch(error, info) {
                console.error("MIT'S render error:", error, info);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-slate-950 p-6 text-center">
                            <div className="max-w-lg glass-panel rounded-2xl border border-rose-900/60 p-8">
                                <div className="text-5xl mb-4">⚠️</div>
                                <h1 className="text-xl font-bold font-mono-custom text-rose-300">MIT'S tuvo un fallo de interfaz</h1>
                                <p className="mt-3 text-sm text-slate-400 font-mono-custom">
                                    La partida no se borró. Recarga la página para reconstruir la interfaz desde el estado actual.
                                </p>
                                {this.state.errorMessage && (
                                    <details className="mt-4 text-left">
                                        <summary className="cursor-pointer text-xs text-slate-500">Detalle técnico</summary>
                                        <pre className="mt-2 max-h-28 overflow-auto whitespace-pre-wrap break-words rounded-lg bg-slate-950/80 p-3 text-[10px] text-rose-300">
                                            {this.state.errorMessage}
                                        </pre>
                                    </details>
                                )}
                                <button
                                    onClick={() => window.location.reload()}
                                    className="mt-6 px-5 py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold"
                                >
                                    🔄 Recargar
                                </button>
                            </div>
                        </div>
                    );
                }

                return this.props.children;
            }
        }

        const MOVEMENT_TEST_OBSTACLES = [
            { id:'pine-northwest',kind:'tree',x:17,y:24,size:82,radius:30 },
            { id:'stone-west',kind:'rock',x:31,y:43,size:62,radius:24 },

            { id:'pine-southwest',kind:'tree',x:17,y:76,size:86,radius:31 },

            { id:'pine-southeast',kind:'tree',x:77,y:79,size:82,radius:30 },
            { id:'ruins-south',kind:'ruin',x:91,y:65,size:72,radius:28 },

        ];

        function App() {
            const ONLINE_ROOM_TTL_MS = 30 * 60 * 1000;
            const ONLINE_PRESENCE_GRACE_MS = 6000;
            // Game State
            const [gameState, setGameState] = useState('MENU'); // MENU, BUILD, BATTLE, GAMEOVER
            const [gameMode, setGameMode] = useState('AI'); // 'AI' | 'LOCAL' | 'ONLINE'
            // Nombre temporal: se conserva mientras esta página permanezca abierta.
            const [playerName, setPlayerName] = useState('');
            const [nameDraft, setNameDraft] = useState('');
            const [onlineUser, setOnlineUser] = useState(null);
            const [roomCode, setRoomCode] = useState('');
            const [roomInput, setRoomInput] = useState('');
            const [roomName, setRoomName] = useState('Sala de combate');
            const [roomVisibility, setRoomVisibility] = useState('public');
            const [publicRooms, setPublicRooms] = useState([]);
            const [onlineRoomData, setOnlineRoomData] = useState(null);
            const [onlineStatus, setOnlineStatus] = useState('');
            const [isJoiningRoom, setIsJoiningRoom] = useState(false);
            const [isCreatingRoom, setIsCreatingRoom] = useState(false);
            const isCreatingRoomRef = useRef(false);
            const isJoiningRoomRef = useRef(false);
            const [isRoomHost, setIsRoomHost] = useState(false);
            const [disconnectedPlayer, setDisconnectedPlayer] = useState(null);
            const [winnerPlayer, setWinnerPlayer] = useState(null);
            const onlineListenerRef = useRef(null);
            const onlinePresenceRef = useRef(null);
            const presenceGraceTimerRef = useRef(null);
            const waitingRoomExpiryTimerRef = useRef(null);
            const waitingRoomExpiryKeyRef = useRef(null);
            const clearWaitingRoomExpiryTimer = () => {
                if (waitingRoomExpiryTimerRef.current !== null) clearTimeout(waitingRoomExpiryTimerRef.current);
                waitingRoomExpiryTimerRef.current = null;
                waitingRoomExpiryKeyRef.current = null;
            };
            const [soundEnabled, setSoundEnabled] = useState(true);
            // Sandbox de movimiento: estado independiente del combate y de Firebase.
            const [showMovementTest, setShowMovementTest] = useState(false);
            const [showCombatTest, setShowCombatTest] = useState(false);
            const [combatTestMessage, setCombatTestMessage] = useState('¡Un MIT salvaje aparece!');
            const [combatTestAction, setCombatTestAction] = useState('');
            const [testPlayerPos, setTestPlayerPos] = useState({ x: 50, y: 52 });
            const [testPlayerFacing, setTestPlayerFacing] = useState(0);
            const [testIsMoving, setTestIsMoving] = useState(false);
            const [testIsSprinting, setTestIsSprinting] = useState(false);
            const [testJoystickKnob, setTestJoystickKnob] = useState({ x: 0, y: 0 });
            const testTerrainRef = useRef(null);
            const testJoystickRef = useRef(null);
            const testJoystickVectorRef = useRef({ x: 0, y: 0 });
            const testJoystickPointerRef = useRef(null);
            const testSprintRef = useRef(false);
            const testSprintingRef = useRef(false);
            const testKeysRef = useRef({});
            const testAnimationRef = useRef(null);
            const testPlayerPositionRef = useRef({ x: 50, y: 52 });
            const testMovingRef = useRef(false);
            const testFacingRef = useRef(0);

            const resetTestJoystick = () => {
                testJoystickPointerRef.current = null;
                testJoystickVectorRef.current = { x: 0, y: 0 };
                setTestJoystickKnob({ x: 0, y: 0 });
            };

            const updateTestJoystick = (clientX, clientY) => {
                const pad = testJoystickRef.current;
                if (!pad) return;
                const rect = pad.getBoundingClientRect();
                const max = Math.max(1, Math.min(rect.width, rect.height) * 0.27);
                let dx = clientX - (rect.left + rect.width / 2);
                let dy = clientY - (rect.top + rect.height / 2);
                const distance = Math.hypot(dx, dy);
                if (distance > max) {
                    dx = dx / distance * max;
                    dy = dy / distance * max;
                }
                setTestJoystickKnob({ x: dx, y: dy });
                const magnitude = Math.hypot(dx, dy) / max;
                const deadZone = 0.075;
                if (magnitude <= deadZone) {
                    testJoystickVectorRef.current = { x: 0, y: 0 };
                } else {
                    const strength = Math.min(1, (magnitude - deadZone) / (1 - deadZone));
                    testJoystickVectorRef.current = {
                        x: dx / max / magnitude * strength,

                    const tx = await window.MITSFirebase.runTransaction(roomRef, current => {
                        if (!current || current.hostUid !== onlineUser.uid || current.status !== 'waiting') return;
                        const expiryPatch = MITSOnlineRoomLifecycle.waitingRoomExpiryPatch(current, onlineUser.uid, startAttemptAt);
                        if (expiryPatch) return { ...current, ...expiryPatch };
                        if (!current.guestUid) return;
                        return { ...current, status: 'building' };
                    });
                    if (!tx.committed) {
                        setOnlineStatus('No se pudo iniciar: falta el rival o la sala ya cambió de estado.');
                        return;
                    }
                    const updatedRoom = tx.snapshot?.val?.();
                    if (updatedRoom?.isPublic === true) await retirePublicRoomListing(roomCode);
                    if (updatedRoom?.status === 'cancelled') {
                        setOnlineStatus('La sala expiró y se cerró automáticamente.');
                        return;
                    }
                } catch (error) {
                    console.error('No se pudo iniciar la sala:', error);
                    setOnlineStatus('Error al iniciar: ' + (error?.message || 'desconocido'));
                }
            };

            const cancelOnlineRoom = async () => {
                if (!isRoomHost || !roomCode || !onlineUser) return;
                try {
                    const roomRef = onlineRoomRef();
                    const tx = await window.MITSFirebase.runTransaction(roomRef, current => {
                        if (!current || current.hostUid !== onlineUser.uid || current.status !== 'waiting') return;
                        return { ...current, status: 'cancelled', closeReason: 'host_cancelled', closedBy: onlineUser.uid };
                    });
                    if (!tx.committed) {
                        setOnlineStatus('La sala ya no se puede cancelar.');
                        return;
                    }
                    clearWaitingRoomExpiryTimer();
                    if (onlineRoomData?.isPublic) await retirePublicRoomListing(roomCode);
                    await stopOnlinePresenceListener(true);
                    if (onlineListenerRef.current) {
                        window.MITSFirebase.off(onlineListenerRef.current.ref, 'value', onlineListenerRef.current.handler);
                        if (onlineListenerRef.current.presenceRef && onlineListenerRef.current.presenceHandler) window.MITSFirebase.off(onlineListenerRef.current.presenceRef, 'value', onlineListenerRef.current.presenceHandler);
                        onlineListenerRef.current = null;
                    }
                    setRoomCode('');
                    setOnlineRoomData(null);
                    setIsRoomHost(false);
                    setGameMode('ONLINE');
                    setGameState('ONLINE_LOBBY');
                    setOnlineStatus('Sala cancelada.');
                } catch (error) {
                    console.error('No se pudo cancelar la sala:', error);
                    setOnlineStatus('Error al cancelar: ' + (error?.message || 'desconocido'));
                }
            };

            const joinOnlineRoom = async (requestedCode = '') => {
                // Evita que un doble clic dispare dos reservas desde el mismo navegador.
                if (isJoiningRoomRef.current) return;
                isJoiningRoomRef.current = true;
                setIsJoiningRoom(true);
                let joinStep = 'autenticación';
                let claimedRoomCode = '';
                let claimedRoomUid = '';
                let reservationCreatedByThisJoin = false;
                let enteredLocalRoom = false;

                try {
                    const user = onlineUser || await window.MITSFirebase.ready;
                    const code = String(requestedCode || roomInput).trim().toUpperCase();
                    if (!/^[A-Z0-9]{6}$/.test(code)) {
                        setOnlineStatus('El código debe tener 6 caracteres.');
                        return;
                    }

                    const roomRef = onlineRoomRef(code);
                    if (!roomRef) throw new Error('No se pudo abrir la referencia de la sala.');

                    // Las salas sin invitado no se pueden leer públicamente. Un jugador
                    // desconocido intenta reservar directamente; solo el dueño de la sala
                    // puede aceptar esa escritura mientras el estado siga en WAITING.
                    joinStep = 'lectura de la sala';
                    let initialRoom = null;
                    try {
                        const initialSnapshot = await window.MITSFirebase.get(roomRef);
                        if (!initialSnapshot.exists()) {
                            setOnlineStatus('No existe esa sala. Revisa el código.');
                            return;
                        }
                        initialRoom = initialSnapshot.val() || {};
                    } catch (readError) {
                        const readCode = String(readError?.code || '').toUpperCase();
                        const readMessage = String(readError?.message || '');
                        const permissionDenied = readCode.includes('PERMISSION_DENIED') ||
                            readCode.includes('PERMISSION-DENIED') ||
                            /permission denied/i.test(readMessage);
                        if (!permissionDenied) throw readError;
                        // PERMISSION_DENIED es esperado para una sala WAITING sin invitado.
                        // La reserva atómica de abajo decide si existe y sigue disponible.
                    }

                    if (initialRoom) {
                        if (!initialRoom.hostUid) {
                            setOnlineStatus('La sala está dañada: no tiene anfitrión. Crea otra.');
                            return;
                        }
                        if (initialRoom.hostUid === user.uid) {
                            setOnlineStatus('No puedes unirte a tu propia sala desde el mismo jugador.');
                            return;
                        }
                        if (initialRoom.guestUid && initialRoom.guestUid !== user.uid) {
                            setOnlineStatus('La sala ya está llena.');
                            return;
                        }
                        if (!['waiting', 'building'].includes(initialRoom.status)) {
                            setOnlineStatus('La sala no admite jugadores. Estado actual: ' + String(initialRoom.status || 'SIN ESTADO') + '. Crea otra.');
                            return;
                        }
                        if (MITSOnlineRoomLifecycle.isWaitingRoomExpired(initialRoom, Date.now())) {
                            setOnlineStatus('La sala expiró. Pide al anfitrión que cree una nueva.');
                            return;
                        }
                    }

                    // Reserva atómica mediante update. Las reglas de RTDB solo permiten esta
                    // transición si el hueco sigue libre y el nuevo guestUid coincide con auth.uid.
                    // Si dos invitados compiten, Firebase acepta uno y rechaza el otro.
                    joinStep = 'reserva del lugar';
                    await window.MITSFirebase.update(roomRef, {
                        guestUid: user.uid,
                        player2Name: playerName
                    });
                    claimedRoomCode = code;
                    claimedRoomUid = user.uid;
                    reservationCreatedByThisJoin = initialRoom?.guestUid !== user.uid;

                    // Confirma que el servidor guardó la reserva para este usuario antes de entrar al lobby.
                    joinStep = 'verificación de la reserva';
                    const confirmedSnapshot = await window.MITSFirebase.get(roomRef);
                    const confirmedRoom = confirmedSnapshot.exists() ? (confirmedSnapshot.val() || {}) : {};
                    if (
                        !confirmedSnapshot.exists() ||
                        typeof confirmedRoom.hostUid !== 'string' ||
                        !confirmedRoom.hostUid ||
                        confirmedRoom.hostUid === user.uid ||
                        (initialRoom && confirmedRoom.hostUid !== initialRoom.hostUid) ||
                        confirmedRoom.guestUid !== user.uid ||
                        !['waiting', 'building'].includes(confirmedRoom.status) ||
                        MITSOnlineRoomLifecycle.isWaitingRoomExpired(confirmedRoom, Date.now())
                    ) {
                        console.warn('La sala no confirmó la reserva del invitado:', {
                            roomCode: code,
                            uid: user.uid,
                            status: confirmedRoom.status || null,
                            guestMatches: confirmedRoom.guestUid === user.uid
                        });
                        throw Object.assign(
                            new Error('Firebase no confirmó tu lugar en la sala. Vuelve al listado y prueba con una sala nueva.'),
                            { code: 'ROOM_RESERVATION_INVALID' }
                        );
                    }

                    if (confirmedRoom.isPublic === true) await retirePublicRoomListing(code);
                    setRoomCode(code);
                    enteredLocalRoom = true;
                    setOnlineRoomData(confirmedRoom);
                    setIsRoomHost(false);
                    setGameMode('ONLINE');
                    setGameState(confirmedRoom.status === 'building' ? 'BUILD' : 'ONLINE_LOBBY');
                    setBuilderPlayer(2);
                    setOnlineStatus(confirmedRoom.status === 'building' ? 'Partida iniciada. Construye tus 2 MITs.' : 'Te uniste a la sala. Espera a que el anfitrión inicie la partida.');
                    setDisconnectedPlayer(null);
                    // Registra presencia antes de comenzar a construir/pelear.
                    await registerOnlinePresence(code, 2, user.uid);
                    subscribeToOnlineRoom(code, 2, user.uid);
                } catch (error) {
                    if (enteredLocalRoom) await stopOnlinePresenceListener(true);
                    if (reservationCreatedByThisJoin && claimedRoomCode && window.MITSFirebase) {
                        try {
                            const claimedRef = window.MITSFirebase.ref(window.MITSFirebase.db, `rooms/${claimedRoomCode}`);
                            const releaseTx = await window.MITSFirebase.runTransaction(claimedRef, current => {
                                const patch = MITSOnlineRoomLifecycle.explicitExitPatch(current, claimedRoomUid);
                                if (!patch) return;
                                return { ...current, ...patch };
                            });
                            const afterRelease = releaseTx.snapshot?.val?.();
                            if (afterRelease?.status !== 'waiting') await retirePublicRoomListing(claimedRoomCode);
                        } catch (cleanupError) {
                            console.warn('No se pudo liberar la reserva fallida:', cleanupError);
                        }
                    }
                    if (enteredLocalRoom) {
                        setRoomCode('');
                        setOnlineRoomData(null);
                        setIsRoomHost(false);
                        setGameMode('ONLINE');
                        setGameState('ONLINE_LOBBY');
                    }
                    if (error?.code === 'PRESENCE_CANCELLED') return;
                    console.error('Error al entrar a la sala (' + joinStep + '):', error);
                    const errorCode = String(error?.code || '').toUpperCase();
                    const errorMessage = String(error?.message || '');
                    const permissionDenied =
                        errorCode.includes('PERMISSION_DENIED') ||
                        errorCode.includes('PERMISSION-DENIED') ||
                        /permission denied/i.test(errorMessage);

                    if (permissionDenied && joinStep === 'reserva del lugar') {
                        setOnlineStatus('No se pudo reservar: el código no existe, la sala está ocupada o ya no admite jugadores. Si el código es correcto, revisa que las reglas de Firebase estén publicadas.');
                    } else if (permissionDenied) {
                        setOnlineStatus('Firebase denegó el acceso durante ' + joinStep + '. Revisa las reglas de lectura de /rooms/$roomId.');
                    } else {
                        setOnlineStatus(error?.code === 'ROOM_RESERVATION_INVALID'
                            ? error.message
                            : 'Error al entrar: ' + (errorMessage || 'Error desconocido.'));
                    }
                } finally {
                    isJoiningRoomRef.current = false;
                    setIsJoiningRoom(false);
                }
            };

            const sanitizeOnlineDieFaces = value => {
                if (!Array.isArray(value)) return [];
                const faces = [];
                value.forEach(face => {
                    if (typeof face !== 'number' && typeof face !== 'string') return;
                    if (typeof face === 'string' && face.trim() === '') return;
                    const number = Number(face);
                    if (Number.isInteger(number) && number >= 1 && number <= 6 && !faces.includes(number)) {
                        faces.push(number);
                    }
                });
                return faces;
            };

            // Firebase es una frontera no confiable: se reconstruye cada MIT con
            // estadísticas oficiales y solo se aceptan caras de dado válidas.
            const sanitizeOnlineMit = value => {
                if (!value || typeof value !== 'object' || Array.isArray(value)) return null;
                const classId = typeof value.classData?.id === 'string' ? value.classData.id : null;
                const baseClass = MIT_CLASSES.find(candidate => candidate.id === classId);
                if (!baseClass) return null;

                const isBerserkerPhaseTwo =
                    classId === 'Resistente1' && value.passiveState?.berserkerPhase === 2;
                const classData = isBerserkerPhaseTwo
                    ? { ...baseClass, hp: 3, d: 1, a: 5 }
                    : baseClass;
                const attackNums = sanitizeOnlineDieFaces(value.attackNums);
                const evadeNums = sanitizeOnlineDieFaces(value.evadeNums);
                const assignedFaces = [...attackNums, ...evadeNums];

                if (
                    attackNums.length !== classData.d ||
                    evadeNums.length !== classData.a ||
                    new Set(assignedFaces).size !== assignedFaces.length
                ) return null;

                const maxHp = classData.hp;
                const incomingHp = Number(value.currentHp);
                if (
                    (typeof value.currentHp !== 'number' && typeof value.currentHp !== 'string') ||
                    (typeof value.currentHp === 'string' && value.currentHp.trim() === '') ||
                    !Number.isSafeInteger(incomingHp)
                ) return null;
                const currentHp = Math.min(maxHp, Math.max(0, Math.floor(incomingHp)));
                const rawName = typeof value.name === 'string' ? value.name.trim() : '';
                const rawId = typeof value.id === 'string' ? value.id.trim() : '';
                const passiveState = MITSGameRules.normalizePassiveState({
                    classData,
                    passiveState: value.passiveState
                });

                if (!isBerserkerPhaseTwo) passiveState.berserkerPhase = 1;

                return {
                    id: rawId.slice(0, 80) || `online_${classId}`,
                    name: rawName.slice(0, 80) || `MIT ${baseClass.name}`,
                    classData,
                    maxHp,
                    currentHp,
                    attackNums,
                    evadeNums,
                    passiveState
                };
            };

            const sanitizeOnlineMits = value => {
                if (!Array.isArray(value)) return [];
                return value.slice(0, 2).map(sanitizeOnlineMit);
            };

            const sanitizeOnlineCombatLog = value => {
                if (!Array.isArray(value)) return [];
                return value
                    .filter(log => log && typeof log === 'object' && !Array.isArray(log) && typeof log.text === 'string')
                    .slice(-250)
                    .map(log => ({
                        type: ['attack_hit', 'attack_miss', 'defense_success', 'defense_fail', 'ko', 'victory', 'system'].includes(log.type)
                            ? log.type
                            : 'system',
                        text: log.text.slice(0, 500)
                    }));
            };

            const sanitizeOnlineAttackResult = (value, attacker) => {
                if (!value || typeof value !== 'object' || Array.isArray(value)) return null;
                if (typeof value.success !== 'boolean') return null;
                const rawDamage = Number(value.damage);
                const rawRoll = Number(value.roll);
                if (
                    (typeof value.damage !== 'number' && typeof value.damage !== 'string') ||
                    (typeof value.damage === 'string' && value.damage.trim() === '') ||
                    !Number.isInteger(rawDamage) || rawDamage < 0 || rawDamage > 1000 ||
                    (typeof value.roll !== 'number' && typeof value.roll !== 'string') ||
                    (typeof value.roll === 'string' && value.roll.trim() === '') ||
                    !Number.isInteger(rawRoll) || rawRoll < 1 || rawRoll > 6
                ) return null;
                const damage = rawDamage;
                if (value.success && damage <= 0) return null;
                const roll = rawRoll;
                const classId = attacker?.classData?.id;
                const passiveInput = value.attackerPassiveState && typeof value.attackerPassiveState === 'object'
                    ? value.attackerPassiveState
                    : attacker?.passiveState;
                const normalizedPassiveState = MITSGameRules.normalizePassiveState({
                    ...(attacker || {}),
                    passiveState: passiveInput
                });

                return {
                    success: value.success,
                    damage: value.success ? damage : 0,
                    roll,
                    unstoppable: value.unstoppable === true && classId === 'Agil1',
                    counterChain: value.counterChain === true &&
                        classId === 'Dano2' &&
                        normalizedPassiveState.counterSequence?.phase === 'SECOND',
                    attackerPassiveState: normalizedPassiveState
                };
            };

            const sanitizeOnlineFloatingEffect = value => {
                if (!value || typeof value !== 'object' || Array.isArray(value)) return null;
                const player = sanitizeOnlinePlayerNumber(value.player);
                if (player === null || typeof value.id !== 'string' || typeof value.text !== 'string') return null;
                const type = ['hit', 'damage', 'dodge', 'miss'].includes(value.type) ? value.type : 'hit';
                const createdAt = Number(value.createdAt);
                return {
                    id: value.id.slice(0, 100),
                    player,
                    text: value.text.slice(0, 160),
                    type,
                    createdAt: Number.isFinite(createdAt) ? createdAt : Date.now()
                };
            };

            const sanitizeOnlineIndex = (value, mits) => {
                if (typeof value !== 'number' && typeof value !== 'string') return 0;
                if (typeof value === 'string' && value.trim() === '') return 0;
                const index = Number(value);
                if (Number.isInteger(index) && index >= 0 && index < mits.length && mits[index]) return index;
                const firstValid = mits.findIndex(Boolean);
                return firstValid >= 0 ? firstValid : 0;
            };

            const sanitizeOnlineTurnPlayer = value => {
                if (typeof value !== 'number' && typeof value !== 'string') return 1;
                if (typeof value === 'string' && value.trim() === '') return 1;
                return Number(value) === 2 ? 2 : 1;
            };

            const sanitizeOnlineCombatPhase = value =>
                ['ATTACK_ROLL', 'DEFENSE_ROLL', 'RESOLVING'].includes(value) ? value : 'ATTACK_ROLL';

            const sanitizeOnlinePlayerNumber = value => {
                if (typeof value !== 'number' && typeof value !== 'string') return null;
                if (typeof value === 'string' && value.trim() === '') return null;
                const player = Number(value);
                return player === 1 || player === 2 ? player : null;
            };

            const retirePublicRoomListing = async (code) => {
                if (!code || !window.MITSFirebase) return;
                try {
                    await window.MITSFirebase.set(window.MITSFirebase.ref(window.MITSFirebase.db, `publicRooms/${code}`), null);
                } catch (error) {
                    console.warn('No se pudo retirar el anuncio público de la sala:', error);
                }
            };

            const syncPublicRoomListing = async (code, room, registerDisconnect = false, ownerUid = onlineUser?.uid) => {
                if (!code || !room || !window.MITSFirebase || room.hostUid !== ownerUid || !ownerUid) return false;
                const firebase = window.MITSFirebase;
                const publicRef = firebase.ref(firebase.db, `publicRooms/${code}`);
                if (room.isPublic !== true) {
                    if (registerDisconnect) await firebase.onDisconnect(publicRef).cancel();
                    return false;
                }

                const listing = {
                    hostUid: room.hostUid,
                    hostName: typeof room.player1Name === 'string' ? room.player1Name : 'Anfitrión',
                    name: typeof room.roomName === 'string' ? room.roomName : 'Sala de combate',
                    createdAt: room.createdAt,
                    expiresAt: room.expiresAt,
                    status: room.status
                };
                const hostPresenceRef = firebase.ref(firebase.db, `rooms/${code}/presence/player1`);
                const isAvailableByState = MITSOnlineRoomLifecycle.isPublicRoomAvailable(
                    listing, room, Date.now(), ONLINE_ROOM_TTL_MS
                );

                try {
                    const hostPresenceSnapshot = await firebase.get(hostPresenceRef);
                    const isAvailable = isAvailableByState && hostPresenceSnapshot.exists();
                    if (isAvailable) {
                        if (registerDisconnect) await firebase.onDisconnect(publicRef).remove();
                        await firebase.set(publicRef, listing);
                        return true;
                    }
                    if (registerDisconnect) await firebase.onDisconnect(publicRef).cancel();
                    await retirePublicRoomListing(code);
                } catch (error) {
                    console.warn('No se pudo sincronizar el anuncio público:', error);
                }
                return false;
            };

            const exitClosedOnlineRoom = (code, message, isPublicRoom = false) => {
                const firebase = window.MITSFirebase;
                gameSessionRef.current += 1;
                cancelGameTimers();
                isRollingRef.current = false;
                setIsRolling(false);
                setIsTurnProcessing(false);
                aiTurnInProgressRef.current = false;
                isSubmittingMitRef.current = false;
                if (presenceGraceTimerRef.current !== null) {
                    clearTimeout(presenceGraceTimerRef.current);
                    presenceGraceTimerRef.current = null;
                }
                if (firebase && onlineListenerRef.current) {
                    firebase.off(onlineListenerRef.current.ref, 'value', onlineListenerRef.current.handler);
                    if (onlineListenerRef.current.presenceRef && onlineListenerRef.current.presenceHandler) {
                        firebase.off(onlineListenerRef.current.presenceRef, 'value', onlineListenerRef.current.presenceHandler);
                    }
                    onlineListenerRef.current = null;
                }
                stopOnlinePresenceListener(true).catch(error => console.warn('No se pudo limpiar la presencia:', error));
                clearWaitingRoomExpiryTimer();
                if (isPublicRoom) retirePublicRoomListing(code);
                setRoomCode('');
                setOnlineRoomData(null);
                setIsRoomHost(false);
                setGameMode('ONLINE');
                setGameState('ONLINE_LOBBY');
                setWinnerPlayer(null);
                setDisconnectedPlayer(null);
                setBerserkerRebuild(null);
                berserkerBuildKeyRef.current = null;
                setOnlineStatus(message);
            };

            const subscribeToOnlineRoom = (code, localPlayerNum, localUid = onlineUser?.uid) => {
                if (!window.MITSFirebase || !code || !localUid) return;
                if (onlineListenerRef.current) {
                    window.MITSFirebase.off(onlineListenerRef.current.ref, 'value', onlineListenerRef.current.handler);
                    if (onlineListenerRef.current.presenceRef && onlineListenerRef.current.presenceHandler) {
                        window.MITSFirebase.off(onlineListenerRef.current.presenceRef, 'value', onlineListenerRef.current.presenceHandler);
                    }
                }
                if (presenceGraceTimerRef.current !== null) {
                    clearTimeout(presenceGraceTimerRef.current);
                    presenceGraceTimerRef.current = null;
                }
                clearWaitingRoomExpiryTimer();

                const firebase = window.MITSFirebase;
                const roomRef = firebase.ref(firebase.db, `rooms/${code}`);
                const opponentNum = localPlayerNum === 1 ? 2 : 1;
                const opponentPresenceRef = firebase.ref(firebase.db, `rooms/${code}/presence/player${opponentNum}`);
                let currentRoomStatus = null;
                let currentRoomHasGuest = false;
                let currentOpponentUid = null;
                let opponentPresenceKnown = false;
                let opponentIsPresent = false;
                const activeRoomStatuses = MITSOnlineRoomLifecycle.ACTIVE_ROOM_STATUSES;

                const shouldMonitorOpponent = () => activeRoomStatuses.includes(currentRoomStatus) ||
                    (currentRoomStatus === 'waiting' && currentRoomHasGuest);

                const clearPresenceGraceTimer = () => {
                    if (presenceGraceTimerRef.current !== null) {
                        clearTimeout(presenceGraceTimerRef.current);
                        presenceGraceTimerRef.current = null;
                    }
                };

                const scheduleWaitingRoomExpiry = (room, retryDelay = null) => {
                    if (localPlayerNum !== 1 || room?.hostUid !== localUid || room?.status !== 'waiting') {
                        clearWaitingRoomExpiryTimer();
                        return;
                    }
                    const validExpiry = typeof room.expiresAt === 'number' && Number.isFinite(room.expiresAt);
                    const expiryKey = `${code}:${validExpiry ? room.expiresAt : 'invalid'}`;
                    if (waitingRoomExpiryKeyRef.current === expiryKey && waitingRoomExpiryTimerRef.current !== null) return;
                    clearWaitingRoomExpiryTimer();
                    waitingRoomExpiryKeyRef.current = expiryKey;
                    const dueAt = validExpiry ? room.expiresAt : Date.now();
                    const delay = retryDelay === null
                        ? Math.min(2147483647, Math.max(0, dueAt - Date.now()))
                        : retryDelay;
                    waitingRoomExpiryTimerRef.current = setTimeout(async () => {
                        waitingRoomExpiryTimerRef.current = null;
                        waitingRoomExpiryKeyRef.current = null;
                        try {
                            const checkedAt = Date.now();
                            const tx = await firebase.runTransaction(roomRef, current => {
                                const patch = MITSOnlineRoomLifecycle.waitingRoomExpiryPatch(current, localUid, checkedAt);
                                if (!patch) return;
                                return { ...current, ...patch };
                            });
                            const latestRoom = tx.snapshot?.val?.();
                            if (!tx.committed && latestRoom?.status === 'waiting' && latestRoom.hostUid === localUid) {
                                scheduleWaitingRoomExpiry(latestRoom);
                            }
                        } catch (error) {
                            console.warn('No se pudo cerrar la sala de espera expirada:', error);
                            if (onlineListenerRef.current?.ref === roomRef) scheduleWaitingRoomExpiry(room, 5000);
                        }
                    }, delay);
                };

                const schedulePresenceCheck = () => {
                    if (!shouldMonitorOpponent() || opponentIsPresent || presenceGraceTimerRef.current !== null ||
                        !currentOpponentUid) return;
                    const expectedOpponentUid = currentOpponentUid;
                    presenceGraceTimerRef.current = setTimeout(async () => {
                        presenceGraceTimerRef.current = null;
                        try {
                            // La transacción lee también /presence. Si el rival se
                            // reconectó mientras corría el temporizador, Firebase
                            // reintenta con el estado nuevo y la salida se cancela.
                            await firebase.runTransaction(roomRef, current => {
                                if (!current) return;
                                const latestOpponentUid = localPlayerNum === 1 ? current.guestUid : current.hostUid;
                                if (latestOpponentUid !== expectedOpponentUid) return;
                                const presence = current.presence?.[`player${opponentNum}`];
                                const opponentStillPresent = presence && typeof presence === 'object' &&
                                    !Array.isArray(presence) && Object.keys(presence).length > 0;
                                if (opponentStillPresent) return;
                                const patch = MITSOnlineRoomLifecycle.presenceTimeoutPatch(
                                    current, localPlayerNum, opponentNum
                                );
                                if (!patch) return;
                                return { ...current, ...patch };
                            });
                        } catch (error) {
                            console.warn('No se pudo verificar la desconexión del rival:', error);
                        }
                    }, ONLINE_PRESENCE_GRACE_MS);
                };

                const presenceHandler = snapshot => {
                    opponentPresenceKnown = true;
                    opponentIsPresent = snapshot.exists();
                    if (!shouldMonitorOpponent() || opponentIsPresent) clearPresenceGraceTimer();
                    else schedulePresenceCheck();
                };

                const handler = snapshot => {
                    const room = snapshot.val();
                    if (!room) {
                        retirePublicRoomListing(code);
                        exitClosedOnlineRoom(code, 'La sala dejó de existir. Regresaste al lobby.', true);
                        return;
                    }

                    const previousStatus = currentRoomStatus;
                    currentRoomStatus = typeof room.status === 'string' ? room.status : null;
                    currentRoomHasGuest = !!room.guestUid;
                    currentOpponentUid = localPlayerNum === 1 ? (room.guestUid || null) : (room.hostUid || null);

                    const knownStatuses = ['waiting', 'building', 'battle', 'berserker_build', 'gameover', 'cancelled', 'player_left'];
                    if (!knownStatuses.includes(currentRoomStatus)) {
                        exitClosedOnlineRoom(code, 'La sala tiene un estado inválido o antiguo. Regresaste al lobby.', room.isPublic === true);
                        return;
                    }
                    const isLocalMember = localPlayerNum === 1
                        ? room.hostUid === localUid
                        : room.guestUid === localUid;
                    if (!isLocalMember) {
                        exitClosedOnlineRoom(code, 'Ya no formas parte de esta sala. Regresaste al lobby.', room.isPublic === true);
                        return;
                    }

                    if (currentRoomStatus === 'waiting' && localPlayerNum === 1 && room.hostUid === localUid) {
                        scheduleWaitingRoomExpiry(room);
                    } else {
                        clearWaitingRoomExpiryTimer();
                    }
                    setOnlineRoomData(room);

                    if (['cancelled', 'player_left'].includes(currentRoomStatus)) {
                        if (previousStatus !== currentRoomStatus) {
                            const message = currentRoomStatus === 'cancelled'
                                ? (room.closeReason === 'host_cancelled'
                                    ? 'El anfitrión cerró la sala. Ya estás fuera de ella.'
                                    : room.closeReason === 'host_disconnect'
                                        ? 'El anfitrión perdió la conexión. La sala se cerró y regresaste al lobby.'
                                        : room.closeReason === 'room_expired'
                                            ? 'La sala superó su tiempo límite y se cerró. Regresaste al lobby.'
                                            : 'La sala de espera se cerró. Regresaste al lobby.')
                                : `${room.disconnectedPlayer === 1 || room.disconnectedPlayer === 2
                                    ? getPlayerDisplayName(Number(room.disconnectedPlayer))
                                    : 'Un jugador'} salió. La sala se cerró y regresaste al lobby.`;
                            exitClosedOnlineRoom(code, message, room.isPublic === true);
                        }
                        return;
                    }

                    if (currentRoomStatus === 'gameover' && previousStatus !== currentRoomStatus) {
                        gameSessionRef.current += 1;
                        cancelGameTimers();
                        isRollingRef.current = false;
                        setIsRolling(false);
                        setIsTurnProcessing(false);
                        aiTurnInProgressRef.current = false;
                    }

                    if (!shouldMonitorOpponent() || opponentIsPresent) {
                        clearPresenceGraceTimer();
                    } else if (opponentPresenceKnown && !opponentIsPresent) {
                        schedulePresenceCheck();
                    }

                    // Solo se publica una sala si el estado real sigue siendo WAITING,
                    // pública, libre y no expirada. El host es el único que la publica.
                    if (room.isPublic === true) {
                        if (localPlayerNum === 1 && currentRoomStatus === 'waiting' && !room.guestUid) {
                            syncPublicRoomListing(code, room, false, localUid);
                        } else {
                            retirePublicRoomListing(code);
                        }
                    }

                    const normalizedP1Mits = sanitizeOnlineMits(room.p1Mits);
                    const normalizedP2Mits = sanitizeOnlineMits(room.p2Mits);
                    const normalizedActiveP1Index = sanitizeOnlineIndex(room.activeP1Index, normalizedP1Mits);
                    const normalizedActiveP2Index = sanitizeOnlineIndex(room.activeP2Index, normalizedP2Mits);
                    const normalizedTurnPlayer = sanitizeOnlineTurnPlayer(room.currentTurnPlayer);
                    let normalizedCombatPhase = sanitizeOnlineCombatPhase(room.combatPhase);
                    const normalizedCombatLog = sanitizeOnlineCombatLog(room.combatLog);
                    const currentAttackerMit = normalizedTurnPlayer === 1
                        ? normalizedP1Mits[normalizedActiveP1Index]
                        : normalizedP2Mits[normalizedActiveP2Index];
                    const normalizedAttackResult = sanitizeOnlineAttackResult(room.attackResult, currentAttackerMit);
                    if (normalizedCombatPhase === 'DEFENSE_ROLL' && normalizedAttackResult?.success !== true) {
                        normalizedCombatPhase = 'ATTACK_ROLL';
                    }
                    const normalizedFloatingEffect = sanitizeOnlineFloatingEffect(room.floatingEffect);
                    const normalizedWinner = sanitizeOnlinePlayerNumber(room.winner);
                    const normalizedDisconnectedPlayer = sanitizeOnlinePlayerNumber(room.disconnectedPlayer);
                    const rebuildPlayer = sanitizeOnlinePlayerNumber(room.berserkerRebuild?.playerNum);
                    const rebuildIndex = Number(room.berserkerRebuild?.index);
                    const normalizedBerserkerRebuild = rebuildPlayer !== null && Number.isInteger(rebuildIndex) && rebuildIndex >= 0 && rebuildIndex <= 1
                        ? { playerNum: rebuildPlayer, index: rebuildIndex }
                        : null;

                    activeP1IndexRef.current = normalizedActiveP1Index;
                    activeP2IndexRef.current = normalizedActiveP2Index;
                    setP1Mits(normalizedP1Mits);
                    setP2Mits(normalizedP2Mits);
                    setBerserkerRebuild(normalizedBerserkerRebuild);
                    setActiveP1Index(normalizedActiveP1Index);
                    setActiveP2Index(normalizedActiveP2Index);
                    setCurrentTurnPlayer(normalizedTurnPlayer);
                    currentTurnPlayerRef.current = normalizedTurnPlayer;
                    setCombatPhase(normalizedCombatPhase);

                    if (!isRollingRef.current) {
                        const syncedRoll = Number(room.currentRollValue);
                        const safeRoll = Number.isInteger(syncedRoll) && syncedRoll >= 1 && syncedRoll <= 6 ? syncedRoll : 1;
                        setCurrentRollValue(safeRoll);
                        lastRollValueRef.current = safeRoll;
                    }

                    setAttackResult(normalizedAttackResult);
                    setCombatLog(normalizedCombatLog);

                    if (normalizedFloatingEffect?.id && normalizedFloatingEffect.id !== lastFloatingEffectIdRef.current) {
                        displayFloatingEffect(normalizedFloatingEffect);
                    }

                    if (room.status === 'waiting') {
                        setGameState('ONLINE_LOBBY');
                        setOnlineStatus(room.guestUid ? 'Rival conectado. El anfitrión puede iniciar la partida.' : 'Esperando a otro jugador...');
                    } else if (room.status === 'building') {
                        setGameState('BUILD');
                        if (room.guestUid && room.hostUid) setOnlineStatus('Ambos jugadores conectados.');
                    } else if (room.status === 'berserker_build') {
                        setGameState('BATTLE');
                        const buildKey = normalizedBerserkerRebuild
                            ? normalizedBerserkerRebuild.playerNum + ':' + normalizedBerserkerRebuild.index
                            : null;
                        if (buildKey !== berserkerBuildKeyRef.current) {
                            berserkerBuildKeyRef.current = buildKey;
                            setBuilderPlayer(normalizedBerserkerRebuild?.playerNum || 1);
                            setSelectedClass({ ...MIT_CLASSES.find(c => c.id === 'Resistente1'), name: 'Berserker · Fase 2', hp: 3, d: 1, a: 5 });
                            setCurrentDNums([]);
                            setCurrentANums([]);
                        }
                        setOnlineStatus(normalizedBerserkerRebuild?.playerNum === localPlayerNum
                            ? 'Asigna 1 cara de ataque y 5 de esquive para la segunda fase.'
                            : 'El Berserker rival está reconstruyendo su segunda fase.');
                    } else if (room.status === 'battle') {
                        berserkerBuildKeyRef.current = null;
                        setBerserkerRebuild(null);
                        setGameState('BATTLE');
                        setIsTurnProcessing(false);
                        if (!isRollingRef.current) setIsRolling(false);
                        setOnlineStatus(normalizedTurnPlayer === localPlayerNum ? 'Es tu turno.' : 'Turno del rival.');
                    } else if (room.status === 'gameover') {
                        setWinnerPlayer(normalizedWinner);
                        setBerserkerRebuild(null);
                        setGameState('GAMEOVER');
                        if (room.isPublic === true) retirePublicRoomListing(code);
                    }

                    const invalidMitData = (
                        (Array.isArray(room.p1Mits) && room.p1Mits.slice(0, 2).some((mit, index) => !!mit && !normalizedP1Mits[index])) ||
                        (Array.isArray(room.p2Mits) && room.p2Mits.slice(0, 2).some((mit, index) => !!mit && !normalizedP2Mits[index]))
                    );
                    if (invalidMitData) {
                        setOnlineStatus('La sala contiene datos de MIT inválidos. No se cargarán esas unidades; vuelve al lobby y crea una sala nueva.');
                    }
                };
                firebase.onValue(roomRef, handler);
                firebase.onValue(opponentPresenceRef, presenceHandler);
                onlineListenerRef.current = {
                    ref: roomRef,
                    handler,
                    presenceRef: opponentPresenceRef,
                    presenceHandler
                };
            };

            const syncOnline = async (changes) => {
                if (gameMode !== 'ONLINE' || !roomCode) return;
                const safeChanges = { ...changes };
                if (Object.prototype.hasOwnProperty.call(safeChanges, 'combatLog')) {
                    safeChanges.combatLog = trimCombatLog(safeChanges.combatLog);
                }
                try { await window.MITSFirebase.update(onlineRoomRef(), safeChanges); }
                catch (error) { console.error('Firebase sync:', error); setOnlineStatus('Error de sincronización.'); }
            };

            const publishFloatingEffect = (effect) => {
                const event = {
                    ...effect,
                    id: `${Date.now()}_${Math.random().toString(36).slice(2, 9)}`,
                    createdAt: Date.now()
                };
                displayFloatingEffect(event);
                if (gameMode === 'ONLINE') syncOnline({ floatingEffect: event });
            };

            // --- BUILDER ACTIONS ---
            const handleSelectClass = (c) => {
                playSound('click');
                setSelectedClass(c);
                setCurrentDNums([]);
                setCurrentANums([]);
            };

            const handleToggleNumber = (num) => {
                playSound('click');
                if (currentDNums.includes(num)) {
                    setCurrentDNums(currentDNums.filter(n => n !== num));
                    return;
                }
                if (currentANums.includes(num)) {
                    setCurrentANums(currentANums.filter(n => n !== num));
                    return;
                }
                if (currentDNums.length < selectedClass.d) {
                    setCurrentDNums([...currentDNums, num].sort((a,b) => a-b));
                    return;
                }
                if (currentANums.length < selectedClass.a) {
                    setCurrentANums([...currentANums, num].sort((a,b) => a-b));
                    return;
                }
            };

            const isBuildValid = (
                currentDNums.length === selectedClass.d &&
                currentANums.length === selectedClass.a &&
                [...currentDNums, ...currentANums].every(face =>
                    Number.isInteger(face) && face >= 1 && face <= 6
                ) &&
                new Set([...currentDNums, ...currentANums]).size === currentDNums.length + currentANums.length
            );

            const handleConfirmMit = async () => {
                if (!isBuildValid || isSubmittingMitRef.current) return;
                isSubmittingMitRef.current = true;
                try {
                    playSound('click');

                    const newMit = {
                        id: `mit_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                        classData: selectedClass,
                        name: `MIT ${selectedClass.name}`,
                        maxHp: selectedClass.hp,
                        currentHp: selectedClass.hp,
                        attackNums: [...currentDNums],
                        evadeNums: [...currentANums],
                        passiveState: window.MITSGameRules.createPassiveState(selectedClass.id)
                    };

                    if (berserkerRebuild) {
                        const phaseTwoLog = [...combatLog, { type: 'system', text: '🔥 Berserker completó su transformación. Comienza su segunda fase con 3 HP.' }];
                        if (gameMode === 'ONLINE') {
                            const expectedPlayer = isRoomHost ? 1 : 2;
                            if (expectedPlayer !== berserkerRebuild.playerNum) {
                                setOnlineStatus('Esperando a que el dueño del Berserker asigne su dado.');
                                return;
                            }
                            const user = onlineUser || await window.MITSFirebase.ready;
                            const roomRef = onlineRoomRef();
                            const tx = await window.MITSFirebase.runTransaction(roomRef, room => {
                                if (!room || room.status !== 'berserker_build' ||
                                    room.berserkerRebuild?.playerNum !== expectedPlayer ||
                                    room.berserkerRebuild?.index !== berserkerRebuild.index) return;
                                const playerKey = room.hostUid === user.uid ? 'p1Mits'
                                    : room.guestUid === user.uid ? 'p2Mits' : null;
                                const expectedKey = expectedPlayer === 1 ? 'p1Mits' : 'p2Mits';
                                if (playerKey !== expectedKey) return;
                                const opponentKey = playerKey === 'p1Mits' ? 'p2Mits' : 'p1Mits';
                                const updated = Array.isArray(room[playerKey]) ? [...room[playerKey]] : [];
                                const original = updated[berserkerRebuild.index];
                                const transformed = window.MITSGameRules.activateBerserkerSecondPhase(original, currentDNums, currentANums);
                                if (!transformed) return;
                                updated[berserkerRebuild.index] = transformed;
                                const opponents = clearOpponentTemporaryEffects(room[opponentKey]);
                                return {
                                    ...room,
                                    [playerKey]: updated,
                                    [opponentKey]: opponents,
                                    status: 'battle',
                                    berserkerRebuild: null,
                                    currentTurnPlayer: expectedPlayer,
                                    combatPhase: 'ATTACK_ROLL',
                                    attackResult: null,
                                    combatLog: phaseTwoLog
                                };
                            });
                            if (!tx.committed) {
                                setOnlineStatus('No se pudo completar la transformación. Vuelve a intentarlo.');
                                return;
                            }
                            const room = tx.snapshot?.val?.();
                            if (room) {
                                setP1Mits(room.p1Mits || []);
                                setP2Mits(room.p2Mits || []);
                            }
                        } else {
                            const list = berserkerRebuild.playerNum === 1 ? [...p1Mits] : [...p2Mits];
                            const transformed = window.MITSGameRules.activateBerserkerSecondPhase(list[berserkerRebuild.index], currentDNums, currentANums);
                            if (!transformed) {
                                setOnlineStatus('La distribución del dado no es válida.');
                                return;
                            }
                            list[berserkerRebuild.index] = transformed;
                            if (berserkerRebuild.playerNum === 1) setP1Mits(list); else setP2Mits(list);
                            const opponentList = clearOpponentTemporaryEffects(berserkerRebuild.playerNum === 1 ? p2Mits : p1Mits);
                            if (berserkerRebuild.playerNum === 1) setP2Mits(opponentList); else setP1Mits(opponentList);
                        }
                        setBerserkerRebuild(null);
                        berserkerBuildKeyRef.current = null;
                        setSelectedClass(MIT_CLASSES[2]);
                        setCurrentDNums([]);
                        setCurrentANums([]);
                        setGameState('BATTLE');
                        setCombatPhase('ATTACK_ROLL');
                        setAttackResult(null);
                        setCurrentTurnPlayer(berserkerRebuild.playerNum);
                        currentTurnPlayerRef.current = berserkerRebuild.playerNum;
                        setCombatLog(phaseTwoLog);
                        setIsTurnProcessing(false);
                        if (gameMode !== 'ONLINE') {
                            if (gameMode === 'AI' && berserkerRebuild.playerNum === 2) {
                                scheduleGameTimeout(() => triggerAiTurn(), 800);
                            }
                        }
                        return;
                    }

                    if (gameMode === 'ONLINE') {
                        const user = onlineUser || await window.MITSFirebase.ready;
                        const roomRef = onlineRoomRef();
                        const tx = await window.MITSFirebase.runTransaction(roomRef, room => {
                            if (!room || !['building', 'waiting'].includes(room.status) ||
                                (room.status === 'waiting' && MITSOnlineRoomLifecycle.isWaitingRoomExpired(room, Date.now()))) return;
                            const playerKey = room.hostUid === user.uid ? 'p1Mits'
                                : room.guestUid === user.uid ? 'p2Mits' : null;
                            if (!playerKey) return;
                            const current = Array.isArray(room[playerKey]) ? room[playerKey] : [];
                            if (current.length >= 2) return;
                            const updated = [...current, newMit];
                            const otherKey = playerKey === 'p1Mits' ? 'p2Mits' : 'p1Mits';
                            const otherReady = Array.isArray(room[otherKey]) && room[otherKey].length === 2;
                            const bothReady = otherReady && updated.length === 2;
                            return {
                                ...room,
                                [playerKey]: updated,
                                status: bothReady ? 'battle' : 'building',
                                ...(bothReady ? {
                                    currentTurnPlayer: 1, combatPhase: 'ATTACK_ROLL',
                                    activeP1Index: 0, activeP2Index: 0,
                                    currentRollValue: 1, attackResult: null,
                                    combatLog: [{ type: 'system', text: '⚔️ ¡COMBATE ONLINE INICIADO!' }]
                                } : {})
                            };
                        });
                        if (!tx.committed) {
                            setOnlineStatus('No se pudo guardar el MIT. Comprueba que la sala siga activa.');
                            return;
                        }
                        setCurrentDNums([]);
                        setCurrentANums([]);
                        setSelectedClass(MIT_CLASSES[2]);
                        return;
                    }

                    if (builderPlayer === 1) {
                        const updated = [...p1Mits, newMit];
                        setP1Mits(updated);
                        setCurrentDNums([]);
                        setCurrentANums([]);
                        if (updated.length === 2) {
                            if (gameMode === 'AI') {
                                const aiList = [generateAiMit(1), generateAiMit(2)];
                                setP2Mits(aiList);
                                startBattle(updated, aiList);
                            } else {
                                setBuilderPlayer(2);
                            }
                        }
                    } else {
                        const updated = [...p2Mits, newMit];
                        setP2Mits(updated);
                        setCurrentDNums([]);
                        setCurrentANums([]);
                        if (updated.length === 2) startBattle(p1Mits, updated);
                    }
                } catch (error) {
                    console.error('Error al confirmar MIT:', error);
                    setOnlineStatus('No se pudo guardar el MIT: ' + error.message);
                } finally {
                    isSubmittingMitRef.current = false;
                }
            };

            const startBattle = (p1, p2) => {
                // Cada combate comienza desde un estado visual y lógico limpio.
                // Evita arrastrar resultados, efectos o valores de dado de otra partida.
                gameSessionRef.current += 1;
                cancelGameTimers();
                setGameState('BATTLE');
                setP1Mits(p1);
                setP2Mits(p2);
                activeP1IndexRef.current = 0;
                activeP2IndexRef.current = 0;
                setActiveP1Index(0);
                setActiveP2Index(0);
                currentTurnPlayerRef.current = 1;
                setCurrentTurnPlayer(1);
                setCombatPhase('ATTACK_ROLL');
                setAttackResult(null);
                setFloatingEffect(null);
                setCurrentRollValue(1);
                lastRollValueRef.current = 1;
                isRollingRef.current = false;
                setIsTurnProcessing(false);
                setIsRolling(false);
                aiTurnInProgressRef.current = false;
                if (aiTurnTimerRef.current !== null) {
                    clearTimeout(aiTurnTimerRef.current);
                    aiTurnTimerRef.current = null;
                }
                const initialLog = [{
                    type: 'system',
                    text: gameMode === 'ONLINE' ? '⚔️ ¡COMBATE ONLINE INICIADO!' : '⚔️ ¡COMBATE INICIADO! Ambos jugadores revelan su primer MIT.'
                }];
                setCombatLog(initialLog);
                if (gameMode === 'ONLINE') {
                    syncOnline({ status: 'battle', p1Mits: p1, p2Mits: p2, activeP1Index: 0, activeP2Index: 0, currentTurnPlayer: 1, combatPhase: 'ATTACK_ROLL', currentRollValue: 1, attackResult: null, combatLog: initialLog, winner: null });
                }
            };

            // --- COMBAT LOGIC ---
            const passiveIndicators = (mit) => {
                const state = window.MITSGameRules.normalizePassiveState(mit);
                const id = mit?.classData?.id;
                const items = [];
                if (id === 'Agil1') items.push(`Ultra Impulso: ${state.ultraCharges}/3`);
                if (id === 'Agil2') { if (state.shadowInvulnerableTurns > 0) items.push('Sombra: invulnerable (2 turnos rivales)'); else if (state.shadowCooldownTurns > 0) items.push(`Sombra: enfriamiento (${state.shadowCooldownTurns})`); else items.push('Sombra: lista'); }
                if (id === 'Normal1') { items.push(`Ataque +${state.technicalAttackBonus}/3`); items.push(`Defensa +${state.technicalDefenseBonus}/3`); }
                if (id === 'Normal2') items.push(`Adaptabilidad: ${state.adaptabilityCharges}/2`);
                if (id === 'Resistente1') items.push(state.berserkerPhase === 2 ? 'Último Instinto: FASE 2 · 3 HP' : 'Último Instinto: fase 1');
                if (id === 'Resistente2') { const v = state.murallaHits === 0 ? '+1 recibido' : 'sin vulnerabilidad'; const r = Math.min(3, Math.max(0, state.murallaHits - 1)); items.push(`Revestimiento: ${state.murallaHits}/4 · ${v} · reducción ${r}`); }
                if (id === 'Dano1') items.push(`Enfurecimiento: daño +${state.destructorBonus}`);
                if (id === 'Dano2') items.push(state.counterSequence?.phase === 'FIRST' ? 'Contraataque: 1/2' : state.counterSequence?.phase === 'SECOND' ? 'Contraataque: 2/2' : state.counterCooldownTurns > 0 ? `Contraataque: enfriamiento ${state.counterCooldownTurns}` : 'Contraataque: listo');
                return items;
            };

            const clearOpponentTemporaryEffects = (mits) => (Array.isArray(mits) ? mits : [])
                .map(mit => mit ? window.MITSGameRules.clearTemporaryPassiveEffects(mit) : mit);

            const normalizeMitForRender = (mit) => {
                const source = sanitizeOnlineMit(mit) || {};
                const classData = source.classData || { id: null, d: 0, a: 0 };
                const maxHpValue = Number(source.maxHp);
                const currentHpValue = Number(source.currentHp);
                const maxHp = Number.isFinite(maxHpValue) && maxHpValue > 0 ? maxHpValue : 1;
                const currentHp = Number.isFinite(currentHpValue)
                    ? Math.min(maxHp, Math.max(0, currentHpValue))
                    : 0;

                return {
                    ...source,
                    name: typeof source.name === 'string' && source.name.trim() ? source.name : 'MIT',
                    maxHp,
                    currentHp,
                    attackNums: Array.isArray(source.attackNums) ? source.attackNums : [],
                    evadeNums: Array.isArray(source.evadeNums) ? source.evadeNums : [],
                    classData,
                    passiveState: MITSGameRules.normalizePassiveState({
                        classData,
                        passiveState: source.passiveState
                    })
                };
            };

            const activeP1Mit = normalizeMitForRender(p1Mits[activeP1Index]);
            const activeP2Mit = normalizeMitForRender(p2Mits[activeP2Index]);
            const currentActionPlayer = combatPhase === 'DEFENSE_ROLL'
                ? (currentTurnPlayer === 1 ? 2 : 1)
                : currentTurnPlayer;

            const currentAttacker = currentTurnPlayer === 1 ? activeP1Mit : activeP2Mit;
            const currentDefender = currentTurnPlayer === 1 ? activeP2Mit : activeP1Mit;
            const currentTurnMits = currentTurnPlayer === 1 ? p1Mits : p2Mits;
            const currentTurnActiveIndex = currentTurnPlayer === 1 ? activeP1Index : activeP2Index;
            const availableMitIndex = window.MITSGameRules.findAvailableMitIndex(
                currentTurnMits,
                currentTurnActiveIndex
            );
            const availableMit = availableMitIndex === null ? null : currentTurnMits[availableMitIndex];

            const executeRollAnimation = (finalValue, callback) => {
                const session = gameSessionRef.current;
                isRollingRef.current = true;
                setIsRolling(true);
                playSound('roll');
                let count = 0;
                const interval = setInterval(() => {
                    if (session !== gameSessionRef.current) {
                        clearInterval(interval);
                        if (rollIntervalRef.current === interval) rollIntervalRef.current = null;
                        return;
                    }
                    const animatedValue = Math.floor(Math.random() * 6) + 1;
                    setCurrentRollValue(animatedValue);
                    lastRollValueRef.current = animatedValue;
                    count++;
                    if (count >= 10) {
                        clearInterval(interval);
                        if (rollIntervalRef.current === interval) rollIntervalRef.current = null;
                        setCurrentRollValue(finalValue);
                        lastRollValueRef.current = finalValue;
                        isRollingRef.current = false;
                        setIsRolling(false);
                        callback();
                    }
                }, 60);
                rollIntervalRef.current = interval;
            };

            // Attack Roll
            const handleAttackRoll = () => {
                if (isRollingRef.current || isRolling || isTurnProcessing || combatPhase !== 'ATTACK_ROLL') return;
                if (currentTurnPlayerRef.current !== currentTurnPlayer) return;
                if (gameMode === 'ONLINE' && currentTurnPlayer !== (isRoomHost ? 1 : 2)) return;

                setIsTurnProcessing(true);
                const roll = Math.floor(Math.random() * 6) + 1;
                executeRollAnimation(roll, () => {
                    const turnStart = window.MITSGameRules.beginPassiveAttackTurn(currentAttacker);
                    const attackerAtTurnStart = { ...currentAttacker, passiveState: turnStart.state };
                    const passiveAttack = window.MITSGameRules.resolvePassiveAttack({ attacker: attackerAtTurnStart, roll });
                    const isHit = passiveAttack.hit;
                    const updatedAttackerMits = [...currentTurnMits];
                    updatedAttackerMits[currentTurnActiveIndex] = { ...attackerAtTurnStart, passiveState: passiveAttack.state };
                    turnStart.events.forEach(event => publishFloatingEffect({ player: currentTurnPlayer, text: event, type: 'hit' }));
                    passiveAttack.events.forEach(event => publishFloatingEffect({ player: currentTurnPlayer, text: event, type: 'hit' }));
                    if (currentTurnPlayer === 1) setP1Mits(updatedAttackerMits); else setP2Mits(updatedAttackerMits);
