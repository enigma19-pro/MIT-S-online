    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Sound Synthesis Utility (Web Audio API)
        let sharedAudioContext = null;
        const playSynthSound = (type, soundEnabled = true) => {
            if (!soundEnabled) return;
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return;
                const ctx = sharedAudioContext || (sharedAudioContext = new AudioContextClass());
                if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;

                if (type === 'roll') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(60, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'dodge') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'fail') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.setValueAtTime(120, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                }
            } catch (e) {
                // Ignore audio context errors before user gesture
            }
        };

        // --- CLASSES DEFINITIONS ---
        const MIT_CLASSES = [
            { id: 'Agil1', name: 'Evasivo', hp: 10, d: 2, a: 4, desc: 'Ultra Impulso: 3 esquives completos activan un ataque inevitable con +1 daño.' },
            { id: 'Agil2', name: 'Móvil', hp: 15, d: 2, a: 3, desc: 'Sombra: un esquive completo otorga 1 turno rival de invulnerabilidad; enfriamiento de 1 turno.' },
            { id: 'Normal1', name: 'Técnico', hp: 15, d: 2, a: 2, desc: 'Útil: 50% de obtener un bono al atacar; puede guardar uno de ataque y uno de defensa.' },
            { id: 'Normal2', name: 'Versátil', hp: 20, d: 2, a: 1, desc: 'Adaptabilidad: cada daño recibido carga; con 2 cargas reduce 2 del siguiente golpe.' },
            { id: 'Resistente1', name: 'Berserker', hp: 20, d: 3, a: 1, desc: 'Último Instinto: al caer, reconstruye su dado y vuelve con 3 HP una sola vez.' },
            { id: 'Resistente2', name: 'Muralla', hp: 30, d: 2, a: 1, desc: 'Revestimiento: cada impacto mejora su resistencia hasta reducir 3 de daño.' },
            { id: 'Dano1', name: 'Destructor', hp: 15, d: 4, a: 1, desc: 'Enfurecimiento: ataques acertados empiezan en 1 y aumentan al quitar HP.' },
            { id: 'Dano2', name: 'Duelista', hp: 20, d: 3, a: 2, desc: 'Contraataque: si recibe 0 o 1 de daño, encadena dos ataques.' }
        ];

        // Generate AI MIT
        const generateAiMit = (mitIndex) => {
            const randomClass = MIT_CLASSES[Math.floor(Math.random() * MIT_CLASSES.length)];
            const availableNumbers = [1, 2, 3, 4, 5, 6];
            
            for (let i = availableNumbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [availableNumbers[i], availableNumbers[j]] = [availableNumbers[j], availableNumbers[i]];
            }

            const attackNums = availableNumbers.slice(0, randomClass.d).sort((a,b) => a-b);
            const evadeNums = availableNumbers.slice(randomClass.d, randomClass.d + randomClass.a).sort((a,b) => a-b);

            return {
                id: `ai_mit_${mitIndex}_${Date.now()}`,
                classData: randomClass,
                name: `MIT-AI ${randomClass.name}`,
                maxHp: randomClass.hp,
                currentHp: randomClass.hp,
                attackNums,
                evadeNums,
                passiveState: window.MITSGameRules.createPassiveState(randomClass.id)
            };
        };

        // --- MAIN APP COMPONENT ---
        function App() {
            // Game State
            const [gameState, setGameState] = useState('MENU'); // MENU, BUILD, BATTLE, GAMEOVER
            const [gameMode, setGameMode] = useState('AI'); // 'AI' | 'LOCAL' | 'ONLINE'
            const [onlineUser, setOnlineUser] = useState(null);
            const [roomCode, setRoomCode] = useState('');
            const [roomInput, setRoomInput] = useState('');
            const [onlineStatus, setOnlineStatus] = useState('');
            const [isJoiningRoom, setIsJoiningRoom] = useState(false);
            const [isCreatingRoom, setIsCreatingRoom] = useState(false);
            const isCreatingRoomRef = useRef(false);
            const isJoiningRoomRef = useRef(false);
            const [isRoomHost, setIsRoomHost] = useState(false);
            const [disconnectedPlayer, setDisconnectedPlayer] = useState(null);
            const [winnerPlayer, setWinnerPlayer] = useState(null);
            const onlineListenerRef = useRef(null);
            const onlinePresenceRef = useRef(null);
            const presenceGraceTimerRef = useRef(null);
            const [soundEnabled, setSoundEnabled] = useState(true);

            // Players MIT List
            const [builderPlayer, setBuilderPlayer] = useState(1);
            const [p1Mits, setP1Mits] = useState([]);
            const [p2Mits, setP2Mits] = useState([]);

            // Builder Selection
            const [selectedClass, setSelectedClass] = useState(MIT_CLASSES[2]);
            const [currentDNums, setCurrentDNums] = useState([]);
            const [currentANums, setCurrentANums] = useState([]);
            const [berserkerRebuild, setBerserkerRebuild] = useState(null);
            const isSubmittingMitRef = useRef(false);

            // Combat Active State
            const [activeP1Index, setActiveP1Index] = useState(0);
            const [activeP2Index, setActiveP2Index] = useState(0);
            const [currentTurnPlayer, setCurrentTurnPlayer] = useState(1);
            const [combatPhase, setCombatPhase] = useState('ATTACK_ROLL'); // ATTACK_ROLL, DEFENSE_ROLL, RESOLVING
            const [isRolling, setIsRolling] = useState(false);
            const isRollingRef = useRef(false);
            const rollIntervalRef = useRef(null);
            const gameSessionRef = useRef(0);
            const pendingTimeoutsRef = useRef(new Set());
            const [isTurnProcessing, setIsTurnProcessing] = useState(false);
            const [currentRollValue, setCurrentRollValue] = useState(1);
            const lastRollValueRef = useRef(1);
            const [attackResult, setAttackResult] = useState(null);
            const [combatLog, setCombatLog] = useState([]);
            const [floatingEffect, setFloatingEffect] = useState(null);
            const floatingEffectTimerRef = useRef(null);
            const lastFloatingEffectIdRef = useRef(null);

            const displayFloatingEffect = (effect) => {
                if (!effect || !effect.id || lastFloatingEffectIdRef.current === effect.id) return;
                if (effect.createdAt && Date.now() - effect.createdAt > 10000) return;
                lastFloatingEffectIdRef.current = effect.id;
                setFloatingEffect(effect);
                if (floatingEffectTimerRef.current !== null) clearTimeout(floatingEffectTimerRef.current);
                floatingEffectTimerRef.current = setTimeout(() => {
                    setFloatingEffect(current => current?.id === effect.id ? null : current);
                    floatingEffectTimerRef.current = null;
                }, 1750);
            };

            const logContainerRef = useRef(null);
            // Evita que una misma activación del turno de la IA ejecute varios lanzamientos.
            const aiTurnInProgressRef = useRef(false);
            // Referencias para que los temporizadores nunca usen un turno/MIT obsoleto.
            const currentTurnPlayerRef = useRef(currentTurnPlayer);
            currentTurnPlayerRef.current = currentTurnPlayer;
            const activeP2MitRef = useRef(null);
            const aiTurnTimerRef = useRef(null);

            const scheduleGameTimeout = (callback, delay) => {
                const timer = setTimeout(() => {
                    pendingTimeoutsRef.current.delete(timer);
                    callback();
                }, delay);
                pendingTimeoutsRef.current.add(timer);
                return timer;
            };

            const cancelGameTimers = () => {
                pendingTimeoutsRef.current.forEach(timer => clearTimeout(timer));
                pendingTimeoutsRef.current.clear();
                if (rollIntervalRef.current !== null) {
                    clearInterval(rollIntervalRef.current);
                    rollIntervalRef.current = null;
                }
                if (aiTurnTimerRef.current !== null) {
                    clearTimeout(aiTurnTimerRef.current);
                    pendingTimeoutsRef.current.delete(aiTurnTimerRef.current);
                    aiTurnTimerRef.current = null;
                }
                isRollingRef.current = false;
            };

            useEffect(() => {
                if (logContainerRef.current) {
                    logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
                }
            }, [combatLog]);

            const playSound = (type) => playSynthSound(type, soundEnabled);

            useEffect(() => {
                if (!window.MITSFirebase) return;
                window.MITSFirebase.ready
                    .then(user => setOnlineUser(user))
                    .catch(error => {
                        console.error('Firebase Auth:', error);
                        setOnlineStatus('No se pudo conectar con Firebase.');
                    });
            }, []);

            const onlineRoomRef = (code = roomCode) => {
                if (!code || !window.MITSFirebase) return null;
                return window.MITSFirebase.ref(window.MITSFirebase.db, `rooms/${code}`);
            };

            const generateRoomCode = () => {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
                let code = '';
                for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
                return code;
            };

            const registerOnlineDisconnect = async (code, playerNum) => {
                const roomRef = window.MITSFirebase.ref(window.MITSFirebase.db, `rooms/${code}`);
                const disconnectAction = window.MITSFirebase.onDisconnect(roomRef);
                // La salida posterior a GAMEOVER no debe modificar al ganador.
                // Solo cambiamos el estado y quién se desconectó.
                await disconnectAction.update({
                    status: 'player_left',
                    disconnectedPlayer: playerNum
                });
            };

            const cancelOnlineDisconnect = async (code = roomCode) => {
                if (!code || !window.MITSFirebase) return;
                try {
                    const roomRef = window.MITSFirebase.ref(window.MITSFirebase.db, `rooms/${code}`);
                    await window.MITSFirebase.onDisconnect(roomRef).cancel();
                } catch (error) {
                    console.warn('No se pudo cancelar la salida automática:', error);
                }
            };

            // Presencia por conexión: evita marcar una salida por una caída breve
            // de red. Cada reconexión vuelve a registrar su limpieza en el servidor.
            const registerOnlinePresence = (code, playerNum) => {
                if (!code || !window.MITSFirebase) return Promise.reject(new Error('No se pudo iniciar la presencia online.'));
                const firebase = window.MITSFirebase;
                const connectionId = `${Date.now()}_${Math.random().toString(36).slice(2)}`;
                const connectionRef = firebase.ref(firebase.db, `rooms/${code}/presence/player${playerNum}/${connectionId}`);
                const connectedRef = firebase.ref(firebase.db, '.info/connected');

                if (onlinePresenceRef.current) {
                    firebase.off(onlinePresenceRef.current.connectedRef, 'value', onlinePresenceRef.current.connectedHandler);
                }

                return new Promise((resolve, reject) => {
                    let registering = false;
                    let firstRegistration = true;
                    const connectedHandler = snapshot => {
                        if (snapshot.val() !== true || registering) return;
                        registering = true;
                        firebase.onDisconnect(connectionRef).remove()
                            .then(() => firebase.set(connectionRef, true))
                            .then(() => {
                                registering = false;
                                if (firstRegistration) {
                                    firstRegistration = false;
                                    resolve();
                                }
                            })
                            .catch(error => {
                                registering = false;
                                console.warn('No se pudo registrar la presencia online:', error);
                                if (firstRegistration) {
                                    firstRegistration = false;
                                    reject(error);
                                }
                            });
                    };

                    firebase.onValue(connectedRef, connectedHandler);
                    onlinePresenceRef.current = { connectedRef, connectedHandler, connectionRef, code, playerNum };
                });
            };

            const stopOnlinePresenceListener = () => {
                const presence = onlinePresenceRef.current;
                if (presence && window.MITSFirebase) {
                    window.MITSFirebase.off(presence.connectedRef, 'value', presence.connectedHandler);
                    onlinePresenceRef.current = null;
                }
            };

            const createOnlineRoom = async () => {
                if (isCreatingRoomRef.current) return;
                isCreatingRoomRef.current = true;
                setIsCreatingRoom(true);
                try {
                    const user = onlineUser || await window.MITSFirebase.ready;
                    let code = '';
                    let roomCreated = false;
                    for (let attempt = 0; attempt < 8 && !roomCreated; attempt++) {
                        code = generateRoomCode();
                        const roomRef = onlineRoomRef(code);
                        const tx = await window.MITSFirebase.runTransaction(roomRef, current => {
                            if (current !== null) return;
                            return {
                                hostUid: user.uid, guestUid: null, status: 'waiting',
                                p1Mits: [], p2Mits: [], activeP1Index: 0, activeP2Index: 0,
                                currentTurnPlayer: 1, combatPhase: 'ATTACK_ROLL', currentRollValue: 1,
                                attackResult: null, combatLog: [{ type: 'system', text: '⏳ Sala creada. Esperando al Jugador 2...' }],
                                winner: null
                            };
                        });
                        roomCreated = tx.committed;
                    }
                    if (!roomCreated) throw new Error('No se pudo generar un código de sala disponible.');
                    setRoomCode(code);
                    setIsRoomHost(true);
                    setGameMode('ONLINE');
                    setBuilderPlayer(1);
                    setGameState('ONLINE_LOBBY');
                    setOnlineStatus('Comparte el código con tu rival.');
                    setDisconnectedPlayer(null);
                    // La presencia individual detecta cierres reales sin convertir
                    // una reconexión breve en una salida definitiva.
                    await registerOnlinePresence(code, 1);
                    subscribeToOnlineRoom(code, 1);
                } catch (error) {
                    console.error(error);
                    setOnlineStatus('Error al crear la sala: ' + error.message);
                } finally {
                    isCreatingRoomRef.current = false;
                    setIsCreatingRoom(false);
                }
            };

            const joinOnlineRoom = async () => {
                // Evita que un doble clic dispare dos reservas desde el mismo navegador.
                if (isJoiningRoomRef.current) return;
                isJoiningRoomRef.current = true;
                setIsJoiningRoom(true);
                let joinStep = 'autenticación';

                try {
                    const user = onlineUser || await window.MITSFirebase.ready;
                    const code = roomInput.trim().toUpperCase();
                    if (!/^[A-Z0-9]{6}$/.test(code)) {
                        setOnlineStatus('El código debe tener 6 caracteres.');
                        return;
                    }

                    const roomRef = onlineRoomRef(code);
                    if (!roomRef) throw new Error('No se pudo abrir la referencia de la sala.');

                    // El invitado puede leer salas sin ocupar; después intenta reservar el único lugar disponible.
                    joinStep = 'lectura de la sala';
                    const initialSnapshot = await window.MITSFirebase.get(roomRef);
                    if (!initialSnapshot.exists()) {
                        setOnlineStatus('No existe esa sala. Revisa el código.');
                        return;
                    }

                    const initialRoom = initialSnapshot.val() || {};
                    if (!initialRoom.hostUid) {
                        setOnlineStatus('La sala está dañada: no tiene anfitrión. Crea otra.');
                        return;
                    }
                    if (initialRoom.hostUid === user.uid) {
                        setOnlineStatus('No puedes unirte a tu propia sala desde el mismo jugador.');
                        return;
                    }
                    if (initialRoom.guestUid && initialRoom.guestUid !== user.uid) {
                        setOnlineStatus('La sala ya está llena.');
                        return;
                    }
                    if (!['waiting', 'building'].includes(initialRoom.status)) {
                        setOnlineStatus('La sala no admite jugadores. Estado actual: ' + String(initialRoom.status || 'SIN ESTADO') + '. Crea otra.');
                        return;
                    }

                    // Reserva atómica mediante update. Las reglas de RTDB solo permiten esta
                    // transición si el hueco sigue libre y el nuevo guestUid coincide con auth.uid.
                    // Si dos invitados compiten, Firebase acepta uno y rechaza el otro.
                    joinStep = 'reserva del lugar';
                    await window.MITSFirebase.update(roomRef, {
                        guestUid: user.uid,
                        status: 'building'
                    });

                    // Confirma que el servidor guardó la reserva para este usuario antes de entrar al constructor.
                    joinStep = 'verificación de la reserva';
                    const confirmedSnapshot = await window.MITSFirebase.get(roomRef);
                    const confirmedRoom = confirmedSnapshot.exists() ? (confirmedSnapshot.val() || {}) : {};
                    if (
                        !confirmedSnapshot.exists() ||
                        confirmedRoom.hostUid !== initialRoom.hostUid ||
                        confirmedRoom.guestUid !== user.uid ||
                        confirmedRoom.status !== 'building'
                    ) {
                        console.warn('La sala no confirmó la reserva del invitado:', {
                            roomCode: code,
                            uid: user.uid,
                            status: confirmedRoom.status || null,
                            guestMatches: confirmedRoom.guestUid === user.uid
                        });
                        setOnlineStatus('Firebase no confirmó tu lugar en la sala. Vuelve al listado y prueba con una sala nueva.');
                        return;
                    }

                    setRoomCode(code);
                    setIsRoomHost(false);
                    setGameMode('ONLINE');
                    setGameState('BUILD');
                    setBuilderPlayer(2);
                    setOnlineStatus('Conectado. Construye tus 2 MITs.');
                    setDisconnectedPlayer(null);
                    // Registra presencia antes de comenzar a construir/pelear.
                    await registerOnlinePresence(code, 2);
                    subscribeToOnlineRoom(code, 2);
                } catch (error) {
                    console.error('Error al entrar a la sala (' + joinStep + '):', error);
                    const errorCode = String(error?.code || '').toUpperCase();
                    const errorMessage = String(error?.message || '');
                    const permissionDenied =
                        errorCode.includes('PERMISSION_DENIED') ||
                        errorCode.includes('PERMISSION-DENIED') ||
                        /permission denied/i.test(errorMessage);

                    if (permissionDenied && joinStep === 'reserva del lugar') {
                        setOnlineStatus('Firebase rechazó la reserva. Puede que otro jugador haya ocupado la sala o que las reglas de /rooms/$roomId no estén publicadas correctamente.');
                    } else if (permissionDenied) {
                        setOnlineStatus('Firebase denegó el acceso durante ' + joinStep + '. Revisa las reglas de lectura de /rooms/$roomId.');
                    } else {
                        setOnlineStatus('Error al entrar: ' + (errorMessage || 'Error desconocido.'));
                    }
                } finally {
                    isJoiningRoomRef.current = false;
                    setIsJoiningRoom(false);
                }
            };

            const subscribeToOnlineRoom = (code, localPlayerNum) => {
                if (!window.MITSFirebase || !code) return;
                if (onlineListenerRef.current) {
                    window.MITSFirebase.off(onlineListenerRef.current.ref, 'value', onlineListenerRef.current.handler);
                    if (onlineListenerRef.current.presenceRef && onlineListenerRef.current.presenceHandler) {
                        window.MITSFirebase.off(onlineListenerRef.current.presenceRef, 'value', onlineListenerRef.current.presenceHandler);
                    }
                }
                if (presenceGraceTimerRef.current !== null) {
                    clearTimeout(presenceGraceTimerRef.current);
                    presenceGraceTimerRef.current = null;
                }

                const firebase = window.MITSFirebase;
                const roomRef = firebase.ref(firebase.db, `rooms/${code}`);
                const opponentNum = localPlayerNum === 1 ? 2 : 1;
                const opponentPresenceRef = firebase.ref(firebase.db, `rooms/${code}/presence/player${opponentNum}`);
                let currentRoomStatus = null;
                let opponentPresenceKnown = false;
                let opponentIsPresent = false;

                const clearPresenceGraceTimer = () => {
                    if (presenceGraceTimerRef.current !== null) {
                        clearTimeout(presenceGraceTimerRef.current);
                        presenceGraceTimerRef.current = null;
                    }
                };

                const schedulePresenceCheck = () => {
                    if (!['building', 'battle', 'berserker_build'].includes(currentRoomStatus) || presenceGraceTimerRef.current !== null) return;
                    presenceGraceTimerRef.current = setTimeout(async () => {
                        presenceGraceTimerRef.current = null;
                        try {
                            const [presenceSnapshot, roomSnapshot] = await Promise.all([
                                firebase.get(opponentPresenceRef),
                                firebase.get(roomRef)
                            ]);
                            const latestRoom = roomSnapshot.exists() ? roomSnapshot.val() : null;
                            if (!presenceSnapshot.exists() && ['building', 'battle', 'berserker_build'].includes(latestRoom?.status)) {
                                // La transacción evita que ambos clientes sobrescriban
                                // al mismo tiempo quién abandonó la partida.
                                await firebase.runTransaction(roomRef, current => {
                                    if (!current || !['building', 'battle', 'berserker_build'].includes(current.status)) return;
                                    return {
                                        ...current,
                                        status: 'player_left',
                                        disconnectedPlayer: opponentNum,
                                        ...(['battle', 'berserker_build'].includes(current.status) ? { winner: localPlayerNum } : {})
                                    };
                                });
                            }
                        } catch (error) {
                            console.warn('No se pudo verificar la desconexión del rival:', error);
                        }
                    }, 6000);
                };

                const presenceHandler = snapshot => {
                    opponentPresenceKnown = true;
                    opponentIsPresent = snapshot.exists();
                    if (!['building', 'battle', 'berserker_build'].includes(currentRoomStatus) || opponentIsPresent) {
                        clearPresenceGraceTimer();
                    } else {
                        schedulePresenceCheck();
                    }
                };

                const handler = snapshot => {
                    const room = snapshot.val();
                    if (!room) return;
                    currentRoomStatus = room.status || null;
                    if (!['building', 'battle', 'berserker_build'].includes(currentRoomStatus)) {
                        clearPresenceGraceTimer();
                        if (currentRoomStatus === 'gameover') {
                            // A partir de GAMEOVER usamos el onDisconnect de la sala
                            // ya existente para conservar la lógica del ganador.
                            stopOnlinePresenceListener();
                        }
                    } else if (opponentPresenceKnown && !opponentIsPresent) {
                        schedulePresenceCheck();
                    } else if (!opponentPresenceKnown) {
                        firebase.get(opponentPresenceRef).then(presenceHandler).catch(error => {
                            console.warn('No se pudo consultar la presencia del rival:', error);
                        });
                    }
                    setP1Mits(room.p1Mits || []);
                    setP2Mits(room.p2Mits || []);
                    setBerserkerRebuild(room.berserkerRebuild || null);
                    setActiveP1Index(room.activeP1Index || 0);
                    setActiveP2Index(room.activeP2Index || 0);
                    setCurrentTurnPlayer(room.currentTurnPlayer || 1);
                    currentTurnPlayerRef.current = room.currentTurnPlayer || 1;
                    setCombatPhase(room.combatPhase || 'ATTACK_ROLL');
                    if (!isRollingRef.current) {
                        const syncedRoll = Number(room.currentRollValue) || 1;
                        setCurrentRollValue(syncedRoll);
                        lastRollValueRef.current = syncedRoll;
                    }
                    setAttackResult(room.attackResult || null);
                    setCombatLog(room.combatLog || []);
                    if (room.floatingEffect?.id && room.floatingEffect.id !== lastFloatingEffectIdRef.current) {
                        displayFloatingEffect(room.floatingEffect);
                    }
                    if (room.status === 'waiting') {
                        setGameState('ONLINE_LOBBY');
                        setOnlineStatus('Esperando al Jugador 2...');
                    } else if (room.status === 'building') {
                        setGameState('BUILD');
                        if (room.guestUid && room.hostUid) setOnlineStatus('Ambos jugadores conectados.');
                    } else if (room.status === 'berserker_build') {
                        setGameState('BUILD');
                        setBuilderPlayer(room.berserkerRebuild?.playerNum || 1);
                        setSelectedClass({ ...MIT_CLASSES.find(c => c.id === 'Resistente1'), name: 'Berserker · Fase 2', hp: 3, d: 1, a: 5 });
                        setCurrentDNums([]);
                        setCurrentANums([]);
                        setOnlineStatus(room.berserkerRebuild?.playerNum === localPlayerNum ? 'Asigna 1 cara de ataque y 5 de esquive para la segunda fase.' : 'El Berserker rival está reconstruyendo su segunda fase.');
                    } else if (room.status === 'battle') {
                        setBerserkerRebuild(null);
                        setGameState('BATTLE');
                        setIsTurnProcessing(false);
                        if (!isRollingRef.current) setIsRolling(false);
                        setOnlineStatus((room.currentTurnPlayer === localPlayerNum) ? 'Es tu turno.' : 'Turno del rival.');
                    } else if (room.status === 'gameover') {
                        setWinnerPlayer(room.winner || null);
                        setGameState('GAMEOVER');
                        // Mantiene preparada la notificación si cualquiera cierra la
                        // página después de terminar la partida. No modifica winner.
                        registerOnlineDisconnect(code, localPlayerNum).catch(error => {
                            console.warn('No se pudo preparar la notificación de salida:', error);
                        });
                    } else if (room.status === 'player_left') {
                        setWinnerPlayer(room.winner || null);
                        setDisconnectedPlayer(room.disconnectedPlayer || null);
                        setGameState('GAMEOVER');
                        setIsTurnProcessing(false);
                        setOnlineStatus(`El Jugador ${room.disconnectedPlayer || '?'} salió de la partida.`);
                    }
                    if (room.guestUid && room.status === 'waiting' && localPlayerNum === 1) {
                        window.MITSFirebase.update(roomRef, { status: 'building' });
                    }
                };
                firebase.onValue(roomRef, handler);
                firebase.onValue(opponentPresenceRef, presenceHandler);
                onlineListenerRef.current = {
                    ref: roomRef,
                    handler,
                    presenceRef: opponentPresenceRef,
                    presenceHandler
                };
            };

            const syncOnline = async (changes) => {
                if (gameMode !== 'ONLINE' || !roomCode) return;
                try { await window.MITSFirebase.update(onlineRoomRef(), changes); }
                catch (error) { console.error('Firebase sync:', error); setOnlineStatus('Error de sincronización.'); }
            };

            const publishFloatingEffect = (effect) => {
                const event = {
                    ...effect,
                    id: `${Date.now()}_${Math.random().toString(36).slice(2, 9)}`,
                    createdAt: Date.now()
                };
                displayFloatingEffect(event);
                if (gameMode === 'ONLINE') syncOnline({ floatingEffect: event });
            };

            // --- BUILDER ACTIONS ---
            const handleSelectClass = (c) => {
                playSound('click');
                setSelectedClass(c);
                setCurrentDNums([]);
                setCurrentANums([]);
            };

            const handleToggleNumber = (num) => {
                playSound('click');
                if (currentDNums.includes(num)) {
                    setCurrentDNums(currentDNums.filter(n => n !== num));
                    return;
                }
                if (currentANums.includes(num)) {
                    setCurrentANums(currentANums.filter(n => n !== num));
                    return;
                }
                if (currentDNums.length < selectedClass.d) {
                    setCurrentDNums([...currentDNums, num].sort((a,b) => a-b));
                    return;
                }
                if (currentANums.length < selectedClass.a) {
                    setCurrentANums([...currentANums, num].sort((a,b) => a-b));
                    return;
                }
            };

            const isBuildValid = currentDNums.length === selectedClass.d && currentANums.length === selectedClass.a;

            const handleConfirmMit = async () => {
                if (!isBuildValid || isSubmittingMitRef.current) return;
                isSubmittingMitRef.current = true;
                try {
                    playSound('click');

                    const newMit = {
                        id: `mit_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                        classData: selectedClass,
                        name: `MIT ${selectedClass.name}`,
                        maxHp: selectedClass.hp,
                        currentHp: selectedClass.hp,
                        attackNums: [...currentDNums],
                        evadeNums: [...currentANums],
                        passiveState: window.MITSGameRules.createPassiveState(selectedClass.id)
                    };

                    if (berserkerRebuild) {
                        const phaseTwoLog = [...combatLog, { type: 'system', text: '🔥 Berserker completó su transformación. Comienza su segunda fase con 3 HP.' }];
                        if (gameMode === 'ONLINE') {
                            const expectedPlayer = isRoomHost ? 1 : 2;
                            if (expectedPlayer !== berserkerRebuild.playerNum) {
                                setOnlineStatus('Esperando a que el dueño del Berserker asigne su dado.');
                                return;
                            }
                            const user = onlineUser || await window.MITSFirebase.ready;
                            const roomRef = onlineRoomRef();
                            const tx = await window.MITSFirebase.runTransaction(roomRef, room => {
                                if (!room || room.status !== 'berserker_build' ||
                                    room.berserkerRebuild?.playerNum !== expectedPlayer) return;
                                const playerKey = expectedPlayer === 1 ? 'p1Mits' : 'p2Mits';
                                const opponentKey = expectedPlayer === 1 ? 'p2Mits' : 'p1Mits';
                                const updated = Array.isArray(room[playerKey]) ? [...room[playerKey]] : [];
                                const original = updated[berserkerRebuild.index];
                                const transformed = window.MITSGameRules.activateBerserkerSecondPhase(original, currentDNums, currentANums);
                                if (!transformed) return;
                                updated[berserkerRebuild.index] = transformed;
                                const opponents = Array.isArray(room[opponentKey]) ? [...room[opponentKey]] : [];
                                const opponentIndex = expectedPlayer === 1 ? (room.activeP2Index || 0) : (room.activeP1Index || 0);
                                if (opponents[opponentIndex]) {
                                    const opponentState = { ...window.MITSGameRules.createPassiveState(opponents[opponentIndex].classData?.id), ...(opponents[opponentIndex].passiveState || {}) };
                                    opponentState.shadowInvulnerableTurns = 0;
                                    opponentState.shadowCooldownTurns = 0;
                                    opponentState.counterCooldownTurns = 0;
                                    opponentState.technicalAttackBonus = false;
                                    opponentState.technicalDefenseBonus = false;
                                    opponentState.counterSequence = null;
                                    opponents[opponentIndex] = { ...opponents[opponentIndex], passiveState: opponentState };
                                }
                                return {
                                    ...room,
                                    [playerKey]: updated,
                                    [opponentKey]: opponents,
                                    status: 'battle',
                                    berserkerRebuild: null,
                                    currentTurnPlayer: expectedPlayer,
                                    combatPhase: 'ATTACK_ROLL',
                                    attackResult: null,
                                    combatLog: phaseTwoLog
                                };
                            });
                            if (!tx.committed) {
                                setOnlineStatus('No se pudo completar la transformación. Vuelve a intentarlo.');
                                return;
                            }
                            const room = tx.snapshot?.val?.();
                            if (room) {
                                setP1Mits(room.p1Mits || []);
                                setP2Mits(room.p2Mits || []);
                            }
                        } else {
                            const list = berserkerRebuild.playerNum === 1 ? [...p1Mits] : [...p2Mits];
                            const transformed = window.MITSGameRules.activateBerserkerSecondPhase(list[berserkerRebuild.index], currentDNums, currentANums);
                            if (!transformed) {
                                setOnlineStatus('La distribución del dado no es válida.');
                                return;
                            }
                            list[berserkerRebuild.index] = transformed;
                            if (berserkerRebuild.playerNum === 1) setP1Mits(list); else setP2Mits(list);
                            const opponentList = berserkerRebuild.playerNum === 1 ? [...p2Mits] : [...p1Mits];
                            const opponentIndex = berserkerRebuild.playerNum === 1 ? activeP2Index : activeP1Index;
                            if (opponentList[opponentIndex]) {
                                const opponent = opponentList[opponentIndex];
                                const state = { ...window.MITSGameRules.createPassiveState(opponent.classData?.id), ...(opponent.passiveState || {}) };
                                state.shadowInvulnerableTurns = 0;
                                state.shadowCooldownTurns = 0;
                                state.counterCooldownTurns = 0;
                                state.technicalAttackBonus = false;
                                state.technicalDefenseBonus = false;
                                state.counterSequence = null;
                                opponentList[opponentIndex] = { ...opponent, passiveState: state };
                                if (berserkerRebuild.playerNum === 1) setP2Mits(opponentList); else setP1Mits(opponentList);
                            }
                        }
                        setBerserkerRebuild(null);
                        setSelectedClass(MIT_CLASSES[2]);
                        setCurrentDNums([]);
                        setCurrentANums([]);
                        setGameState('BATTLE');
                        setCombatPhase('ATTACK_ROLL');
                        setAttackResult(null);
                        setCurrentTurnPlayer(berserkerRebuild.playerNum);
                        currentTurnPlayerRef.current = berserkerRebuild.playerNum;
                        setCombatLog(phaseTwoLog);
                        setIsTurnProcessing(false);
                        if (gameMode !== 'ONLINE') {
                            if (gameMode === 'AI' && berserkerRebuild.playerNum === 2) {
                                scheduleGameTimeout(() => triggerAiTurn(), 800);
                            }
                        }
                        return;
                    }

                    if (gameMode === 'ONLINE') {
                        const user = onlineUser || await window.MITSFirebase.ready;
                        const roomRef = onlineRoomRef();
                        const tx = await window.MITSFirebase.runTransaction(roomRef, room => {
                            if (!room || !['building', 'waiting'].includes(room.status)) return;
                            const playerKey = room.hostUid === user.uid ? 'p1Mits'
                                : room.guestUid === user.uid ? 'p2Mits' : null;
                            if (!playerKey) return;
                            const current = Array.isArray(room[playerKey]) ? room[playerKey] : [];
                            if (current.length >= 2) return;
                            const updated = [...current, newMit];
                            const otherKey = playerKey === 'p1Mits' ? 'p2Mits' : 'p1Mits';
                            const otherReady = Array.isArray(room[otherKey]) && room[otherKey].length === 2;
                            const bothReady = otherReady && updated.length === 2;
                            return {
                                ...room,
                                [playerKey]: updated,
                                status: bothReady ? 'battle' : 'building',
                                ...(bothReady ? {
                                    currentTurnPlayer: 1, combatPhase: 'ATTACK_ROLL',
                                    activeP1Index: 0, activeP2Index: 0,
                                    currentRollValue: 1, attackResult: null,
                                    combatLog: [{ type: 'system', text: '⚔️ ¡COMBATE ONLINE INICIADO!' }]
                                } : {})
                            };
                        });
                        if (!tx.committed) {
                            setOnlineStatus('No se pudo guardar el MIT. Comprueba que la sala siga activa.');
                            return;
                        }
                        setCurrentDNums([]);
                        setCurrentANums([]);
                        setSelectedClass(MIT_CLASSES[2]);
                        return;
                    }

                    if (builderPlayer === 1) {
                        const updated = [...p1Mits, newMit];
                        setP1Mits(updated);
                        setCurrentDNums([]);
                        setCurrentANums([]);
                        if (updated.length === 2) {
                            if (gameMode === 'AI') {
                                const aiList = [generateAiMit(1), generateAiMit(2)];
                                setP2Mits(aiList);
                                startBattle(updated, aiList);
                            } else {
                                setBuilderPlayer(2);
                            }
                        }
                    } else {
                        const updated = [...p2Mits, newMit];
                        setP2Mits(updated);
                        setCurrentDNums([]);
                        setCurrentANums([]);
                        if (updated.length === 2) startBattle(p1Mits, updated);
                    }
                } catch (error) {
                    console.error('Error al confirmar MIT:', error);
                    setOnlineStatus('No se pudo guardar el MIT: ' + error.message);
                } finally {
                    isSubmittingMitRef.current = false;
                }
            };

            const startBattle = (p1, p2) => {
                // Cada combate comienza desde un estado visual y lógico limpio.
                // Evita arrastrar resultados, efectos o valores de dado de otra partida.
                gameSessionRef.current += 1;
                cancelGameTimers();
                setGameState('BATTLE');
                setP1Mits(p1);
                setP2Mits(p2);
                setActiveP1Index(0);
                setActiveP2Index(0);
                currentTurnPlayerRef.current = 1;
                setCurrentTurnPlayer(1);
                setCombatPhase('ATTACK_ROLL');
                setAttackResult(null);
                setFloatingEffect(null);
                setCurrentRollValue(1);
                lastRollValueRef.current = 1;
                isRollingRef.current = false;
                setIsTurnProcessing(false);
                setIsRolling(false);
                aiTurnInProgressRef.current = false;
                if (aiTurnTimerRef.current !== null) {
                    clearTimeout(aiTurnTimerRef.current);
                    aiTurnTimerRef.current = null;
                }
                const initialLog = [{
                    type: 'system',
                    text: gameMode === 'ONLINE' ? '⚔️ ¡COMBATE ONLINE INICIADO!' : '⚔️ ¡COMBATE INICIADO! Ambos jugadores revelan su primer MIT.'
                }];
                setCombatLog(initialLog);
                if (gameMode === 'ONLINE') {
                    syncOnline({ status: 'battle', p1Mits: p1, p2Mits: p2, activeP1Index: 0, activeP2Index: 0, currentTurnPlayer: 1, combatPhase: 'ATTACK_ROLL', currentRollValue: 1, attackResult: null, combatLog: initialLog, winner: null });
                }
            };

            // --- COMBAT LOGIC ---
            const passiveIndicators = (mit) => {
                const state = { ...window.MITSGameRules.createPassiveState(mit?.classData?.id), ...(mit?.passiveState || {}) };
                const id = mit?.classData?.id;
                const items = [];
                if (id === 'Agil1') items.push(`Ultra Impulso: ${state.ultraCharges}/3`);
                if (id === 'Agil2') { if (state.shadowInvulnerableTurns > 0) items.push('Sombra: invulnerable (1 turno rival)'); else if (state.shadowCooldownTurns > 0) items.push(`Sombra: enfriamiento (${state.shadowCooldownTurns})`); else items.push('Sombra: lista'); }
                if (id === 'Normal1') { if (state.technicalAttackBonus) items.push('Ataque +1 guardado'); if (state.technicalDefenseBonus) items.push('Defensa +1 guardada'); }
                if (id === 'Normal2') items.push(`Adaptabilidad: ${state.adaptabilityCharges}/2`);
                if (id === 'Resistente1') items.push(state.berserkerPhase === 2 ? 'Último Instinto: FASE 2 · 3 HP' : 'Último Instinto: fase 1');
                if (id === 'Resistente2') { const v = state.murallaHits === 0 ? '+2 daño' : state.murallaHits === 1 ? '+1 daño' : 'sin vulnerabilidad'; const r = Math.min(3, Math.max(0, state.murallaHits - 1)); items.push(`Revestimiento: ${state.murallaHits}/4 · ${v} · reducción ${r}`); }
                if (id === 'Dano1') items.push(`Enfurecimiento: daño +${state.destructorBonus}`);
                if (id === 'Dano2') items.push(state.counterSequence?.phase === 'FIRST' ? 'Contraataque: 1/2' : state.counterSequence?.phase === 'SECOND' ? 'Contraataque: 2/2' : state.counterCooldownTurns > 0 ? `Contraataque: enfriamiento ${state.counterCooldownTurns}` : 'Contraataque: listo');
                return items;
            };

            const activeP1Mit = p1Mits[activeP1Index] || {};
            const activeP2Mit = p2Mits[activeP2Index] || {};
            activeP2MitRef.current = activeP2Mit;

            const currentAttacker = currentTurnPlayer === 1 ? activeP1Mit : activeP2Mit;
            const currentDefender = currentTurnPlayer === 1 ? activeP2Mit : activeP1Mit;
            const currentTurnMits = currentTurnPlayer === 1 ? p1Mits : p2Mits;
            const currentTurnActiveIndex = currentTurnPlayer === 1 ? activeP1Index : activeP2Index;
            const availableMitIndex = window.MITSGameRules.findAvailableMitIndex(
                currentTurnMits,
                currentTurnActiveIndex
            );
            const availableMit = availableMitIndex === null ? null : currentTurnMits[availableMitIndex];

            const executeRollAnimation = (finalValue, callback) => {
                const session = gameSessionRef.current;
                isRollingRef.current = true;
                setIsRolling(true);
                playSound('roll');
                let count = 0;
                const interval = setInterval(() => {
                    if (session !== gameSessionRef.current) {
                        clearInterval(interval);
                        if (rollIntervalRef.current === interval) rollIntervalRef.current = null;
                        return;
                    }
                    const animatedValue = Math.floor(Math.random() * 6) + 1;
                    setCurrentRollValue(animatedValue);
                    lastRollValueRef.current = animatedValue;
                    count++;
                    if (count >= 10) {
                        clearInterval(interval);
                        if (rollIntervalRef.current === interval) rollIntervalRef.current = null;
                        setCurrentRollValue(finalValue);
                        lastRollValueRef.current = finalValue;
                        isRollingRef.current = false;
                        setIsRolling(false);
                        callback();
                    }
                }, 60);
                rollIntervalRef.current = interval;
            };

            // Attack Roll
            const handleAttackRoll = () => {
                if (isRolling || isTurnProcessing || combatPhase !== 'ATTACK_ROLL') return;
                if (gameMode === 'ONLINE' && currentTurnPlayer !== (isRoomHost ? 1 : 2)) return;

                setIsTurnProcessing(true);
                const roll = Math.floor(Math.random() * 6) + 1;
                executeRollAnimation(roll, () => {
                    const turnStart = window.MITSGameRules.beginPassiveAttackTurn(currentAttacker);
                    const attackerAtTurnStart = { ...currentAttacker, passiveState: turnStart.state };
                    const passiveAttack = window.MITSGameRules.resolvePassiveAttack({ attacker: attackerAtTurnStart, roll });
                    const isHit = passiveAttack.hit;
                    const updatedAttackerMits = [...currentTurnMits];
                    updatedAttackerMits[currentTurnActiveIndex] = { ...attackerAtTurnStart, passiveState: passiveAttack.state };
                    turnStart.events.forEach(event => publishFloatingEffect({ player: currentTurnPlayer, text: event, type: 'hit' }));
                    passiveAttack.events.forEach(event => publishFloatingEffect({ player: currentTurnPlayer, text: event, type: 'hit' }));
                    if (currentTurnPlayer === 1) setP1Mits(updatedAttackerMits); else setP2Mits(updatedAttackerMits);
                    if (gameMode === 'ONLINE') syncOnline(currentTurnPlayer === 1 ? { p1Mits: updatedAttackerMits } : { p2Mits: updatedAttackerMits });
                    if (isHit) {
                        playSound('hit');
                        setCurrentRollValue(passiveAttack.roll);
                        const atkData = { success: true, damage: passiveAttack.damage, roll: passiveAttack.roll, unstoppable: passiveAttack.unstoppable, attackerPassiveState: passiveAttack.state, counterChain: currentAttacker.passiveState?.counterSequence?.phase === 'SECOND' };
                        if (currentAttacker.passiveState?.counterSequence?.phase === 'FIRST') {
                            const defenderNum = currentTurnPlayer === 1 ? 2 : 1;
                            const forcedResult = window.MITSGameRules.resolvePassiveDefense({ attacker: { ...currentAttacker, passiveState: passiveAttack.state }, defender: currentDefender, attackDamage: passiveAttack.damage, forceHit: true, allowCounterTrigger: false });
                            const counterLog = [...combatLog, { type: 'attack_hit', text: `⚔️ Contraataque 1/2 de ${currentAttacker.name}: el rival no puede defenderse.` }];
                            setCombatLog(counterLog);
                            setCombatPhase('RESOLVING');
                            setIsTurnProcessing(false);
                            publishFloatingEffect({ player: currentTurnPlayer, text: 'CONTRAATAQUE 1/2', type: 'hit' });
                            applyDamageToDefender(defenderNum, forcedResult.damage, counterLog, null, forcedResult, currentTurnPlayer);
                            return;
                        }
                        const newLog = [...combatLog, {
                            type: 'attack_hit',
                            text: `🎯 Jugador ${currentTurnPlayer} (${currentAttacker.name}) sacó [${passiveAttack.roll}] → ¡Ataque Exitoso! El rival debe defender.`
                        }];
                        setAttackResult(atkData);
                        setCombatPhase('DEFENSE_ROLL');
                        setIsTurnProcessing(false);
                        setCombatLog(newLog);
                        if (gameMode === 'ONLINE') syncOnline({ currentRollValue: passiveAttack.roll, attackResult: atkData, combatPhase: 'DEFENSE_ROLL', combatLog: newLog });
                        publishFloatingEffect({
                            player: currentTurnPlayer,
                            text: '¡ACERTÓ!',
                            type: 'hit'
                        });

                        if (gameMode === 'AI' && currentTurnPlayer === 1) {
                            scheduleGameTimeout(() => triggerAiDefense(atkData), 800);
                        }
                    } else {
                        // Attack Failed -> Switch Turn Directly
                        playSound('fail');
                        const newLog = [...combatLog, {
                            type: 'attack_miss',
                            text: `❌ Jugador ${currentTurnPlayer} (${currentAttacker.name}) sacó [${roll}] → Ataque Fallado. Pasa el turno al rival.`
                        }];
                        setAttackResult({ success: false, damage: 0, roll: passiveAttack.roll });
                        setCombatPhase('RESOLVING');
                        setCombatLog(newLog);
                        if (gameMode === 'ONLINE') syncOnline({ currentRollValue: roll, attackResult: { success: false, damage: 0, roll }, combatPhase: 'RESOLVING', combatLog: newLog });
                        publishFloatingEffect({
                            player: currentTurnPlayer === 1 ? 2 : 1,
                            text: '¡FALLÓ!',
                            type: 'miss'
                        });
                        
                        scheduleGameTimeout(() => endTurn(currentTurnPlayer, newLog), 1000);
                    }
                });
            };

            // Defense Roll
            const handleDefenseRoll = (overrideAttackData = null) => {
                if (isRolling || isTurnProcessing || (combatPhase !== 'DEFENSE_ROLL' && !overrideAttackData)) return;
                if (gameMode === 'ONLINE' && !overrideAttackData && currentTurnPlayer === (isRoomHost ? 1 : 2)) return;

                setIsTurnProcessing(true);
                const atkData = overrideAttackData || attackResult;
                const defenderPlayerNum = currentTurnPlayer === 1 ? 2 : 1;
                const roll = Math.floor(Math.random() * 6) + 1;

                executeRollAnimation(roll, () => {
                    // Resolver el esquive con valores normalizados y una única fórmula.
                    // Solo un número que esté explícitamente en evadeNums puede reducir daño.
                    const defenseResult = window.MITSGameRules.resolvePassiveDefense({
                        attacker: { ...currentAttacker, passiveState: atkData?.attackerPassiveState || currentAttacker.passiveState },
                        defender: currentDefender,
                        attackDamage: atkData?.damage,
                        defenseRoll: roll,
                        unstoppable: atkData?.unstoppable === true,
                        allowCounterTrigger: atkData?.counterChain !== true
                    });
                    const { isEvadeNumber, damage: finalDamageTaken } = defenseResult;

                    let defenseLogEntry;
                    if (isEvadeNumber || defenseResult.shadowNullified) {
                        playSound('dodge');

                        defenseLogEntry = {
                            type: 'defense_success',
                            text: `🛡️ Jugador ${defenderPlayerNum} (${currentDefender.name}) sacó [${roll}] en Esquive → Daño recibido: ${finalDamageTaken}`
                        };
                        setCombatLog(prev => [...prev, defenseLogEntry]);
                        publishFloatingEffect({
                            player: defenderPlayerNum,
                            text: finalDamageTaken === 0 ? '¡ESQUIVADO!' : `-${finalDamageTaken} HP`,
                            type: finalDamageTaken === 0 ? 'dodge' : 'damage'
                        });
                    } else {
                        playSound('hit');
                        defenseLogEntry = {
                            type: 'defense_fail',
                            text: `💥 Jugador ${defenderPlayerNum} (${currentDefender.name}) sacó [${roll}] en Esquive → Esquive fallido. Daño recibido: ${finalDamageTaken}`
                        };
                        setCombatLog(prev => [...prev, defenseLogEntry]);
                        publishFloatingEffect({
                            player: defenderPlayerNum,
                            text: `-${finalDamageTaken} HP`,
                            type: 'damage'
                        });
                    }

                    applyDamageToDefender(defenderPlayerNum, finalDamageTaken, [...combatLog, defenseLogEntry], roll, defenseResult, currentTurnPlayer);
                });
            };

            const triggerAiDefense = (atkData) => {
                handleDefenseRoll(atkData);
            };

            const applyDamageToDefender = (defenderPlayerNum, damage, logOverride = null, defenseRoll = null, passiveDefenseResult = null, attackerPlayerNum = defenderPlayerNum === 1 ? 2 : 1) => {
                let updatedP1 = p1Mits;
                let updatedP2 = p2Mits;
                let defeated = false;

                if (defenderPlayerNum === 1) {
                    const newHp = Math.max(0, activeP1Mit.currentHp - damage);
                    updatedP1 = [...p1Mits];
                    const hpLost = Math.max(0, activeP1Mit.currentHp - newHp);
                    const defenderWithState = { ...activeP1Mit, passiveState: passiveDefenseResult?.state || activeP1Mit.passiveState };
                    const attackerMit = attackerPlayerNum === 1 ? activeP1Mit : activeP2Mit;
                    const consequences = window.MITSGameRules.applyPassiveDamageConsequences({ attacker: { ...attackerMit, passiveState: passiveDefenseResult?.attackerState || attackerMit.passiveState }, defender: defenderWithState, hpLost, fullyDodged: passiveDefenseResult?.fullyDodged, shadowNullified: passiveDefenseResult?.shadowNullified });
                    consequences.events.forEach(event => publishFloatingEffect({ player: event.startsWith('Enfurecimiento') ? attackerPlayerNum : defenderPlayerNum, text: event, type: 'hit' }));
                    const counterState = newHp > 0 && passiveDefenseResult?.triggersCounter
                        ? { ...consequences.defenderState, counterSequence: { phase: 'FIRST', opponentPlayer: attackerPlayerNum } }
                        : consequences.defenderState;
                    updatedP1[activeP1Index] = { ...defenderWithState, currentHp: newHp, passiveState: counterState };
                    if (attackerPlayerNum === 2) { updatedP2 = [...p2Mits]; updatedP2[activeP2Index] = { ...activeP2Mit, passiveState: consequences.attackerState }; }
                    setP1Mits(updatedP1);
                    defeated = newHp === 0;
                } else {
                    const newHp = Math.max(0, activeP2Mit.currentHp - damage);
                    updatedP2 = [...p2Mits];
                    const hpLost = Math.max(0, activeP2Mit.currentHp - newHp);
                    const defenderWithState = { ...activeP2Mit, passiveState: passiveDefenseResult?.state || activeP2Mit.passiveState };
                    const attackerMit = attackerPlayerNum === 1 ? activeP1Mit : activeP2Mit;
                    const consequences = window.MITSGameRules.applyPassiveDamageConsequences({ attacker: { ...attackerMit, passiveState: passiveDefenseResult?.attackerState || attackerMit.passiveState }, defender: defenderWithState, hpLost, fullyDodged: passiveDefenseResult?.fullyDodged, shadowNullified: passiveDefenseResult?.shadowNullified });
                    consequences.events.forEach(event => publishFloatingEffect({ player: event.startsWith('Enfurecimiento') ? attackerPlayerNum : defenderPlayerNum, text: event, type: 'hit' }));
                    const counterState = newHp > 0 && passiveDefenseResult?.triggersCounter
                        ? { ...consequences.defenderState, counterSequence: { phase: 'FIRST', opponentPlayer: attackerPlayerNum } }
                        : consequences.defenderState;
                    updatedP2[activeP2Index] = { ...defenderWithState, currentHp: newHp, passiveState: counterState };
                    if (attackerPlayerNum === 1) { updatedP1 = [...p1Mits]; updatedP1[activeP1Index] = { ...activeP1Mit, passiveState: consequences.attackerState }; }
                    setP2Mits(updatedP2);
                    defeated = newHp === 0;
                }

                passiveDefenseResult?.events?.forEach(event => publishFloatingEffect({ player: defenderPlayerNum, text: event, type: 'hit' }));
                if (passiveDefenseResult?.triggersCounter && !defeated) {
                    logOverride = [...(Array.isArray(logOverride) ? logOverride : combatLog), {
                        type: 'system',
                        text: '⚔️ ¡CONTRAATAQUE! Duelista atacará dos veces: el primer golpe no se puede defender y el rival pierde su siguiente ataque.'
                    }];
                    setCombatLog(logOverride);
                    publishFloatingEffect({ player: defenderPlayerNum, text: '¡CONTRAATAQUE!', type: 'hit' });
                }

                setP1Mits(updatedP1);
                setP2Mits(updatedP2);

                if (gameMode === 'ONLINE') {
                    const nextLog = logOverride || combatLog;
                    syncOnline({
                        p1Mits: updatedP1, p2Mits: updatedP2,
                        combatLog: nextLog, attackResult: null, combatPhase: 'RESOLVING',
                        ...(Number.isInteger(defenseRoll) ? { currentRollValue: defenseRoll } : {})
                    });
                }

                if (defeated) {
                    handleMitDefeated(defenderPlayerNum, defenderPlayerNum === 1 ? updatedP1 : updatedP2, logOverride, { p1Mits: updatedP1, p2Mits: updatedP2 });
                    return;
                }

                scheduleGameTimeout(() => endTurn(attackerPlayerNum, logOverride, {
                        p1Mits: updatedP1,
                        p2Mits: updatedP2
                    }), 1000);
            };

            const handleMitDefeated = (playerNum, updatedMits, logOverride = null, allMits = null) => {
                const finalP1Mits = allMits?.p1Mits || (playerNum === 1 ? updatedMits : p1Mits);
                const finalP2Mits = allMits?.p2Mits || (playerNum === 2 ? updatedMits : p2Mits);
                if (playerNum === 1) setP1Mits(finalP1Mits); else setP2Mits(finalP2Mits);
                // Conservamos en una sola secuencia el registro de defensa y el KO.
                const baseLog = Array.isArray(logOverride) ? logOverride : combatLog;
                const koLog = [...baseLog, {
                    type: 'ko',
                    text: `☠️ ¡MIT de Jugador ${playerNum} fue DERROTADO!`
                }];
                setCombatLog(koLog);

                const defeatedActiveIndex = playerNum === 1 ? activeP1Index : activeP2Index;
                const defeatedMit = updatedMits[defeatedActiveIndex];
                const defeatedState = defeatedMit?.passiveState || {};
                if (defeatedMit?.classData?.id === 'Resistente1' && defeatedState.berserkerPhase !== 2) {
                    const rebuild = { playerNum, index: defeatedActiveIndex };
                    const rebuildLog = [...koLog, {
                        type: 'system',
                        text: '🔥 ¡ÚLTIMO INSTINTO! Berserker entra en su segunda fase con 3 HP. Debe reasignar el dado: 1 cara D y 5 caras A.'
                    }];
                    if (gameMode === 'AI' && playerNum === 2) {
                        const faces = [1, 2, 3, 4, 5, 6];
                        const chosen = faces[Math.floor(Math.random() * faces.length)];
                        const phaseTwo = window.MITSGameRules.activateBerserkerSecondPhase(defeatedMit, [chosen], faces.filter(n => n !== chosen));
                        const aiUpdated = [...updatedMits];
                        aiUpdated[defeatedActiveIndex] = phaseTwo;
                        const humanUpdated = [...finalP1Mits];
                        if (humanUpdated[activeP1Index]) {
                            const humanMit = humanUpdated[activeP1Index];
                            const humanState = { ...window.MITSGameRules.createPassiveState(humanMit.classData?.id), ...(humanMit.passiveState || {}) };
                            humanState.shadowInvulnerableTurns = 0;
                            humanState.shadowCooldownTurns = 0;
                            humanState.counterCooldownTurns = 0;
                            humanState.technicalAttackBonus = false;
                            humanState.technicalDefenseBonus = false;
                            humanState.counterSequence = null;
                            humanUpdated[activeP1Index] = { ...humanMit, passiveState: humanState };
                        }
                        setP1Mits(humanUpdated);
                        setP2Mits(aiUpdated);
                        const aiLog = [...rebuildLog, { type: 'system', text: `🤖 La IA asignó ${chosen} a D y el resto a A.` }];
                        setCombatLog(aiLog);
                        scheduleGameTimeout(() => endTurn(1, aiLog, { p1Mits: humanUpdated, p2Mits: aiUpdated }), 900);
                    } else {
                        if (playerNum === 1) setP1Mits(updatedMits); else setP2Mits(updatedMits);
                        setBerserkerRebuild(rebuild);
                        setBuilderPlayer(playerNum);
                        setSelectedClass({ ...MIT_CLASSES.find(c => c.id === 'Resistente1'), name: 'Berserker · Fase 2', hp: 3, d: 1, a: 5 });
                        setCurrentDNums([]);
                        setCurrentANums([]);
                        setGameState('BUILD');
                        setCombatLog(rebuildLog);
                        if (gameMode === 'ONLINE') {
                            syncOnline({
                                status: 'berserker_build',
                                berserkerRebuild: rebuild,
                                p1Mits: finalP1Mits,
                                p2Mits: finalP2Mits,
                                combatLog: rebuildLog,
                                attackResult: null,
                                combatPhase: 'RESOLVING'
                            });
                        }
                    }
                    return;
                }

                if (gameMode === 'ONLINE') {
                    // Publica el KO sin adelantar todavía el turno: el MIT sustituto
                    // debe entrar antes de habilitar la siguiente tirada.
                    syncOnline({
                        p1Mits: finalP1Mits,
                        p2Mits: finalP2Mits,
                        combatLog: koLog,
                        attackResult: null,
                        combatPhase: 'RESOLVING'
                    });
                }

                const reserveIndex = window.MITSGameRules.findAvailableMitIndex(
                    updatedMits,
                    defeatedActiveIndex
                );
                const defeatResolution = window.MITSGameRules.resolveMitDefeat({
                    defeatedPlayer: playerNum,
                    hasReserve: reserveIndex !== null
                });

                if (!defeatResolution || defeatResolution.isGameOver) {
                    if (defeatResolution) gameOver(defeatResolution.winner, koLog);
                    return;
                }

                const reserveMit = updatedMits[reserveIndex];
                const entryLog = [...koLog, {
                    type: 'system',
                    text: `🔄 Entra el MIT de reserva de Jugador ${playerNum}: ${reserveMit?.name || 'MIT de reserva'}`
                }];

                scheduleGameTimeout(() => {
                    if (playerNum === 1) setActiveP1Index(reserveIndex);
                    else setActiveP2Index(reserveIndex);
                    setCombatLog(entryLog);

                    // La regla de turno tras un KO se resuelve en el módulo puro.
                    // endTurn recibe al jugador anterior para que el turno pase al derrotado.
                    const playerWhoJustActed = defeatResolution.nextPlayer === 1 ? 2 : 1;
                    const onlineOverrides = playerNum === 1
                        ? { activeP1Index: reserveIndex, p1Mits: finalP1Mits, p2Mits: finalP2Mits }
                        : { activeP2Index: reserveIndex, p1Mits: finalP1Mits, p2Mits: finalP2Mits };
                    endTurn(playerWhoJustActed, entryLog, onlineOverrides);
                }, 1000);
            };

            const endTurn = (playerWhoJustActed, logOverride = null, onlineOverrides = {}) => {
                // No inferimos el turno desde el estado de un render anterior.
                // Quien llama esta función indica explícitamente quién acaba de jugar.
                if (playerWhoJustActed !== 1 && playerWhoJustActed !== 2) return;

                aiTurnInProgressRef.current = false;
                setAttackResult(null);
                setFloatingEffect(null);
                setCombatPhase('ATTACK_ROLL');

                let nextPlayer = playerWhoJustActed === 1 ? 2 : 1;
                let nextP1Mits = [...(onlineOverrides.p1Mits || p1Mits)];
                let nextP2Mits = [...(onlineOverrides.p2Mits || p2Mits)];
                const p1Index = Number.isInteger(onlineOverrides.activeP1Index) ? onlineOverrides.activeP1Index : activeP1Index;
                const p2Index = Number.isInteger(onlineOverrides.activeP2Index) ? onlineOverrides.activeP2Index : activeP2Index;

                const advanceList = (playerNum, list) => list.map(mit => {
                    if (!mit) return mit;
                    const advanced = window.MITSGameRules.advancePassiveTurn(mit, {
                        opponentTurnEnded: playerWhoJustActed !== playerNum,
                        ownTurnEnded: playerWhoJustActed === playerNum
                    });
                    advanced.events.forEach(event => publishFloatingEffect({ player: playerNum, text: event, type: 'hit' }));
                    return { ...mit, passiveState: advanced.state };
                });
                nextP1Mits = advanceList(1, nextP1Mits);
                nextP2Mits = advanceList(2, nextP2Mits);

                const actorList = playerWhoJustActed === 1 ? nextP1Mits : nextP2Mits;
                const actorIndex = playerWhoJustActed === 1 ? p1Index : p2Index;
                const actorMit = actorList[actorIndex];
                const sequence = actorMit?.passiveState?.counterSequence;
                let nextLog = Array.isArray(logOverride) ? [...logOverride] : [...combatLog];
                if (sequence?.phase === 'FIRST') {
                    const updatedActor = { ...actorMit, passiveState: { ...actorMit.passiveState, counterSequence: { ...sequence, phase: 'SECOND' } } };
                    actorList[actorIndex] = updatedActor;
                    nextPlayer = playerWhoJustActed;
                    nextLog.push({ type: 'system', text: '⚔️ El rival pierde su ataque. ¡Duelista realiza su segundo contraataque!' });
                } else if (sequence?.phase === 'SECOND') {
                    const updatedActor = { ...actorMit, passiveState: { ...actorMit.passiveState, counterSequence: null, counterCooldownTurns: 1 } };
                    actorList[actorIndex] = updatedActor;
                    nextLog.push({ type: 'system', text: '🛡️ Contraataque completado. El rival recupera su turno.' });
                }
                setP1Mits(nextP1Mits);
                setP2Mits(nextP2Mits);
                if (Array.isArray(logOverride) || sequence) setCombatLog(nextLog);
                currentTurnPlayerRef.current = nextPlayer;
                setCurrentTurnPlayer(nextPlayer);
                setIsTurnProcessing(false);

                if (gameMode === 'ONLINE') {
                    syncOnline({
                        ...onlineOverrides,
                        p1Mits: nextP1Mits,
                        p2Mits: nextP2Mits,
                        activeP1Index: p1Index,
                        activeP2Index: p2Index,
                        attackResult: null,
                        floatingEffect: null,
                        combatPhase: 'ATTACK_ROLL',
                        currentTurnPlayer: nextPlayer,
                        currentRollValue: lastRollValueRef.current,
                        combatLog: nextLog
                    });
                }

                // Solo puede existir una activación de IA pendiente.
                if (aiTurnTimerRef.current !== null) {
                    clearTimeout(aiTurnTimerRef.current);
                    aiTurnTimerRef.current = null;
                }

                if (gameMode === 'AI' && nextPlayer === 2) {
                    aiTurnTimerRef.current = scheduleGameTimeout(() => {
                        aiTurnTimerRef.current = null;
                        // Si el turno cambió durante la espera, se cancela la activación.
                        if (currentTurnPlayerRef.current === 2) triggerAiTurn();
                    }, 800);
                }
            };

            const handleSwitchMit = () => {
                if (gameState !== 'BATTLE' || combatPhase !== 'ATTACK_ROLL' ||
                    isRolling || isTurnProcessing || availableMitIndex === null || currentAttacker.passiveState?.counterSequence) {
                    return;
                }
                if (gameMode === 'ONLINE' &&
                    currentTurnPlayer !== (isRoomHost ? 1 : 2)) {
                    return;
                }
                // The AI is not a human-controlled side and does not use the manual switch UI.
                if (gameMode === 'AI' && currentTurnPlayer === 2) return;

                const playerNum = currentTurnPlayer;
                const switchLog = [...combatLog, {
                    type: 'system',
                    text: `🔄 Jugador ${playerNum} cambia ${currentAttacker.name} por ${availableMit.name}. Cede el turno al rival.`
                }];

                if (playerNum === 1) setActiveP1Index(availableMitIndex);
                else setActiveP2Index(availableMitIndex);
                setCombatLog(switchLog);
                playSound('click');

                const onlineOverrides = playerNum === 1
                    ? { activeP1Index: availableMitIndex, p1Mits, p2Mits }
                    : { activeP2Index: availableMitIndex, p1Mits, p2Mits };

                // Switching is a full turn action: the opponent acts next.
                endTurn(playerNum, switchLog, onlineOverrides);
            };

            const triggerAiTurn = () => {
                // La IA solo puede actuar una vez y únicamente durante su turno.
                if (gameState !== 'BATTLE' || gameMode !== 'AI' || currentTurnPlayerRef.current !== 2 || aiTurnInProgressRef.current) return;
                const aiMit = activeP2MitRef.current;
                if (!aiMit || !Array.isArray(aiMit.attackNums)) return;

                aiTurnInProgressRef.current = true;
                setIsTurnProcessing(true);
                const roll = Math.floor(Math.random() * 6) + 1;
                
                executeRollAnimation(roll, () => {
                    const turnStart = window.MITSGameRules.beginPassiveAttackTurn(aiMit);
                    const attackerAtTurnStart = { ...aiMit, passiveState: turnStart.state };
                    const passiveAttack = window.MITSGameRules.resolvePassiveAttack({ attacker: attackerAtTurnStart, roll });
                    const isHit = passiveAttack.hit;
                    const updatedAiMits = [...p2Mits];
                    updatedAiMits[activeP2Index] = { ...attackerAtTurnStart, passiveState: passiveAttack.state };
                    turnStart.events.forEach(event => publishFloatingEffect({ player: 2, text: event, type: 'hit' }));
                    passiveAttack.events.forEach(event => publishFloatingEffect({ player: 2, text: event, type: 'hit' }));
                    setP2Mits(updatedAiMits);
                    if (isHit) {
                        playSound('hit');
